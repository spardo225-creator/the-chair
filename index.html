  advice: {
    realist: 'Close it. Every state\'s first duty is survival. Compassion is a luxury of the secure.',
    liberal: 'Open it and make the bloc share the cost. That is what institutions are for.',
    constructivist: 'Whatever we choose tonight becomes who we are. Ask what story we want to tell about ourselves.',
    finance: 'The camps are cheapest this quarter. Openness is cheapest in ten years. Pick your decade.'
  }
},
{
  id: 'RJ2', area: 'rights', concept: 'Legitimacy', related: 'Human rights',
  actor: { name: 'Lantern Watch', type: 'NGO', icon: 'lantern' },
  title: 'The Lantern Report', case: 'Restrictions on foreign-funded NGOs',
  text: "Lantern Watch, a human rights NGO with offices in forty countries, has published a 64-page report on last month's demonstrations in {capital}. It documents 212 arrests, beatings in two police stations and a student who lost an eye to a rubber bullet. Your police chief calls it 'activist fiction paid for from abroad'. The report has been translated into six languages. The opposition wants answers in parliament by Friday.",
  options: [
    { label: 'Order an independent inquiry led by a retired judge, and publish whatever it finds.',
      effects: { power: -4, sov: -1, legit: 7, inter: 2, rel: { alvenmark: 1 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You let an independent body examine your own state. That weakens your control over the story and may embarrass your police, but it shows that the government accepts limits on its power, which is a strong source of legitimacy.',
        parallel: 'After riots in Brixton, London, in 1981, the UK government asked Lord Scarman, a senior judge, to investigate. His report criticised policing methods and led to reforms, including new rules on police conduct.',
        think: 'Evaluate the role of independent inquiries in rebuilding trust between citizens and the state.' } },
    { label: 'Deny everything and expel Lantern Watch from the country.',
      effects: { power: 3, sov: 6, legit: -7, inter: -3, rel: { alvenmark: -2 } }, setFlags: ['ngo_expelled'], tags: ['hostile'], theory: [3, 0, 1],
      debrief: {
        explain: 'You treated the NGO as a foreign threat to your sovereignty. Many governments argue that outside groups interfere in domestic politics. But expelling critics rarely makes the evidence disappear, and it tells the world you have something to hide.',
        parallel: 'Russia\'s 2012 "foreign agent" law required NGOs that received foreign funding and did broadly defined "political activity" to register and label their materials. Several prominent human rights groups were later forced to close. The government said it was preventing outside interference.',
        think: 'To what extent can a state justify restricting NGOs in the name of sovereignty?' } },
    { label: 'Introduce quiet reforms (new training, body cameras) without admitting fault.',
      effects: { power: -1, legit: 2, treasury: -40 }, theory: [1, 1, 1],
      debrief: {
        explain: 'You changed practice without changing the story. Quiet reform can reduce abuses, and it avoids a political fight. But victims often say that justice also needs acknowledgement, so the anger may not go away.',
        parallel: 'After protests in Ferguson, Missouri, in 2014, many US police departments adopted body-worn cameras. Later studies of their effects on police use of force have produced mixed results.',
        think: 'Discuss whether reforms without acknowledgement of wrongdoing can deliver justice.' } }
  ],
  advice: {
    realist: 'Expel them. A state that lets foreigners audit its police has already given away part of its sovereignty.',
    liberal: 'An independent inquiry. Courts and judges are how a state proves its power has limits.',
    constructivist: 'People believe what they see us do. Hiding confirms the report. An inquiry rewrites the story.',
    finance: 'Body cameras are cheap compared with a scandal. But a judge is cheaper than cameras, if you are brave.'
  }
},
{
  id: 'RJ3', area: 'rights', concept: 'Sovereignty', related: 'Justice',
  actor: { name: 'International Tribunal for Atrocity Crimes', type: 'IGO', icon: 'scales', state: 'auric' },
  title: 'Warrant on the Runway', case: 'Omar al-Bashir and the ICC',
  text: "The Auric Director's plane has just landed in {capital} for a regional trade summit. He is under an arrest warrant from the International Tribunal for Atrocity Crimes, which your country joined twelve years ago. As a member, you are legally obliged to arrest him. His delegation has brought signed energy contracts worth a year of your exports. Your chief prosecutor is waiting at the airport for instructions.",
  options: [
    { label: 'Arrest him at the airport. The law is the law.',
      effects: { power: -2, legit: 8, inter: -6, treasury: -60, rel: { auric: -5, alvenmark: 2 } },
      setFlags: ['director_arrested'], tags: ['hostile'], theory: [0, 2, 3],
      debrief: {
        explain: 'You put international law above a powerful partner. It shows that your commitments mean something and helps build a norm that no leader is above justice. But it turns an energy supplier into an enemy overnight.',
        parallel: 'In 1998, former Chilean dictator Augusto Pinochet was arrested in London on a Spanish warrant for human rights crimes. The case became a landmark for the idea that former heads of state can be held to account abroad.',
        think: 'To what extent should international justice override diplomatic and economic interests?' } },
    { label: 'Look away. Let the summit go ahead and let him fly home.',
      effects: { legit: -6, inter: 3, treasury: 120, rel: { auric: 2, alvenmark: -2 } },
      setFlags: ['warrant_ignored'], tags: ['cooperative'], theory: [3, 0, 0],
      debrief: {
        explain: 'You chose trade and stability over a legal obligation. Realists would say the Tribunal has no police of its own, so states decide what to enforce. But ignoring the warrant weakens the court and your reputation as a law-abiding state.',
        parallel: 'In 2015, Sudan\'s President Omar al-Bashir, wanted by the International Criminal Court, attended a summit in South Africa, an ICC member, and left without being arrested despite a court order. South Africa\'s Supreme Court of Appeal later ruled that the failure to arrest him was unlawful.',
        think: 'Examine why international courts depend on the cooperation of states.' } },
    { label: 'Announce that {country} will withdraw from the Tribunal.',
      effects: { power: 2, sov: 7, legit: -10, inter: -4, rel: { auric: 3, alvenmark: -3 } },
      setFlags: ['left_tribunal'], theory: [3, 0, 1],
      debrief: {
        explain: 'You reclaimed sovereignty by leaving the court altogether. Some governments argue that international courts unfairly target certain regions. But leaving to protect a suspect signals that you value a partner more than justice.',
        parallel: 'South Africa announced its withdrawal from the ICC in 2016, but revoked the notice in 2017 after its High Court ruled it unconstitutional without parliament\'s approval. Burundi became the first state to actually leave, in 2017.',
        think: 'Discuss whether international courts strengthen or weaken the sovereignty of their members.' } }
  ],
  advice: {
    realist: 'Let him go. A court with no army cannot protect us from the winter if the gas stops.',
    liberal: 'Arrest him. We signed the treaty. If our signature means nothing, our next treaty is worthless.',
    constructivist: 'Every state that arrests a suspect makes the next arrest more normal. Every one that looks away makes impunity normal.',
    finance: 'Looking away pays this quarter. Leaving the Tribunal costs us aid for years. Arresting him costs the energy deal. There is no free option.'
  }
},
{
  id: 'RJ4', area: 'rights', concept: 'Legitimacy', related: 'Indigenous rights',
  actor: { name: 'Corvan Mining', type: 'MNC', icon: 'pickaxe' },
  title: 'Sacred Ground', case: 'Free, prior and informed consent',
  text: "Corvan Mining has confirmed one of the richest copper deposits in the region beneath the Tamara Hills, ancestral land of the Wenu people. The company promises 3,000 jobs and royalties worth 15% of your budget. Wenu elders say the hills hold burial grounds and refuse to discuss a sale. Young Wenu activists have set up a camp on the access road. Corvan wants an answer this quarter or it will go to Port Selene's mines instead.",
  options: [
    { label: 'Require free, prior and informed consent from the Wenu before any mining.',
      effects: { power: -2, legit: 7, inter: 2, treasury: -60 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You gave an Indigenous community real power over its land. It strengthens legitimacy and respects self-determination, but it may cost you the investment, and the state gives up the final say over its own resources.',
        parallel: 'The 2007 UN Declaration on the Rights of Indigenous Peoples sets out the principle of free, prior and informed consent. Four states, Australia, Canada, New Zealand and the United States, voted against it at first, then later endorsed it.',
        think: 'To what extent should Indigenous peoples have a veto over development on their land?' } },
    { label: 'Approve the mine. The country needs the jobs.',
      effects: { power: 3, legit: -8, inter: 5, treasury: 160 }, setFlags: ['mine_approved'], theory: [2, 2, 0],
      debrief: {
        explain: 'You chose national development and investment over a minority\'s objections. The money is real and so are the jobs. But development imposed on a community can create lasting grievances, protests and legal battles that cost more than they earned.',
        parallel: 'In 2016, thousands joined protests led by the Standing Rock Sioux against the Dakota Access Pipeline in the United States, which the tribe said threatened its water and sacred sites. In 2020, Rio Tinto destroyed 46,000-year-old rock shelters at Juukan Gorge in Australia, leading to its chief executive\'s resignation.',
        think: 'Evaluate whether economic development can justify overriding a community\'s objections.' } },
    { label: 'Ban mining in the Tamara Hills permanently.',
      effects: { power: -5, sov: 2, legit: 6, treasury: -20, rel: { selene: -1 } }, theory: [0, 1, 3],
      debrief: {
        explain: 'You protected the land completely. It earns trust from the Wenu and environmental groups, but investors see a country that may close the door on them, and you lose a source of revenue and power.',
        parallel: 'In 2017, El Salvador became the first country to ban metal mining nationwide, after years of protests over water pollution and a long international arbitration case brought by a mining company.',
        think: 'Discuss whether a permanent ban is a sustainable answer to conflicts over natural resources.' } }
  ],
  advice: {
    realist: 'Copper is power. Wires, weapons, wealth. Approve the mine and make sure the money stays here.',
    liberal: 'Get consent. Clear rules about rights make investors more confident in the long run, not less.',
    constructivist: 'The Wenu are asking whether they belong to this nation. Our answer will last longer than the copper.',
    finance: 'The mine would fill a sixth of the budget. A ban fills none of it. Consent might fill some of it, slowly.'
  }
},
{
  id: 'RJ5', area: 'rights', concept: 'Sovereignty', related: 'Liberty',
  actor: { name: 'Helix Data', type: 'MNC', icon: 'chip' },
  title: 'Free Cameras', case: 'Data sovereignty and GDPR',
  text: "Helix Data, the world's second-largest tech platform, offers {capital} a free 'smart city' system: 8,000 cameras with facial recognition, traffic sensors and a crime-prediction app. Crime in pilot cities fell 11%. The catch: all data would be stored on Helix servers abroad, under foreign law. The police are delighted. The Capital Ledger has run a front page with a single giant eye on it.",
  options: [
    { label: 'Accept the system as offered.',
      effects: { power: 6, sov: -8, legit: -3, inter: 4, treasury: 80 }, setFlags: ['helix_accepted'], theory: [2, 2, 0],
      debrief: {
        explain: 'You traded control over citizens\' data for free technology and policing power. It boosts the state\'s capacity, but another actor now holds information about your people, and citizens may feel watched rather than protected.',
        parallel: 'Facial recognition systems supplied by foreign companies have been installed in many cities worldwide. Civil liberties groups have raised concerns, and in 2019 San Francisco became the first major US city to ban its agencies from using facial recognition.',
        think: 'To what extent does accepting foreign technology reduce a state\'s sovereignty?' } },
    { label: 'Accept it only if the data stays in-country under a new local storage law.', cost: { influence: 1 },
      effects: { power: 3, sov: 2, legit: 1, inter: 2, treasury: -20 }, tags: ['cooperative'], theory: [1, 3, 1],
      debrief: {
        explain: 'You used negotiation and law to keep the benefits while protecting data sovereignty. It cost diplomatic effort and some money, and Helix will charge more next time, but you set the rules on your own territory.',
        parallel: 'The EU\'s General Data Protection Regulation (GDPR), in force since 2018, set strict rules on how companies handle Europeans\' data, including limits on transfers abroad. It has influenced data laws in many other countries.',
        think: 'Evaluate whether small states can regulate powerful technology companies.' } },
    { label: 'Refuse. No cameras, no deal.',
      effects: { power: -4, sov: 5, legit: 3, inter: -3 }, theory: [1, 0, 2],
      debrief: {
        explain: 'You kept control and protected liberty, but gave up useful technology and investment. In an interdependent world, saying no to powerful companies has costs, and rivals who said yes may move ahead.',
        parallel: 'In July 2020, the UK government ordered that equipment from the Chinese company Huawei be removed from its 5G network by 2027, citing security concerns, despite the extra cost and delay.',
        think: 'Discuss the trade-off between security, liberty and economic benefit in decisions about technology.' } }
  ],
  advice: {
    realist: 'Accept. Information is power, and free power is the best kind. Just make sure our police see the data first.',
    liberal: 'Make them store it here, under our law. That is exactly what regulation is for.',
    constructivist: 'A city full of cameras becomes a city that expects to be watched. Is that who we want to be?',
    finance: 'Free is a price, not a gift. Somebody is paying, and I suspect it is our citizens.'
  }
},
{
  id: 'RJ6', area: 'rights', concept: 'Legitimacy', related: 'Equality', protest: true,
  actor: { name: 'The Saturday Squares', type: 'movement', icon: 'crowd' },
  title: 'Equal Pay Saturday', case: 'Iceland\'s equal pay certification law, 2018',
  text: "For the fifth Saturday running, the Saturday Squares have filled the main square of {capital}. Their demand is simple: a law forcing employers to prove they pay women and men equally for equal work. Women in {country} earn on average 17% less than men. The Traditional Union Party, your junior coalition partner, says such a law would 'strangle small business' and threatens to leave the government if you introduce it.",
  options: [
    { label: 'Pass the law. Employers must certify equal pay.',
      effects: { power: -5, legit: 8, inter: 1, treasury: -30 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You responded to a social movement and changed the law. That builds legitimacy and advances equality, but you lost your coalition partner\'s support, weakening your power to pass other laws.',
        parallel: 'Iceland\'s 2018 law required employers with 25 or more staff to obtain certification that they pay men and women equally for work of equal value. It was the first law of its kind in the world.',
        think: 'To what extent can laws change inequalities that are rooted in social attitudes?' } },
    { label: 'Set up a commission to study the issue for two years.',
      effects: { power: 1, legit: -3 }, theory: [2, 1, 0],
      debrief: {
        explain: 'You delayed. Commissions can produce good evidence, but movements often see them as a way of making a demand disappear. You kept your coalition and lost some trust.',
        parallel: 'The UK\'s Equal Pay Act of 1970 followed a 1968 strike by women sewing machinists at the Ford plant in Dagenham. Activists later argued that progress after the Act was slow, and the pay gap persisted for decades.',
        think: 'Evaluate whether gradual reform is more effective than immediate change in addressing inequality.' } },
    { label: 'Ignore the protests. Governments are not run by crowds.',
      effects: { power: 4, legit: -9 }, theory: [3, 0, 0],
      debrief: {
        explain: 'You held your coalition together by dismissing the movement. In the short term your power is secure. But social movements that are ignored often grow, and your government now looks out of touch with half its population.',
        parallel: 'Researchers studying social movements find that sustained, large and peaceful protest movements are difficult for governments to ignore for long. Women\'s suffrage campaigns in many countries won the vote only after decades of being dismissed.',
        think: 'Discuss the role of social movements as non-state actors in shaping state policy.' } }
  ],
  advice: {
    realist: 'Keep the coalition. Without a majority we cannot pass anything at all, equal or otherwise.',
    liberal: 'Pass it. Equal rights under the law are the foundation of a stable democracy.',
    constructivist: 'Half a million people are telling us who this country thinks it is now. We should listen.',
    finance: 'Certification costs businesses something. Unequal pay costs the economy more. But a commission costs nothing until 2028.'
  }
},
{
  id: 'RJ7', area: 'rights', concept: 'Sovereignty', related: 'Human rights',
  actor: { name: 'Alvenmark Ministry of Justice', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'No Execution Clause', case: 'Soering v. United Kingdom, 1989',
  text: "Kerem Asad, suspected of planning the bombing of the {capital} metro that killed nine people, has been arrested in Alvenmark. Alvenmark will only extradite him if you guarantee he will not face the death penalty, which {country}'s criminal code still allows for terrorism. Families of the victims want the maximum sentence. Alvenmark's justice minister says, 'We do not send anyone to their death. Not even him.'",
  options: [
    { label: 'Give the guarantee. Get him back and put him on trial.',
      effects: { sov: -3, legit: -2, inter: 5, rel: { alvenmark: 1 } }, tags: ['cooperative'], theory: [1, 3, 0],
      debrief: {
        explain: 'You accepted a limit on your own law to secure cooperation. It brings the suspect to trial, but some citizens see another state dictating your punishments, a real trade-off between sovereignty and interdependence.',
        parallel: 'Many states that keep the death penalty give formal "diplomatic assurances" that it will not be imposed, so that European states will agree to extradite suspects to them.',
        think: 'To what extent does international cooperation require states to compromise their own laws?' } },
    { label: 'Refuse. Our courts, our laws, our punishments.',
      effects: { power: 2, sov: 6, legit: 2, inter: -4, rel: { alvenmark: -2 } }, tags: ['hostile'], theory: [3, 0, 1],
      debrief: {
        explain: 'You defended your legal sovereignty. Many citizens agree. But the suspect stays in Alvenmark, the victims\' families get no trial, and a key partner sees you as a state that values punishment over cooperation.',
        parallel: 'In Soering v. United Kingdom (1989), the European Court of Human Rights ruled that extraditing a German national to the US state of Virginia, where he faced the death penalty and years on death row, would breach the ban on inhuman treatment.',
        think: 'Discuss whether human rights should be universal or whether states may define them differently.' } },
    { label: 'Abolish the death penalty entirely, for everyone.',
      effects: { power: -2, legit: -4, inter: 4, rel: { alvenmark: 3 } }, theory: [0, 2, 3],
      debrief: {
        explain: 'You changed your own law to match an international norm. Abroad you are praised, and the extradition goes ahead. At home, many people, including victims\' families, feel the decision was made for foreigners rather than for them.',
        parallel: 'Protocol 13 to the European Convention on Human Rights (2002) abolishes the death penalty in all circumstances, and abolition is a condition of joining the European Union. Over two-thirds of the world\'s countries have now abolished it in law or practice.',
        think: 'Examine how international norms can lead states to change their domestic laws.' } }
  ],
  advice: {
    realist: 'Refuse. If we let Alvenmark write our sentences today, they will write our budget tomorrow.',
    liberal: 'Give the guarantee. A trial here is better than no trial at all, and cooperation on terrorism keeps us all safe.',
    constructivist: 'Abolition would change what kind of state we are. That is a bigger decision than one man, which is exactly why it matters.',
    finance: 'None of these costs money directly. All of them cost something else.'
  }
},
{
  id: 'RJ8', area: 'rights', concept: 'Power', related: 'Justice',
  actor: { name: 'The Auric Directorate', type: 'state', icon: 'crown', state: 'auric' },
  title: 'Our Reporter in Their Prison', case: 'Hostage diplomacy and prisoner exchanges',
  text: "Talia Brennic, a correspondent for the Capital Ledger, has been sentenced to eleven years in the Directorate for 'spreading false information' after reporting on a mine disaster. Her family has camped outside your foreign ministry for a week. Auric officials hint that they would 'consider humanitarian gestures' if you released Vasco Thorne, an Auric arms dealer serving twenty years in your prison for smuggling.",
  options: [
    { label: 'Pursue quiet diplomacy through a trusted envoy.', cost: { influence: 1 },
      effects: { power: -1, legit: 3, inter: 2, rel: { auric: 1 } }, tags: ['cooperative'], theory: [1, 2, 1],
      debrief: {
        explain: 'You chose patience and back channels. Quiet diplomacy can free prisoners without either side losing face. It is slow, and the family may see it as doing nothing, but it keeps a line open to a difficult state.',
        parallel: 'British-Iranian aid worker Nazanin Zaghari-Ratcliffe was held in Iran from 2016 until 2022. She was released after years of diplomacy, at the same time as the UK paid a long-disputed debt of about £394 million owed to Iran.',
        think: 'Evaluate the strengths and weaknesses of quiet diplomacy when dealing with authoritarian states.' } },
    { label: 'Condemn the Directorate publicly and impose targeted sanctions.',
      effects: { power: 2, legit: 6, inter: -5, treasury: -40, rel: { auric: -3 } }, tags: ['hostile'], theory: [1, 1, 3],
      debrief: {
        explain: 'You chose public pressure. Naming and shaming raises the cost of holding a journalist and shows your citizens you stand up for them. It may also make it harder for the Directorate to release her without looking weak.',
        parallel: 'The US Magnitsky Act of 2012 imposed sanctions on Russian officials linked to the death in custody of lawyer Sergei Magnitsky. Several other countries later passed similar laws targeting individuals accused of human rights abuses.',
        think: 'To what extent do sanctions on individuals change the behaviour of states?' } },
    { label: 'Agree to a prisoner swap: Brennic for Thorne.',
      effects: { power: -4, legit: 2, sov: -2, rel: { auric: 2 } }, setFlags: ['swap_made'], theory: [3, 1, 0],
      debrief: {
        explain: 'You brought your citizen home by trading a convicted criminal. It works and the family is overjoyed. But critics warn that it rewards hostage-taking and tells other states that detaining your citizens is a way to get what they want.',
        parallel: 'In December 2022, the United States exchanged convicted Russian arms dealer Viktor Bout for American basketball player Brittney Griner, who had been jailed in Russia. Supporters welcomed her return; critics argued such swaps encourage "hostage diplomacy".',
        think: 'Discuss whether prisoner swaps protect citizens or encourage states to take more hostages.' } }
  ],
  advice: {
    realist: 'Swap. We get our citizen back, they get a criminal we were tired of feeding. Interests, not principles.',
    liberal: 'Use an envoy. Keep the channel open. Public fights rarely free anyone.',
    constructivist: 'Every swap makes taking journalists a little more normal. Every condemnation makes it a little less normal.',
    finance: 'Sanctions cost us trade. Envoys cost us salaries. The swap costs us twenty years of prison food. I am almost in favour.'
  }
},
{
  id: 'RJ9', area: 'rights', concept: 'Legitimacy', related: 'Self-determination', protest: true,
  actor: { name: 'Minority region of Ostravel', type: 'domestic', icon: 'crowd' },
  title: 'One Language', case: 'Sri Lanka\'s Sinhala Only Act, 1956',
  text: "Your party's congress has voted for a law making the majority language the only official language of {country}: in courts, schools, and government jobs. In the eastern region of Ostravel, where 70% of people speak Velish, 20,000 people marched last night. Velish-speaking civil servants say they will lose their jobs. Your party chair says the law 'unites the nation'. The governor of Ostravel says it divides it.",
  options: [
    { label: 'Pass the law. One country, one language.',
      effects: { power: 5, sov: 2, legit: -8, inter: -2 }, setFlags: ['language_law'], theory: [2, 0, 2],
      debrief: {
        explain: 'You used state power to build a single national identity. Some states have done this to strengthen unity, but when one group\'s identity becomes official and another\'s is pushed aside, the excluded group may stop seeing the state as legitimate.',
        parallel: 'Sri Lanka\'s Official Language Act of 1956, known as the Sinhala Only Act, made Sinhala the sole official language. Tamil speakers lost access to government jobs, and many historians see the law as a key step toward decades of ethnic conflict.',
        think: 'To what extent can a state build national unity by imposing a single identity?' } },
    { label: 'Recognise both languages as official.',
      effects: { power: -3, legit: 6, treasury: -50 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You chose a shared, plural identity. Bilingual institutions cost money and some majority voters see it as giving in, but it tells the minority they belong, which strengthens the state\'s legitimacy across the whole territory.',
        parallel: 'Canada\'s Official Languages Act of 1969 gave English and French equal status in federal institutions. Switzerland recognises four national languages. Both are often cited as examples of managing linguistic diversity peacefully.',
        think: 'Evaluate whether recognising multiple identities strengthens or weakens a state.' } },
    { label: 'Offer Ostravel regional autonomy, with its own language policy.',
      effects: { power: -2, sov: -5, legit: 7 }, setFlags: ['autonomy_granted'], theory: [0, 2, 2],
      debrief: {
        explain: 'You shared power inside your own borders. Autonomy respects self-determination without breaking up the state, but it means the central government gives up some control over part of its territory.',
        parallel: 'Italy\'s 1972 autonomy statute for South Tyrol gave the German-speaking province wide self-government, helping end years of tension and bombings. Spain\'s 1978 constitution created autonomous communities such as Catalonia and the Basque Country.',
        think: 'Discuss whether autonomy is a solution to self-determination claims or a step toward secession.' } }
  ],
  advice: {
    realist: 'A state needs one command structure. But a state at war with its own east is not strong. Choose carefully.',
    liberal: 'Recognise both. Equal rights for all citizens are what make them loyal to the state.',
    constructivist: 'Language is identity. If we tell a fifth of our citizens their words do not count, they will find another nation that says they do.',
    finance: 'Two languages means two of every form. Autonomy means a second budget. One language means a third option: a very expensive conflict.'
  }
},
{
  id: 'RJ10', area: 'rights', concept: 'Justice', related: 'Peace',
  actor: { name: 'Lantern Watch', type: 'NGO', icon: 'lantern' },
  title: 'The Old Regime\'s Files', case: 'South Africa\'s Truth and Reconciliation Commission',
  text: "Workers renovating the old interior ministry have found 400 boxes of files from the previous regime: lists of informants, interrogation records, the locations of unmarked graves. Lantern Watch has seen copies. Some of the names belong to people now serving as judges, generals and members of your own party. Victims' groups demand justice. Your army chief warns that prosecutions 'could make the barracks restless'.",
  options: [
    { label: 'Create a truth and reconciliation commission with conditional amnesty.',
      effects: { power: -2, legit: 6, inter: 2, treasury: -60 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You traded full punishment for full truth. Perpetrators who confess can avoid prison, and victims learn what happened. It may help a divided society heal, but some victims feel that justice was sold for peace.',
        parallel: 'South Africa\'s Truth and Reconciliation Commission (from 1996) offered amnesty to people who fully disclosed politically motivated crimes committed during apartheid. It heard testimony from thousands of victims, but some families criticised it for letting perpetrators go free.',
        think: 'To what extent can truth replace punishment in delivering justice after mass abuses?' } },
    { label: 'Prosecute everyone the files implicate.',
      effects: { power: -6, legit: 4, inter: 3, rel: { alvenmark: 2 }, mood: 1 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You chose accountability through the courts. It sends a powerful message that no one is above the law. But putting powerful people on trial can threaten stability, especially when they still command loyalty in the army.',
        parallel: 'In 1985, Argentina put the leaders of its former military government on trial for crimes during the "Dirty War". Five were convicted. Later military uprisings pressured the government into amnesty laws, which were overturned in the 2000s.',
        think: 'Evaluate the risks of prosecuting former leaders during a fragile transition.' } },
    { label: 'Seal the files for fifty years. Look to the future.',
      effects: { power: 5, legit: -7, rel: { alvenmark: -1 } }, theory: [3, 0, 0],
      debrief: {
        explain: 'You chose stability over truth. Powerful people stay loyal and the army stays calm. But victims are silenced, and buried injustices have a way of returning, often at the worst possible moment.',
        parallel: 'Spain\'s 1977 Amnesty Law and an informal "pact of forgetting" helped its transition to democracy after Franco\'s death. Decades later, families still campaign to exhume the victims of the civil war and the dictatorship from unmarked graves.',
        think: 'Discuss whether silence about past abuses can ever build a lasting peace.' } }
  ],
  advice: {
    realist: 'Seal them. A transition is a fragile thing. Do not pick fights with the men who have the guns.',
    liberal: 'Prosecute. The rule of law cannot have exceptions for people with good connections.',
    constructivist: 'A nation is the story it tells about its past. Truth first. Then we can decide what justice looks like.',
    finance: 'A commission is cheaper than a hundred trials. A sealed archive is cheapest of all, until somebody leaks it.'
  }
},
{
  id: 'RJ11', area: 'rights', concept: 'Legitimacy', related: 'Liberty',
  actor: { name: 'Helix Data / SNN', type: 'MNC', icon: 'microphone' },
  title: 'Fake Ballots, Real Rage', case: 'Germany\'s NetzDG law, 2017',
  text: "Two weeks before local elections, Helix's platform is flooded with fake videos: a mayor 'confessing' to fraud, ballot boxes 'found' in a river, a forged order telling one district to vote on the wrong day. SNN has run three of the clips before checking them. Helix says it removes 'most' false content within 72 hours. The election commission says that is three days too slow.",
  options: [
    { label: 'Pass a law forcing platforms to remove illegal content within 24 hours or face huge fines.',
      effects: { power: 3, sov: 4, legit: 2, inter: -2, treasury: -20 }, theory: [1, 2, 1],
      debrief: {
        explain: 'You asserted state authority over a global platform. It may protect the election, but critics warn that companies facing fines will delete too much, including legitimate speech, turning a tech firm into a private censor.',
        parallel: 'Germany\'s Network Enforcement Act (NetzDG) of 2017 required large platforms to remove clearly illegal content within 24 hours or face fines of up to 50 million euros. Supporters saw it as protecting democracy; critics warned of over-blocking and harm to free speech.',
        think: 'To what extent should states regulate online speech to protect democracy?' } },
    { label: 'Ban Helix\'s platform until after the election.',
      effects: { power: 4, sov: 8, legit: -6, inter: -6 }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You cut off the problem at the source, and with it millions of citizens\' main way of communicating. It protects the election from one threat, but it looks like censorship and makes the vote less legitimate, not more.',
        parallel: 'In June 2021, Nigeria suspended Twitter after the platform deleted a post by the president. The ban lasted until January 2022 and was criticised by human rights groups and foreign governments as a restriction on freedom of expression.',
        think: 'Evaluate whether banning a platform can ever be a legitimate way to protect an election.' } },
    { label: 'Fund a national media literacy campaign in schools and on television.', cost: { influence: 1 },
      effects: { power: -1, legit: 5, inter: 1, treasury: -40 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You invested in citizens rather than in control. Teaching people to spot false content is slow and will not stop this week\'s fakes, but it builds a society that is harder to fool in the long run.',
        parallel: 'Finland has taught media literacy and critical thinking across its school curriculum for years and has repeatedly ranked first in the European Media Literacy Index, which measures resilience to misinformation.',
        think: 'Discuss whether long-term education or short-term regulation is the better response to disinformation.' } }
  ],
  advice: {
    realist: 'Ban it until the votes are counted. A foreign company should not decide who governs our towns.',
    liberal: 'Regulate it with clear rules and courts. Banning platforms is what we criticise other states for.',
    constructivist: 'Lies spread when people already distrust each other. Teach people to think, and the lies lose their soil.',
    finance: 'The law costs us fines we may never collect. The ban costs our digital economy a fortune. Teaching costs money and patience, which are the two things governments have least of.'
  }
}
);

CONTENT.cards.push(
{
  id: 'DS1', area: 'development', concept: 'Sovereignty', related: 'Development',
  actor: { name: 'Global Monetary Reserve', type: 'IGO', icon: 'coin' },
  title: 'The Lender\'s Terms', case: 'IMF conditionality in the Greek debt crisis',
  text: "Interest payments on {country}'s debt now eat a quarter of the budget, and the currency fell 9% last month. The Global Monetary Reserve offers an emergency loan, on conditions: cut public sector wages by 12%, raise the pension age, and sell the state telephone company and two ports. Your finance minister says the loan would calm the markets within days. Unions have already announced a general strike 'if you so much as pick up the pen'.",
  options: [
    { label: 'Accept the loan and its conditions.',
      effects: { sov: -7, legit: -6, inter: 4, treasury: 200 }, setFlags: ['gmr_loan'], theory: [0, 3, 0],
      debrief: {
        explain: 'You accepted conditionality: money in exchange for policy changes decided partly by outsiders. It steadies the economy and reassures markets, but voters may feel their government now answers to lenders rather than to them.',
        parallel: 'Between 2010 and 2015, Greece received three bailouts from the IMF and eurozone partners on condition of deep spending cuts and privatisations. In a 2015 referendum, Greek voters rejected the proposed terms, but the government accepted a third bailout with similar conditions days later.',
        think: 'To what extent does accepting conditional loans reduce a state\'s sovereignty?' } },
    { label: 'Send your best negotiator to win softer terms for a smaller loan.', cost: { influence: 1 },
      effects: { sov: -3, legit: -2, inter: 3, treasury: 110 }, tags: ['cooperative'], theory: [1, 2, 1],
      debrief: {
        explain: 'You negotiated inside the system to protect some of your policy space. You get less money and still accept some conditions, but you show that borrowers are not powerless when they bargain well.',
        parallel: 'When Iceland\'s banks collapsed in 2008, its IMF programme unusually allowed the government to impose capital controls, limits on money leaving the country, a measure lenders had often opposed. Iceland returned to growth within a few years.',
        think: 'Evaluate how much bargaining power small states have when dealing with international lenders.' } },
    { label: 'Refuse. Borrow from Karst instead, no questions asked.',
      effects: { power: 1, sov: -2, legit: 2, inter: -1, treasury: 120, rel: { karst: 1 } }, setFlags: ['karst_money'], theory: [2, 0, 1],
      debrief: {
        explain: 'You avoided the lender\'s conditions by turning to a powerful neighbour. There are no public conditions, but there may be private expectations, and you have swapped dependence on an institution for dependence on a state.',
        parallel: 'From the 2000s, Angola received large loans from Chinese lenders repaid with oil, avoiding IMF-style conditions. Supporters said it funded roads and railways quickly; critics said the deals were secretive and left Angola heavily tied to one creditor.',
        think: 'Compare and contrast borrowing from an international institution and borrowing from a single powerful state.' } }
  ],
  advice: {
    realist: 'Take Karst\'s money. Institutions pretend to be neutral; at least Karst is honest about wanting something.',
    liberal: 'Accept the Reserve\'s loan. Its rules are public, its interest is low, and its members include our friends.',
    constructivist: 'Austerity will become a word people hate for a generation. Whatever we choose, we must explain it.',
    finance: 'All three options give us money. Only one lets us choose what we cut. I suggest the envoy.'
  }
},
{
  id: 'DS2', area: 'development', concept: 'Interdependence', related: 'Globalization',
  actor: { name: 'Open Trade Assembly / Port Selene', type: 'IGO', icon: 'globe', state: 'selene' },
  title: 'Cheap Grain', case: 'NAFTA and Mexican corn farmers',
  text: "Port Selene proposes a free trade agreement under Open Trade Assembly rules. Your exporters of textiles and machine parts would gain tariff-free access to its rich markets. But Selene's grain traders would also gain access to yours, selling wheat and maize 30% cheaper than your farmers can grow it. A million people in {country} work on small farms. Bread prices in {capital} would fall. So might a lot of villages.",
  options: [
    { label: 'Sign the agreement as written.',
      effects: { power: 2, sov: -3, legit: -6, inter: 9, treasury: 100, rel: { selene: 2 } }, tags: ['cooperative'], theory: [0, 3, 0],
      debrief: {
        explain: 'You chose deep economic integration. Consumers and exporters win; small farmers lose. This is the classic liberal case for trade: overall gains, but unequally shared, and the losers may turn against the government that signed.',
        parallel: 'After the North American Free Trade Agreement (NAFTA) took effect in 1994, imports of cheap US corn into Mexico rose sharply. Economists still debate how much NAFTA caused the losses felt by many small Mexican corn farmers and how much other policies did.',
        think: 'To what extent do the benefits of free trade justify its costs to particular groups?' } },
    { label: 'Sign, but with safeguards: tariffs that rise if grain imports surge.',
      effects: { power: -1, sov: 1, legit: 1, inter: 4, treasury: 40, rel: { selene: 1 } }, theory: [1, 2, 1],
      debrief: {
        explain: 'You balanced openness with protection. Safeguards soften the shock for farmers, but every exception reduces the gains, and your partners may ask for exceptions of their own.',
        parallel: 'At the World Trade Organization\'s 2008 Doha Round talks in Geneva, negotiations collapsed largely over a "special safeguard mechanism" that would let developing countries protect farmers from import surges. India and the United States could not agree on the details.',
        think: 'Evaluate whether trade agreements should protect vulnerable groups even if this reduces overall gains.' } },
    { label: 'Reject the deal. Food security comes first.',
      effects: { power: 1, sov: 6, legit: 3, inter: -6, treasury: -40, rel: { selene: -2 } }, tags: ['hostile'], theory: [2, 0, 2],
      debrief: {
        explain: 'You protected sovereignty and farming communities. You keep control over food supply, but exporters lose markets, consumers pay more, and a key trading partner feels rejected.',
        parallel: 'In 2019, India withdrew from negotiations on the Regional Comprehensive Economic Partnership (RCEP), a large Asian trade deal, partly over fears that cheap imports would hurt its farmers, dairy producers and manufacturers.',
        think: 'Discuss whether food security is a valid reason to limit trade in a globalized world.' } }
  ],
  advice: {
    realist: 'A country that cannot feed itself cannot defend itself. Reject it.',
    liberal: 'Sign it. Trade makes both sides richer, and states that trade rarely fight.',
    constructivist: 'Farming villages are part of how this country imagines itself. Losing them would change more than the economy.',
    finance: 'The deal earns us money. The farmers cost us votes. Safeguards earn less money and lose fewer votes. It is all arithmetic.'
  }
},
{
  id: 'DS3', area: 'development', concept: 'Sovereignty', related: 'Development',
  actor: { name: 'The Federation of Karst', type: 'state', icon: 'fortress', state: 'karst' },
  title: 'A Port for a Promise', case: 'Hambantota port lease, 2017',
  text: "Karst's state development bank offers to build a deep-water port at Kessel Bay: four berths, a rail link and a free trade zone, finished in three years. You would repay the loan from port revenue. If revenue falls short, Karst's state shipping company takes a 99-year lease on the port as collateral. Your engineers say Kessel Bay could double exports. Your navy says it is the only harbour deep enough for warships.",
  options: [
    { label: 'Accept the full deal, lease clause included.',
      effects: { power: 2, sov: -8, inter: 7, treasury: 150, rel: { karst: 2 } }, setFlags: ['karst_port'], tags: ['cooperative'], theory: [1, 2, 0],
      debrief: {
        explain: 'You accepted infrastructure that you could not afford alone, with a powerful neighbour holding the keys if things go wrong. It boosts development and trade, but it ties a strategic asset to another state\'s decisions.',
        parallel: 'In 2017, Sri Lanka leased its Hambantota port to a Chinese state-owned company for 99 years in exchange for about 1.1 billion dollars. It is often called an example of "debt-trap diplomacy", but researchers have argued that the lease was negotiated by Sri Lanka and that most of its debt was owed to other lenders.',
        think: 'To what extent is "debt-trap diplomacy" an accurate description of infrastructure lending?' } },
    { label: 'Accept only with a short lease and joint management.', cost: { influence: 1 },
      effects: { sov: -2, inter: 4, treasury: 60, rel: { karst: 1 } }, tags: ['cooperative'], theory: [1, 2, 1],
      debrief: {
        explain: 'You renegotiated to keep more control. You get a smaller, slower deal, but you protect your sovereignty and show that recipients can shape the terms of foreign investment.',
        parallel: 'In 2019, Malaysia renegotiated the East Coast Rail Link with its Chinese contractor, cutting the cost by about a third. Myanmar similarly scaled down the planned Kyaukphyu port project in 2018.',
        think: 'Evaluate whether renegotiation allows smaller states to benefit from great-power investment on their own terms.' } },
    { label: 'Refuse. Kessel Bay stays ours.',
      effects: { sov: 6, power: -1, inter: -3, treasury: -30, rel: { karst: -2 } }, tags: ['hostile'], theory: [2, 0, 2],
      debrief: {
        explain: 'You kept full sovereignty over a strategic asset. But the port is not built, exports stay where they are, and the region\'s most powerful state now sees you as unfriendly.',
        parallel: 'In 2018, Sierra Leone cancelled a planned Chinese-funded international airport near its capital, with its government arguing that the project was too expensive and unnecessary.',
        think: 'Discuss whether refusing foreign investment protects or harms a developing state\'s interests.' } }
  ],
  advice: {
    realist: 'A port that can host warships is not a business deal. It is a military question. Refuse, or at least keep the lease short.',
    liberal: 'Infrastructure links economies. Take it, but write the contract carefully.',
    constructivist: 'People will call it "Karst\'s port" within a year, whatever the lease says. Names matter.',
    finance: 'If the port earns what the engineers say, the lease clause never matters. Engineers are optimists. I am not.'
  }
},
{
  id: 'DS4', area: 'development', concept: 'Legitimacy', related: 'Sustainability', protest: true,
  actor: { name: 'Greenwake', type: 'NGO', icon: 'leaf' },
  title: 'Fuel Tax Friday', case: 'France\'s gilets jaunes protests, 2018',
  text: "To meet its climate pledge, {country} needs a carbon tax: about 18 cents more per litre of fuel. Greenwake says anything less is 'a betrayal of children'. Drivers' groups say it punishes rural people who have no buses and must drive to work. Last Friday, truckers blocked the ring road around {capital} in a 'slow protest'. Some wore reflective safety vests. Pictures of the vests are everywhere.",
  options: [
    { label: 'Impose the full carbon tax now.',
      effects: { power: 1, legit: -8, inter: 2, treasury: 120, rel: { alvenmark: 1 } }, theory: [1, 2, 1],
      debrief: {
        explain: 'You chose sustainability and revenue over short-term popularity. The tax works by making pollution expensive, but people who depend on cars feel targeted, and a policy that loses public consent can be reversed.',
        parallel: 'Sweden introduced a carbon tax in 1991 and gradually raised it to one of the highest in the world, while its economy continued to grow. It was phased in over many years and paired with other tax cuts.',
        think: 'To what extent must climate policies have public consent to succeed?' } },
    { label: 'Impose it, but return the money to poorer households as rebates.',
      effects: { legit: -2, inter: 1, treasury: 30 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You designed the policy around fairness. Rebates protect people on low incomes, so the tax changes behaviour without making the poor pay the most. It raises less money, and many people never notice the rebate.',
        parallel: 'Canada introduced a federal carbon price in 2019 and returned most of the revenue to households as rebates. The consumer charge remained politically contested, and it was reduced to zero in 2025.',
        think: 'Evaluate whether rebates can make environmental taxes fair.' } },
    { label: 'Drop the tax. Find the emissions cuts somewhere else.',
      effects: { legit: 5, inter: -3, treasury: -20, rel: { alvenmark: -1 } }, theory: [2, 0, 1],
      debrief: {
        explain: 'You listened to the protesters and backed down. You regain support at home, but you weaken your climate pledge and your reputation abroad, and Greenwake will not forget.',
        parallel: 'France\'s "gilets jaunes" (yellow vests) protests began in November 2018 over a planned fuel tax increase. After weeks of demonstrations, some violent, the government suspended the tax rise in December 2018.',
        think: 'Discuss the tension between sustainability goals and the legitimacy of governments that pursue them.' } }
  ],
  advice: {
    realist: 'Do not pick fights with truckers. They control the roads, and the roads control the cities.',
    liberal: 'Tax the carbon and send the money back. It is the textbook answer for a reason.',
    constructivist: 'People do not hate the tax. They hate feeling forgotten. Show them they are not, and they will accept more than you think.',

  }
},
{
  id: 'DS5', area: 'development', concept: 'Interdependence', related: 'Justice',
  actor: { name: 'Threadline Apparel', type: 'MNC', icon: 'factory' },
  title: 'The Factory Fire', case: 'Rana Plaza collapse, 2013',
  text: "A nine-storey garment factory in the Mollen industrial zone collapsed at 8:40 this morning. Rescuers have recovered 214 bodies so far. Cracks had appeared in the walls the day before; workers were told to return or lose a month's pay. The factory made clothing for Threadline Apparel, whose shirts sell in forty countries. Threadline says it is 'devastated' and also that strict new safety laws 'could make sourcing from {country} unviable'.",
  options: [
    { label: 'Pass strict safety laws with independent inspections.',
      effects: { power: -1, legit: 8, inter: -4, treasury: -80 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You used state authority to protect workers. Some factories will close or move abroad, costing jobs and investment. But you have declared that workers\' lives are not a competitive advantage, which strengthens legitimacy and justice.',
        parallel: 'After the 1911 Triangle Shirtwaist Factory fire in New York killed 146 garment workers, many of them young immigrant women, New York passed a wave of new fire safety and labour laws.',
        think: 'To what extent should states risk losing foreign investment to protect workers?' } },
    { label: 'Broker a binding agreement between brands, unions and factory owners.',
      effects: { legit: 4, inter: 4, treasury: -30 }, setFlags: ['accord_signed'], theory: [0, 3, 1],
      debrief: {
        explain: 'You brought non-state actors together to solve a problem the state could not solve alone. Brands pay for inspections, unions help enforce them. It shares responsibility, but it relies on companies keeping their promises.',
        parallel: 'After the Rana Plaza building collapsed in Bangladesh in April 2013, killing more than 1,100 garment workers, over 200 brands signed the legally binding Accord on Fire and Building Safety with trade unions, funding thousands of factory inspections.',
        think: 'Evaluate the role of multinational corporations in protecting workers\' rights in developing countries.' } },
    { label: 'Hold a day of mourning, but keep regulation light.',
      effects: { power: 2, legit: -10, inter: 3, treasury: 60 }, theory: [2, 1, 0],
      debrief: {
        explain: 'You protected jobs and investment by avoiding new costs for businesses. Threadline stays. But the families of the dead see a state that values exports over lives, and the next disaster will be blamed on you.',
        parallel: 'Five months before Rana Plaza, a fire at the Tazreen Fashions factory in Bangladesh killed at least 112 workers. Limited changes after that fire were widely criticised once Rana Plaza collapsed.',
        think: 'Discuss whether developing countries face a "race to the bottom" in labour standards.' } }
  ],
  advice: {
    realist: 'Our advantage is cheap labour. Throw that away and Threadline goes to the next country with cheap labour.',
    liberal: 'An agreement with the brands. They have the money and the reputations to lose. Make them part of the solution.',
    constructivist: 'Today our country\'s name appeared next to the word "collapse" on every screen in the world. What happens next decides whether that is who we are.',
    finance: 'Light regulation pays this quarter. The next collapse costs far more. I would rather pay for inspectors than funerals.'
  }
},
{
  id: 'DS6', area: 'development', concept: 'Legitimacy', related: 'Development', protest: true,
  actor: { name: 'Petrava Energy consortium', type: 'MNC', icon: 'factory' },
  title: 'Who Owns the Rain', case: 'Cochabamba water protests, 2000',
  text: "{capital}'s water system is a century old. A third of the water leaks from broken pipes, and the poorest districts get water only three days a week. A consortium led by Petrava Energy offers to take over the system for forty years: it would invest 400 million and fix the pipes, but water bills would rise by up to 35%. A coalition of neighbourhood groups has already painted a slogan on the main reservoir: 'THE RAIN IS NOT FOR SALE'.",
  options: [
    { label: 'Privatise the water system.',
      effects: { power: 1, sov: -3, legit: -8, inter: 4, treasury: 160 }, setFlags: ['water_privatised'], theory: [1, 2, 0],
      debrief: {
        explain: 'You brought in private capital to fix public infrastructure. The pipes may be repaired faster, but people who cannot pay higher bills may lose access to something many see as a human right, and anger can turn quickly.',
        parallel: 'In 2000, the Bolivian city of Cochabamba privatised its water system to a consortium linked to the US company Bechtel. Bills rose sharply, mass protests followed, and the government cancelled the contract within months.',
        think: 'To what extent should essential services like water be run by private companies?' } },
    { label: 'A public-private partnership with a legal price cap.',
      effects: { sov: -1, legit: 1, inter: 2, treasury: 50 }, theory: [1, 2, 1],
      debrief: {
        explain: 'You tried to combine private investment with public protection. Price caps protect consumers, but they also reduce the company\'s incentive to invest, so these deals need careful monitoring.',
        parallel: 'In 1997, Manila in the Philippines split its water system between two private concessions. Results were mixed: one company greatly expanded access, while the other struggled financially and was later restructured.',
        think: 'Evaluate whether public-private partnerships can deliver both efficiency and fairness.' } },
    { label: 'Keep water public and borrow to invest in it ourselves.',
      effects: { sov: 2, legit: 6, treasury: -120 }, theory: [0, 1, 2],
      debrief: {
        explain: 'You kept water as a public good under democratic control. People trust it, but the state must find the money itself, which means debt or cuts elsewhere.',
        parallel: 'In 2010, Paris brought its water services back into public ownership after decades of private contracts. The city reported savings and cut prices, though conditions differ greatly between a rich capital and a poor one.',
        think: 'Discuss whether access to water should be treated as a human right or a commodity.' } }
  ],
  advice: {
    realist: 'Water is security. Whoever controls the reservoir controls the capital. Keep it in our hands.',
    liberal: 'Private investment with public rules. Markets fix pipes; regulators keep prices fair.',
    constructivist: 'Read the slogan on the reservoir. People have already decided what water means to them.',
    finance: 'Privatising gives us 160. Keeping it public costs 120. That is a 280 swing. I just want everyone to see the number before they make a speech.'
  }
},
{
  id: 'DS7', area: 'development', concept: 'Power', related: 'Development',
  actor: { name: 'Corvan Mining', type: 'MNC', icon: 'pickaxe', state: 'karst' },
  title: 'White Gold', case: 'Indonesia\'s nickel ore export ban',
  text: "Geologists have confirmed huge lithium reserves under the Sarn salt flats, enough for millions of electric car batteries. Corvan Mining, backed by Karst investors, offers a 30-year partnership with a 20% royalty. Your national mining company says it could do the job itself, slowly. Your economists propose a third idea: ban the export of raw ore so that companies must build battery factories in {country}.",
  options: [
    { label: 'Nationalise the reserves. The state will mine them.',
      effects: { power: 6, sov: 6, legit: 2, inter: -6, treasury: -60, rel: { selene: -1, karst: -1 } }, theory: [3, 0, 1],
      debrief: {
        explain: 'You kept the resource under state control. It strengthens sovereignty and future power, but state companies often lack capital and expertise, and foreign investors may hesitate to come back.',
        parallel: 'In 2022, Mexico nationalised its lithium reserves and created a state company to develop them. Supporters called it economic sovereignty; critics warned that Mexico lacked the technology and capital to mine lithium quickly.',
        think: 'To what extent does controlling natural resources increase a state\'s power?' } },
    { label: 'Partner with Corvan on its terms.',
      effects: { power: 1, sov: -6, legit: -2, inter: 6, treasury: 180, rel: { karst: 1 } }, tags: ['cooperative'], theory: [0, 3, 0],
      debrief: {
        explain: 'You chose fast money and expertise from a multinational. The treasury fills, but most of the value is added abroad, and foreign investors gain influence over a strategic resource.',
        parallel: 'Chile, one of the world\'s largest lithium producers, has for decades let private companies such as SQM and Albemarle mine its lithium under contracts with a state agency, earning large royalties while debating how much control the state should have.',

    { label: 'Ban raw ore exports. Build the factories here.',
      effects: { power: 3, sov: 5, inter: -3, treasury: -80, rel: { selene: -1 } }, setFlags: ['ore_ban'], theory: [2, 0, 2],
      debrief: {
        explain: 'You used control over a resource to force development at home. It may build a new industry, but it costs money now and angers trading partners who rely on raw materials.',
        parallel: 'Indonesia banned exports of raw nickel ore (fully reinstated in 2020) to force companies to build processing plants locally. Investment in smelters rose sharply. The EU challenged the ban at the WTO, which ruled against Indonesia in 2022; Indonesia appealed.',
        think: 'Discuss whether export bans are a legitimate development strategy in a globalized economy.' } }
  ],
  advice: {
    realist: 'Lithium is the oil of this century. Never let another power hold the tap.',
    liberal: 'Partner with Corvan. Capital and expertise now, and an investor with an interest in our stability.',
    constructivist: 'For a century we sold raw materials and bought finished goods. The ban says we intend to be a different kind of country.',
    finance: 'Corvan pays us 180 now. The other two cost us money now and might pay more later. "Might" is a word I distrust.'
  }
},
{
  id: 'DS8', area: 'development', concept: 'Interdependence', related: 'Inequality',
  actor: { name: 'Alvenmark Health Service', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'The Doctors Are Leaving', case: 'WHO Code on recruiting health workers, 2010',
  text: "Last year, 340 of the 900 doctors who graduated from {country}'s medical schools left for jobs in Alvenmark, where pay is five times higher. Three rural hospitals have closed their maternity wards. Alvenmark's health service runs recruitment fairs in your universities and calls it 'a partnership'. Your health minister calls it 'harvesting'. The doctors themselves say they have student debts, and families to support.",

    { label: 'Require new doctors to serve five years at home before leaving.',
      effects: { power: 2, sov: 4, legit: -5, inter: -2 }, theory: [2, 0, 1],

        explain: 'You used state authority to keep public investment at home. Rural hospitals gain staff, but young doctors see it as limiting their liberty, and some may simply avoid studying medicine here.',
        parallel: 'Several countries, including some Indian states, require medical graduates of public colleges to serve for a set period or pay a large bond. Supporters say it keeps doctors where they are needed; critics say it is hard to enforce and unfair to graduates.',
        think: 'To what extent can a state limit its citizens\' freedom to work abroad?' } },
    { label: 'Negotiate a training-and-return agreement with Alvenmark.', cost: { influence: 1 },
