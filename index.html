  title: 'They Won\'t Leave', case: 'Executive Outcomes in Sierra Leone',
  text: "Remember Ironvale? Its contractors pushed the Free Highlands Front back into the high passes. Now Ironvale guards three gold mines with its own checkpoints, its own radios, and its own flag. Last week its men turned back a team of your tax inspectors at gunpoint. Its director says the contract 'gives us security of our concessions' and that Karst 'takes a keen interest in our safety'.",
  options: [
    { label: 'Send the army to retake the mines.', cost: { security: 1 },
      effects: { power: 3, sov: 7, legit: 3, inter: -2, treasury: -60, rel: { karst: -3 }, mood: 1 }, tags: ['hostile'], theory: [3, 0, 1],
      debrief: {
        explain: 'You reasserted the state\'s monopoly on force. If it works, you regain control of your territory. But it means fighting men you once hired, and their patron may not stay a spectator.',
        parallel: 'In the 1990s, the South African private military company Executive Outcomes helped Sierra Leone\'s government push back rebels, partly paid with diamond concessions. After its departure in 1997, the conflict resumed.',
        think: 'To what extent can a state recover sovereignty once it has outsourced security?' } },
    { label: 'Buy out the contract and pay them to leave.',
      effects: { power: -1, sov: 5, legit: -1, treasury: -170 }, theory: [1, 2, 0],
      debrief: {
        explain: 'You paid to recover control. It avoids bloodshed but costs a fortune, and it shows other armed groups that occupying valuable land is a good way to get paid.',
        parallel: 'Governments that end contracts with private military companies often face large financial claims and disputes over unpaid fees and resource concessions.',
        think: 'Evaluate the long-term costs of relying on private military companies.' } },
    { label: 'Let them stay. The mines are quiet, the Front is gone.',
      effects: { power: 1, sov: -7, legit: -4, treasury: 20 }, theory: [2, 0, 0],
      debrief: {
        explain: 'You accepted that part of your territory is run by a private army. It is calm for now, but a state that cannot send its own inspectors into its own mines has lost a real piece of sovereignty.',
        parallel: 'UN experts and journalists have reported that in parts of the Central African Republic, Wagner-linked forces controlled mining areas and checkpoints, raising questions about who really governed those regions.',
        think: 'Discuss whether a state that does not control all its territory is still fully sovereign.' } }
  ],
  advice: {
    realist: 'No state survives sharing its guns. Take the mines back.',
    liberal: 'Buy them out and take Ironvale to court abroad. Use law, not soldiers.',
    constructivist: 'They have a flag. Flags are claims. Every day it flies, people get used to it.',
    finance: 'The buy-out costs 170. A war costs more. Doing nothing costs us three gold mines, which I believe is the point.'
  }
},
{
  id: 'CB11', area: 'conflict', concept: 'Peace', related: 'Democracy', requires: ['peace_talks'],
  actor: { name: 'Free Highlands Front', type: 'armed', icon: 'rifle' },
  title: 'The Referendum', case: 'Colombian peace referendum, 2016',
  text: "Remember the priest's letter and the peace talks? After months of negotiation in a monastery near the border, your team and the Free Highlands Front have a 297-page agreement: disarmament, land reform, seats in parliament for the Front's new party, and a special court for war crimes. You promised the people a vote. The latest poll: 49% yes, 47% no, 4% undecided.",
  options: [
    { label: 'Campaign hard for a yes vote.', cost: { influence: 1 },
      effects: { power: 2, legit: 7, inter: 2, rel: { alvenmark: 1 } }, theory: [0, 2, 3],
      debrief: {
        explain: 'You used persuasion to give peace democratic legitimacy. Winning the vote would make the deal far harder to undo. Campaigning also divides the country further along the lines of the vote.',
        parallel: 'In October 2016, Colombia\'s peace agreement with the FARC was rejected in a referendum by 50.2% to 49.8%, with turnout under 40%. Many observers had expected it to pass.',
        think: 'To what extent should peace agreements be put to a popular vote?' } },
    { label: 'Let the people decide, with no campaign.', risk: 'High', theory: [0, 2, 2],
      gamble: { chance: 0.5,
        win: { text: 'The yes side wins by 41,000 votes. In the highlands, people fire fireworks instead of rifles.', effects: { legit: 6, power: 2, sov: 2 } },
        lose: { text: 'The no side wins by 23,000 votes. The agreement is dead. Fighters in the passes check their weapons.', effects: { legit: -4, power: -3, mood: 1 } } },
      debrief: {
        explain: 'You trusted the vote completely. It gives the result real legitimacy either way, but peace now depends on a coin toss, and the losing side may not accept the result.',
        parallel: 'Colombia\'s 2016 referendum showed how close peace votes can be. After the rejection, the government and FARC revised the agreement, and Congress approved it weeks later.',
        think: 'Evaluate whether democratic legitimacy or peace should come first.' } },
    { label: 'Skip the vote and pass the deal through parliament.',
      effects: { power: 3, legit: -5, sov: 1 }, setFlags: ['peace_by_parliament'], theory: [2, 1, 0],
      debrief: {
        explain: 'You secured peace through institutions rather than a public vote. It is lawful and faster, but you broke a promise, and opponents will say the peace was never accepted by the people.',
        parallel: 'After the 2016 referendum defeat, Colombia\'s revised agreement was approved by Congress rather than a second referendum. Critics argued that this ignored the voters; supporters said it saved the peace.',
        think: 'Discuss whether elected parliaments can provide enough legitimacy for major decisions.' } }
  ],
  advice: {
    realist: 'Use parliament. You have the votes there. Peace is too important to leave to a poll.',
    liberal: 'Campaign hard. A peace that wins at the ballot box will last.',
    constructivist: 'For thirty years the Front was "the enemy". The vote is a vote on whether they can become "us".',
    finance: 'A campaign costs a Media Campaign. A lost referendum costs another decade of war. I know which number is bigger.'
  }
},
{
  id: 'CB12', area: 'development', concept: 'Interdependence', related: 'Soft power', requires: ['alvenmark_promise'],
  actor: { name: 'The Commonwealth of Alvenmark', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'The Promise', case: 'Aid and voting in international bodies',
  text: "Remember the aid package you took from Alvenmark in exchange for 'a promise to be named later'? Alvenmark has named it. Next month the Concord votes on a resolution criticising Karst's treatment of its minority provinces. Alvenmark expects {country} to co-sponsor it and to speak in the debate. Karst's ambassador has already mentioned, in passing, how much your exporters rely on Karst's railways.",
  options: [
    { label: 'Keep your promise. Co-sponsor and speak.',
      effects: { power: -2, legit: 4, inter: 3, rel: { alvenmark: 2, karst: -3 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You kept your word. Reliability is a form of soft power: states that honour promises are trusted with bigger ones. But it costs you with Karst, and it shows that aid can buy political support.',
        parallel: 'Economists Ilyana Kuziemko and Eric Werker found that countries serving on the UN Security Council received noticeably more US and UN aid during their terms, suggesting that aid and votes are often linked.',
        think: 'To what extent does foreign aid buy political influence?' } },
    { label: 'Vote yes, but stay silent in the debate.',
      effects: { legit: -1, inter: 1, rel: { alvenmark: -1, karst: -1 } }, theory: [2, 1, 0],
      debrief: {
        explain: 'You tried to satisfy both sides at the minimum. Alvenmark is disappointed, Karst is irritated, and nobody is fully satisfied. Hedging can protect you, or leave you with no friends.',
        parallel: 'Small states often hedge in international votes, for example by abstaining or voting without speaking, to avoid offending powerful partners on both sides.',
        think: 'Evaluate whether hedging is a sensible strategy for small states.' } },
    { label: 'Break the promise. Abstain.',
      effects: { power: 1, sov: 3, legit: -4, rel: { alvenmark: -3, karst: 1 } }, theory: [3, 0, 0],
      debrief: {
        explain: 'You put your trade with Karst ahead of your word to Alvenmark. It protects the railways, but a broken promise damages trust, and the next favour you ask for will be harder to get.',
        parallel: 'Realists argue that states keep promises only when it suits their interests. Liberals and constructivists respond that reputation for reliability is itself an important national interest.',
        think: 'Discuss whether states should keep promises that no longer serve their interests.' } }
  ],
  advice: {
    realist: 'Promises are paper. Railways are steel. Abstain.',
    liberal: 'Keep your word. Our credibility is worth more than one railway.',
    constructivist: 'Are we a country that keeps its promises? This vote answers that question, for everyone.',
    finance: 'We already spent the aid package. That is the problem with promises: you pay for them later.'
  }
}
];


CONTENT.cards.push(
{
  id: 'N1', area: 'conflict', concept: 'Power', related: 'Security',
  actor: { name: 'National Cyber Centre', type: 'domestic', icon: 'shield' },
  title: 'Lights Out at the Ministry', case: 'Cyberattacks on Estonia, 2007',
  text: "At 9:02 this morning every screen in the finance ministry went black. By ten, two banks, the rail timetable and the national weather service were down too. Your cyber centre has traced the attack through servers in three countries to an office block in Karst. Karst's ambassador calls the idea 'science fiction'. Cash machines are empty, queues are forming, and the head of your cyber centre is asking what she is allowed to do.",
  options: [
    { label: 'Name Karst in public and expel two of its diplomats.',
      effects: { power: 3, sov: 4, inter: -2, rel: { karst: -2 } }, tags: ['hostile'], theory: [3, 0, 1],
      debrief: {
        explain: 'You answered a hidden attack with an open accusation. Naming the attacker shows strength and warns others, but proof in cyberspace is rarely complete, and the accused state can simply deny it.',
        parallel: 'In 2007, after Estonia moved a Soviet war memorial, weeks of cyberattacks hit its banks, media and government websites. Estonia blamed Russia, which denied any involvement.',
        think: 'To what extent can a state respond to an attack when it cannot fully prove who carried it out?' } },
    { label: 'Ask the Concord for a joint cyber-defence team.',
      effects: { sov: -3, legit: 2, inter: 5 }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You treated the attack as a shared problem and asked an institution for help. That spreads the cost and builds common rules, but it lets foreign experts inside your networks.',
        parallel: 'After the 2007 attacks on Estonia, NATO set up a cyber defence centre of excellence in the Estonian capital, Tallinn, in 2008.',
        think: 'Evaluate the claim that cyber security can only be achieved through international cooperation.' } },
    { label: 'Quietly hit back at the office block in Karst.', cost: { security: 1 },
      gamble: { chance: 0.55,
        win: { text: 'The office block in Karst loses power for a week. Nobody says a word.', effects: { power: 5, sov: 2 } },
        lose: { text: 'Your counter-strike escapes into the wild and shuts down a hospital network in Port Selene.', effects: { legit: -4, inter: -5, rel: { selene: -2, karst: -1 } } } },
      theory: [3, 0, 0],
      debrief: {
        explain: 'You chose to retaliate in secret. Cyber weapons are cheap and deniable, but they are hard to aim. Code written for one target can spread to others, including your friends.',
        parallel: 'In 2017 the NotPetya malware, aimed at Ukraine, spread around the world and cost companies such as the shipping firm Maersk hundreds of millions of dollars.',
        think: 'Discuss whether offensive cyber operations make a state more or less secure.' } }
  ],
  advice: {
    realist: 'They hit us because it was free. Make it expensive.',
    liberal: 'No small state can defend a network alone. Share the problem.',
    constructivist: 'There are no agreed rules for this yet. What we do today helps to write them.',
    finance: 'Every hour the banks are down costs more than the whole cyber centre does in a year.'
  }
},
{
  id: 'N2', area: 'development', concept: 'Interdependence', related: 'Health',
  actor: { name: 'World Health Assembly', type: 'IGO', icon: 'globe' },
  title: 'The Fever', case: 'COVID-19 pandemic, 2020',
  text: "A new fever is spreading in the port district. Forty people are in hospital, six have died, and the first case abroad has just been confirmed on a cruise ship that left {capital} last week. The World Health Assembly asks you to share every sample and keep trade moving. Your health minister wants the ports and airport closed tonight. The tourism board points out that the summer season starts in nine days.",
  options: [
    { label: 'Close the borders tonight and lock down the port district.',
      effects: { sov: 6, legit: 3, inter: -6, treasury: -90 }, theory: [3, 0, 1],
      debrief: {
        explain: 'You used the oldest tool a state has: control of its borders. It buys time and can save lives, but it cuts you off from trade, travel and the partners you may need later.',
        parallel: 'In March 2020 New Zealand closed its borders to almost all non-residents and imposed a strict lockdown. Deaths stayed low for a long time, but the country was largely shut off from the world for about two years.',
        think: 'To what extent is closing borders an effective response to a global health emergency?' } },
    { label: 'Share all samples and join the Assembly\'s vaccine pool.', cost: { aid: 1 },
      effects: { sov: -3, legit: 2, inter: 7, treasury: -40 }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You bet on cooperation: sharing data early helps everyone, and a common pool should get vaccines to poor and rich alike. The risk is that richer states look after themselves first.',
        parallel: 'COVAX was set up in 2020 to share COVID-19 vaccines fairly between countries. Richer countries bought up early supplies through their own deals, and COVAX missed its first delivery targets.',
        think: 'Evaluate the success of global institutions in managing health crises.' } },
    { label: 'Keep everything open and ask people to be sensible.',
      gamble: { chance: 0.4,
        win: { text: 'The outbreak fades on its own. The summer season is saved.', effects: { legit: 3, inter: 3, treasury: 60 } },
        lose: { text: 'The hospitals fill within three weeks. Neighbours close their borders to you instead.', effects: { legit: -8, inter: -4, treasury: -60 } } },
      theory: [1, 1, 1],
      debrief: {
        explain: 'You protected the economy and trusted people to change their own behaviour. If the disease is mild, that looks wise. If it is not, the state is blamed for every death it did not try to prevent.',
        parallel: 'Sweden avoided a strict lockdown in spring 2020 and relied mainly on voluntary measures. An official commission later said the early response was too slow, and death rates were higher than in its Nordic neighbours.',
        think: 'Discuss the view that protecting the economy and protecting public health are competing goals.' } }
  ],
  advice: {
    realist: 'Close the gates. Nobody will thank us for being polite and infected.',
    liberal: 'A virus does not carry a passport. Only shared data beats it.',
    constructivist: 'People will remember whether we treated this as their problem or ours.',
    finance: 'A closed port costs 90 a quarter. A dead tourist season costs more. Choose which bill you want.'
  }
},
{
  id: 'N3', area: 'development', concept: 'Sovereignty', related: 'Development',
  actor: { name: 'Concord Monetary Fund', type: 'IGO', icon: 'coin' },
  title: 'The Bond Market Calls', case: 'Greek debt crisis, 2010',
  text: "Investors have stopped buying your government bonds. Without new money, teachers and nurses will not be paid next month. The Concord Monetary Fund offers a rescue loan, with a list of conditions eleven pages long: cut pensions, sell the ports, raise fuel tax. The Auric Directorate offers the same amount with no list at all, only a handshake. Your central bank governor suggests a third way: stop paying and start again.",
  options: [
    { label: 'Take the Fund\'s loan and accept its conditions.',
      effects: { sov: -6, legit: -4, inter: 5, treasury: 220 }, theory: [0, 3, 0],
      debrief: {
        explain: 'You accepted conditionality: money now, in exchange for outside control over your budget. It keeps you inside the system, but voters did not choose the people writing your policies.',
        parallel: 'From 2010 Greece received rescue loans from the EU and the IMF in exchange for deep spending cuts and tax rises. Its economy shrank by about a quarter.',
        think: 'To what extent do international lenders limit the sovereignty of indebted states?' } },
    { label: 'Take the Auric loan. No list, no questions.',
      effects: { sov: -4, inter: -2, treasury: 220, rel: { auric: 2, alvenmark: -1 } }, setFlags: ['auric_loan'], theory: [3, 0, 0],
      debrief: {
        explain: 'You chose a lender that asks for nothing in public. Loans without conditions are rarely loans without expectations. The price is usually paid later, in votes, ports or silence.',
        parallel: 'In 2020 Zambia became the first African country to default on its debt during the pandemic. Agreeing a rescue took years, partly because it owed money to many different lenders, including Chinese state banks.',
        think: 'Evaluate the view that all foreign lending is a tool of political influence.' } },
    { label: 'Default. Stop paying and renegotiate from scratch.',
      effects: { sov: 5, legit: -2, inter: -7, treasury: 60, rel: { selene: -2 } }, theory: [2, 0, 2],
      debrief: {
        explain: 'You refused to put creditors first. A default frees money at home, but it shuts you out of lending markets, and the people you owe do not forget.',
        parallel: 'In 2008 Iceland let its three largest banks fail instead of rescuing their foreign creditors. Its economy recovered within a few years, but a dispute with the UK and the Netherlands over lost savings lasted much longer.',
        think: 'Discuss whether a state should ever refuse to repay its debts.' } }
  ],
  advice: {
    realist: 'Whoever pays your bills owns your foreign policy. Pick the owner you can live with.',
    liberal: 'The Fund is harsh but it is rules, not favours. Rules can be argued with.',
    constructivist: 'A state that cannot pay its teachers soon cannot explain why it exists.',
    finance: 'I have read the eleven pages. Page seven is the one that will end your career.'
  }
},
{
  id: 'N4', area: 'rights', concept: 'Legitimacy', related: 'Media',
  actor: { name: 'Lantern Watch', type: 'NGO', icon: 'lantern' },
  title: 'The Video', case: 'Online disinformation and "fake news" laws',
  text: "A video of you taking a bribe has been watched four million times since breakfast. It is fake: the voice is generated and the room does not exist. Lantern Watch has traced the first uploads to rented accounts in Karst. Half the country has seen the video; a tenth has seen the correction. The platform, Chirrup, says it is 'reviewing the content'. Your justice minister has a draft law ready that would let the government order any post removed within an hour.",
  options: [
    { label: 'Pass the law. The government can order false posts removed.',
      effects: { power: 5, sov: 2, legit: -5 }, theory: [3, 0, 0],
      debrief: {
        explain: 'You gave the state the power to decide what is true online. It works fast against lies. It also works fast against critics, and the next government inherits the same power.',
        parallel: 'Singapore\'s 2019 law against online falsehoods lets ministers order corrections to posts they judge to be false. Human rights groups argue that it can be used to silence opposition voices.',
        think: 'To what extent should governments have the power to remove false information?' } },
    { label: 'Put media literacy into every school timetable.',
      effects: { legit: 4, power: -2, treasury: -50 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You chose to change how citizens read, not what they are allowed to read. It is slow and will not stop this video, but people who can spot a fake are harder to fool next time.',
        parallel: 'Finland teaches media literacy across its school curriculum and has repeatedly been ranked first in a European index of resistance to disinformation.',
        think: 'Evaluate education as a defence against disinformation.' } },
    { label: 'Threaten Chirrup with heavy fines unless it acts.', cost: { influence: 1 },
      effects: { sov: 3, legit: 2, inter: -3 }, theory: [1, 2, 1],
      debrief: {
        explain: 'You put the duty on the company that profits from the traffic. Regulating a multinational platform shows that non-state actors can be made to follow rules, if the state is a big enough market.',
        parallel: 'The EU\'s Digital Services Act, agreed in 2022, requires the largest online platforms to reduce risks such as disinformation or face fines of up to 6% of their global turnover.',
        think: 'Discuss the extent to which states can control multinational technology companies.' } }
  ],
  advice: {
    realist: 'A lie that travels this fast is a weapon. Treat it like one.',
    liberal: 'Make the platform follow rules. Do not make yourself the editor of the internet.',
    constructivist: 'People believed it because they already half-believed it. Ask why.',
    finance: 'Chirrup\'s fine would pay for the school programme twice over.'
  }
},
{
  id: 'N5', area: 'conflict', concept: 'Security', related: 'Power',
  actor: { name: 'The Federation of Karst', type: 'state', icon: 'fortress', state: 'karst' },
  title: 'The Missile Gap', case: 'Cold War arms race and the INF Treaty',
  text: "Satellite photos show Karst rolling new medium-range missiles into sheds forty kilometres from your border. They could reach {capital} in four minutes. Marshal Halden calls them 'purely defensive'. Your generals want a missile shield, at a price your finance minister reads twice. Alvenmark's diplomats suggest talks. And a small group in parliament argues that a country with no missiles is a country nobody needs to aim at.",
  options: [
    { label: 'Buy the missile shield.',
      effects: { power: 6, sov: 2, treasury: -160, rel: { karst: -2 } }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You matched a threat with a defence. To you it is a shield. To Karst it looks like a way to strike first without fear, so it builds more. This spiral is the security dilemma.',
        parallel: 'During the Cold War the United States and the Soviet Union kept matching each other\'s weapons. By the mid-1980s they held around 70,000 nuclear warheads between them.',
        think: 'To what extent does building up weapons make a state safer?' } },
    { label: 'Propose talks to ban these missiles on both sides.', cost: { influence: 1 },
      effects: { power: -2, legit: 3, inter: 5, rel: { karst: 1, alvenmark: 1 } }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You tried to remove the weapon instead of matching it. Arms control makes both sides safer and richer, but only while each trusts the other to keep its word.',
        parallel: 'The 1987 INF Treaty between the United States and the Soviet Union removed a whole class of missiles from Europe. The United States withdrew in 2019, accusing Russia of breaking it.',
        think: 'Evaluate the effectiveness of arms control treaties.' } },
    { label: 'Do nothing. We are not a target if we are not a threat.',
      effects: { power: -4, legit: 2, treasury: 40 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You refused to play. Staying unarmed saves money and can lower tension, but it relies on your neighbour sharing your idea of what a threat is.',
        parallel: 'Costa Rica abolished its army in 1948 and has relied on diplomacy, treaties and regional courts for its security ever since.',
        think: 'Discuss whether a state can be secure without military power.' } }
  ],
  advice: {
    realist: 'Four minutes. That is how long your neutrality lasts.',
    liberal: 'Every missile they build costs them too. Offer them a way to stop.',
    constructivist: 'They call them defensive. So would we. That is the whole problem.',
    finance: 'The shield costs 160. Peace talks cost a hotel bill.'
  }
},
{
  id: 'N6', area: 'development', concept: 'Development', related: 'Interdependence',
  actor: { name: 'World Food Agency', type: 'IGO', icon: 'globe' },
  title: 'The Empty Silos', case: 'Food price crisis and export bans',
  text: "The rains failed for the second year. The wheat harvest is down by half and the price of bread has doubled since spring. Your grain traders are still exporting to Port Selene, where prices are even higher. The World Food Agency offers emergency shipments. The farmers' union wants the exports stopped today. In the market in {capital} this morning, a baker was beaten for putting his prices up.",
  options: [
    { label: 'Ban grain exports until the next harvest.',
      effects: { sov: 4, legit: 4, inter: -5, rel: { selene: -2 } }, theory: [3, 0, 1],
      debrief: {
        explain: 'You kept your food at home. That calms your own markets, but when several states do the same, world prices rise further and poorer importers suffer most.',
        parallel: 'In 2010 Russia banned wheat exports after drought and wildfires destroyed part of its harvest. World wheat prices rose sharply in the weeks that followed.',
        think: 'To what extent are export bans a legitimate response to food shortages?' } },
    { label: 'Accept the World Food Agency\'s shipments.',
      effects: { sov: -3, legit: 2, inter: 5, power: -1 }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You accepted help from a global institution. It feeds people quickly, but it also tells the world, and your own citizens, that the state could not manage alone.',
        parallel: 'The UN World Food Programme, the largest humanitarian organisation working against hunger, was awarded the Nobel Peace Prize in 2020.',
        think: 'Evaluate the role of intergovernmental organisations in responding to food crises.' } },
    { label: 'Subsidise bread from the treasury.',
      effects: { legit: 6, treasury: -120 }, theory: [1, 1, 2],
      debrief: {
        explain: 'You paid to keep bread cheap. Subsidies protect the poorest and buy calm, but they are very hard to remove once people depend on them.',
        parallel: 'Egypt has subsidised bread for decades. When the government tried to cut food subsidies in 1977, riots broke out across the country and the cuts were reversed.',
        think: 'Discuss the view that food security is the foundation of political stability.' } }
  ],
  advice: {
    realist: 'Feed your own first. Hungry cities overthrow governments.',
    liberal: 'If everyone hoards, everyone starves a little more. Keep trade open and take the help.',
    constructivist: 'Bread is never only bread. It is the promise that the state looks after you.',
    finance: 'The subsidy costs 120 a quarter and you will never be able to end it.'
  }
},
{
  id: 'N7', area: 'rights', concept: 'Identity', related: 'Legitimacy',
  actor: { name: 'National Football Federation', type: 'domestic', icon: 'flag' },
  title: 'The Striker\'s Knee', case: 'Athlete protests',
  text: "Before last night's cup qualifier, the national team's star striker knelt during the anthem. Afterwards she told reporters she will not sing it until the police who beat protesters in {capital} last year are put on trial. Her shirt has sold out. So has a shirt with her face crossed out. The football federation asks whether she should be dropped. The veterans' association has already answered for them.",
  options: [
    { label: 'Have her dropped from the national team.',
      effects: { power: 3, sov: 2, legit: -5 }, theory: [2, 0, 1],
      debrief: {
        explain: 'You defended a national symbol by punishing the person who questioned it. That pleases some citizens, but it turns one protest into a larger argument about who is allowed to speak for the nation.',
        parallel: 'In 2016 the American football player Colin Kaepernick knelt during the national anthem to protest police violence. He was not signed by any team after that season, and the gesture spread across world sport.',
        think: 'To what extent should national symbols be protected from protest?' } },
    { label: 'Invite her to the palace and listen.',
      effects: { legit: 5, power: -3 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You treated a famous critic as someone to talk to. Celebrities are non-state actors with real influence, and meeting them can turn a protest into a reform. It can also look like weakness.',
        parallel: 'In 2020 the footballer Marcus Rashford campaigned for free school meals in England. The UK government reversed its decision and extended meal vouchers through the summer holidays.',
        think: 'Evaluate the influence of celebrities on government policy.' } },
    { label: 'Say nothing. It is only football.',
      effects: { legit: -2, inter: -1 }, theory: [1, 1, 0],
      debrief: {
        explain: 'You stayed out of it. Silence avoids choosing a side, but both sides notice, and the argument continues without you.',
        parallel: 'In 2018 Mesut Özil left the German national team, saying he had faced racism and disrespect after being criticised for a photograph with Turkey\'s president. The row became a national debate about identity.',
        think: 'Discuss the relationship between sport and national identity.' } }
  ],
  advice: {
    realist: 'A team is a uniform. People in uniform do not get to improvise.',
    liberal: 'She has a right to kneel. You have a duty to answer the question she asked.',
    constructivist: 'The anthem only means something because people choose to sing it.',
    finance: 'Her shirt sales paid for the new stadium roof. I am just mentioning it.'
  }
},
{
  id: 'N8', area: 'rights', concept: 'Human rights', related: 'Sovereignty',
  actor: { name: 'The Capital Ledger', type: 'media', icon: 'news' },
  title: 'The Memory Stick', case: 'Edward Snowden, 2013',
  text: "A clerk from your intelligence service has given The Capital Ledger a memory stick. It proves that the service has been collecting the phone records of every citizen for three years, without a court order. The clerk is now in Alvenmark asking for asylum. Your security chief calls him a traitor and wants him back in handcuffs. The Ledger will publish more on Sunday. Polls say most people did not know, and most people mind.",
  options: [
    { label: 'Charge him with espionage and demand his return.',
      effects: { power: 4, sov: 3, legit: -5, rel: { alvenmark: -2 } }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You treated the leak as a crime against the state. That protects secrets and discipline, but it makes the messenger the story and leaves the surveillance itself unanswered.',
        parallel: 'In 2013 Edward Snowden leaked documents showing mass surveillance by the US National Security Agency. He was charged under the Espionage Act and has lived in Russia ever since.',
        think: 'To what extent is national security a justification for limiting the right to privacy?' } },
    { label: 'Order an independent review and end the mass collection.',
      effects: { power: -4, legit: 6, inter: 2 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You accepted that the state had gone too far and put limits on it. Giving up a power is rare and costly, but it rebuilds the trust that the leak destroyed.',
        parallel: 'In 2015 the US Congress passed the USA Freedom Act, which ended the National Security Agency\'s bulk collection of Americans\' phone records.',
        think: 'Evaluate the importance of checks on the power of intelligence services.' } },
    { label: 'Pass a law protecting whistleblowers, starting with him.',
      effects: { power: -3, sov: -2, legit: 5, rel: { alvenmark: 1 } }, theory: [0, 2, 3],
      debrief: {
        explain: 'You changed the rule so that exposing wrongdoing is protected, not punished. It strengthens accountability, though your own officials will now think twice about what they write down.',
        parallel: 'The EU adopted a Whistleblower Protection Directive in 2019, requiring member states to protect people who report breaches of EU law from being punished.',
        think: 'Discuss whether whistleblowers strengthen or weaken the state.' } }
  ],
  advice: {
    realist: 'A service that cannot keep secrets cannot keep you safe.',
    liberal: 'The law was broken, and not by the clerk.',
    constructivist: 'Traitor or hero is decided by the story that wins. Right now he is winning.',
    finance: 'Storing three years of phone records cost more than the navy. Ending it is the cheap part.'
  }
},
{
  id: 'N9', area: 'conflict', concept: 'Sovereignty', related: 'International law',
  actor: { name: 'Port Selene', type: 'state', icon: 'skyscraper', state: 'selene' },
  title: 'The Rocks Nobody Wanted', case: 'Maritime disputes and joint development',
  text: "For a century nobody cared who owned the Gull Rocks: three islets, one lighthouse, a great many birds. Last month a survey ship found gas under the seabed around them. Port Selene has published an old map showing the rocks as its own. Your navy has an older map. Selene's coastguard is now anchored on one side of the lighthouse and your fishing fleet on the other.",
  options: [
    { label: 'Take the case to the international maritime tribunal.',
      effects: { sov: -2, legit: 3, inter: 4, power: -1 }, theory: [0, 3, 1],
      debrief: {
        explain: 'You asked a court to decide. International law gives small states a way to argue as equals, but a ruling only matters if the other side accepts it.',
        parallel: 'In 2016 an arbitration tribunal under the UN Convention on the Law of the Sea ruled in favour of the Philippines against China\'s claims in the South China Sea. China rejected the ruling.',
        think: 'To what extent can international law settle disputes between states?' } },
    { label: 'Land marines on the rocks and raise the flag.', cost: { security: 1 },
      effects: { power: 5, sov: 5, inter: -5, rel: { selene: -3 } }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You created a fact on the ground. Occupation is the oldest claim there is, and the hardest to undo, but it invites the other side to do the same with a bigger force.',
        parallel: 'In 1982 Argentina seized the Falkland Islands, which it had long claimed. Britain sent a naval task force and retook them after a war lasting about ten weeks.',
        think: 'Evaluate the claim that territory can only be secured by force.' } },
    { label: 'Offer Selene a joint zone and split the gas.',
      effects: { sov: -3, inter: 5, treasury: 70, rel: { selene: 2 } }, tags: ['cooperative'], theory: [1, 3, 0],
      debrief: {
        explain: 'You set the ownership question aside and shared the benefit. Both sides gain now, though the border stays unsettled and the argument can return when the gas runs out.',
        parallel: 'In 1979 Malaysia and Thailand agreed to develop the gas in a disputed part of the Gulf of Thailand together, sharing the revenue without settling the boundary.',
        think: 'Discuss whether shared resources reduce or increase the risk of conflict.' } }
  ],
  advice: {
    realist: 'A flag and forty marines. The lawyers can argue afterwards.',
    liberal: 'Split it. Half the gas and a friend is worth more than all the gas and an enemy.',
    constructivist: 'Nobody loved those rocks until last month. Careful what you teach people to die for.',
    finance: 'The gas is worth 70 a quarter shared. A naval standoff costs that in fuel alone.'
  }
},
{
  id: 'N10', area: 'development', concept: 'Development', related: 'Globalisation',
  actor: { name: 'Aquila Water Group', type: 'MNC', icon: 'coin' },
  title: 'The Taps', case: 'Cochabamba Water War, 2000',
  text: "A third of the water pumped into {capital}'s pipes leaks out before it reaches a tap. Fixing the system would cost more than a year of the health budget. Aquila Water Group, a multinational, offers to buy the whole network, repair it and run it for forty years. Bills would rise by about half. The water workers' union has parked a tanker across the gates of the treatment plant.",
  options: [
    { label: 'Sell the network to Aquila.',
      effects: { sov: -4, legit: -5, inter: 4, treasury: 180 }, theory: [1, 2, 0],
      debrief: {
        explain: 'You brought in private money and expertise to fix a public service. The pipes get mended, but a basic need becomes a product, and the company answers to shareholders abroad.',
        parallel: 'In 2000 the privatisation of water in Cochabamba, Bolivia, was followed by sharp price rises. Mass protests known as the Water War forced the government to cancel the contract.',
        think: 'To what extent should essential services be run by private companies?' } },
    { label: 'Keep it public and raise taxes to repair it.',
      effects: { sov: 3, legit: 2, treasury: -130 }, theory: [1, 0, 2],
      debrief: {
        explain: 'You kept control of a basic service and asked citizens to pay for it together. It protects access for the poor, but the money has to come from somewhere, and repairs will be slow.',
        parallel: 'Paris took its water supply back into public hands in 2010, after 25 years of private operation.',
        think: 'Evaluate the role of the state in providing basic needs.' } },
    { label: 'Lease it to Aquila for ten years under a price cap.', cost: { influence: 1 },
      effects: { sov: -2, legit: -1, inter: 3, treasury: 60 }, theory: [1, 3, 0],
      debrief: {
        explain: 'You tried to get private investment while keeping public rules. Regulation can balance profit and access, but only if the regulator is stronger than the company it watches.',
        parallel: 'England and Wales privatised water in 1989 and created a regulator, Ofwat, to limit prices. In the 2020s the companies faced heavy criticism over sewage spills and debt.',
        think: 'Discuss whether regulation can make privatised services serve the public interest.' } }
  ],
  advice: {
    realist: 'Whoever controls the water controls the city. I would not hand that to a logo.',
    liberal: 'Private money, public rules. It can work if the contract is good.',
    constructivist: 'People do not think of water as something you buy. Change that and you change the country.',
    finance: 'We lose a third of the water and all of the revenue from it. Something has to give.'
  }
},
{
  id: 'N11', area: 'development', concept: 'Legitimacy', related: 'Power', protest: true,
  actor: { name: 'General Workers\' Congress', type: 'movement', icon: 'crowd' },
  title: 'Nothing Moves', case: 'Pension reform strikes in France',
  text: "No trains, no buses, no bin collections and, since this morning, no electricity between noon and two. The General Workers' Congress has called an open-ended strike against your plan to raise the pension age by three years. Your finance minister says that without the reform the pension fund is empty in a decade. The Congress says it will end the strike the moment the plan is withdrawn, and not one minute before.",
  options: [
    { label: 'Withdraw the plan and open talks.',
      effects: { power: -4, legit: 5, treasury: -80 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You backed down in front of organised citizens. It restores calm and shows the government listens, but the pension problem is still there, and everyone has learned that strikes work.',
        parallel: 'In 1995 three weeks of strikes paralysed France. The government dropped its plan to reform public-sector pensions.',
        think: 'To what extent do strikes give ordinary citizens power over governments?' } },
    { label: 'Push the reform through by decree.',
      effects: { power: 4, legit: -6, treasury: 80 }, theory: [2, 1, 0],
      debrief: {
        explain: 'You used a legal shortcut to avoid a vote you might lose. The reform passes, but a law made without consent has to be defended every day afterwards.',
        parallel: 'In 2023 the French government raised the pension age from 62 to 64, using a constitutional power to pass the law without a vote in the lower house, despite months of strikes and protests.',
        think: 'Evaluate the claim that legal decisions are not always legitimate decisions.' } },
    { label: 'Declare an emergency and order the army to run the trains.', cost: { security: 1 },
      effects: { power: 6, sov: 2, legit: -8 }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You broke the strike with the state\'s own force. Services return, but using soldiers against workers changes what the army is for, and what people think the government is for.',
        parallel: 'In 1981 US President Ronald Reagan dismissed more than 11,000 air traffic controllers who refused to end an illegal strike. It is often seen as a turning point for trade unions in the United States.',
        think: 'Discuss the limits of state power in responding to peaceful protest.' } }
  ],
  advice: {
    realist: 'If the unions can stop the country, the unions run the country.',
    liberal: 'Negotiate. A reform that half the country hates will be undone by the next government.',
    constructivist: 'A pension is a promise. They think you are breaking it.',
    finance: 'The fund is empty in ten years whatever anyone shouts.'
  }
},
{
  id: 'N12', area: 'conflict', concept: 'Sovereignty', related: 'Identity',
  actor: { name: 'Northern Assembly', type: 'domestic', icon: 'flag' },
  title: 'The Northern Question', case: 'Scotland 2014 and Catalonia 2017',
  text: "The Northern Assembly has voted to hold a referendum on independence in ninety days. The north has its own language, its own flag and most of the country's copper. Your constitution says the state is 'one and indivisible'. The Assembly's leader says that sentence was written without asking the north. Polls there are split almost exactly in half, and your interior minister wants to know whether to print ballot papers or arrest warrants.",
  options: [
    { label: 'Agree to a legal, binding referendum.',
      gamble: { chance: 0.6,
        win: { text: 'The north votes to stay, by 54% to 46%. The question is settled, for now.', effects: { legit: 8, sov: 3 } },
        lose: { text: 'The north votes to leave. You lose the copper, and a tenth of your citizens.', effects: { power: -8, sov: -6, legit: 2, treasury: -100 } } },
      theory: [0, 2, 3],
      debrief: {
        explain: 'You let the people of the region decide. Self-determination is a powerful principle, and a fair vote can settle a question for a generation. But you accepted that you might lose.',
        parallel: 'In 2014 the UK government agreed to a referendum on Scottish independence. On a very high turnout, 55% voted to remain in the United Kingdom.',
        think: 'To what extent does the right to self-determination override the territorial integrity of a state?' } },
    { label: 'Declare the vote illegal and send in the national police.',
      effects: { power: 4, sov: 6, legit: -7, inter: -2, rel: { alvenmark: -1 } }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You defended the territory of the state with law and force. The border holds, but pictures of police seizing ballot boxes travel fast and can turn doubters into separatists.',
        parallel: 'In 2017 Spain\'s courts ruled Catalonia\'s independence referendum illegal. Police tried to stop the voting, and the central government then imposed direct rule on the region.',
        think: 'Evaluate the use of force to preserve the territorial integrity of a state.' } },
    { label: 'Offer the north wide autonomy instead.',
      effects: { power: -3, sov: -2, legit: 4, treasury: -50 }, theory: [1, 2, 2],
      debrief: {
        explain: 'You offered self-government inside the state. Autonomy can answer the wish to be different without breaking the country, though some will see it as a first step, not a last one.',
        parallel: 'In 2005 a peace agreement signed in Helsinki ended decades of conflict in Aceh, Indonesia, by giving the province special autonomy within the country.',
        think: 'Discuss whether autonomy is an effective alternative to independence.' } }
  ],
  advice: {
    realist: 'A state that lets its provinces vote on leaving has already agreed that they may.',
    liberal: 'A fair vote you win is worth more than a border you hold by force.',
    constructivist: 'They do not feel like us. That is the fact. The referendum is only the symptom.',
    finance: 'The copper is a fifth of our exports. I would like to keep the copper.'
  }
},
{
  id: 'N13', area: 'conflict', concept: 'Sovereignty', related: 'Power',
  actor: { name: 'The Commonwealth of Alvenmark', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'The Lease', case: 'Foreign military bases',
  text: "Alvenmark wants a naval base. It offers a thirty-year lease on your deep-water harbour at Sandhaven, a generous annual rent and a promise to 'take a close interest' in your security. Karst's ambassador has asked for a meeting 'at your earliest convenience', which is diplomatic language for now. The fishermen of Sandhaven would lose half their quay. The mayor has already ordered new signs in two languages.",
  options: [
    { label: 'Sign the lease.',
      effects: { power: 4, sov: -6, treasury: 120, rel: { alvenmark: 2, karst: -2 } }, setFlags: ['base_leased'], theory: [2, 2, 0],
      debrief: {
        explain: 'You traded a piece of territory for rent and protection. A foreign base deters your enemies, but it also makes their quarrels yours, and you no longer fully control what happens inside the fence.',
        parallel: 'Djibouti hosts military bases belonging to several powers, including the United States, France, Japan and, since 2017, China, and earns large rents from them.',
        think: 'To what extent do foreign military bases limit the sovereignty of the host state?' } },
    { label: 'Refuse. No foreign troops on our soil.',
      effects: { sov: 5, legit: 2, power: -2, rel: { alvenmark: -1, karst: 1 } }, theory: [1, 0, 3],
      debrief: {
        explain: 'You kept full control of your territory. It is popular and keeps you out of other people\'s wars, but you give up money and a powerful friend.',
        parallel: 'In 1991 the Philippine Senate voted to reject a new treaty for US military bases. US forces left Subic Bay the following year.',
        think: 'Evaluate the view that small states are safer without foreign bases.' } },
    { label: 'Offer visiting rights and joint exercises, but no base.', cost: { influence: 1 },
      effects: { power: 2, sov: -2, inter: 3, treasury: 40, rel: { alvenmark: 1, karst: -1 } }, theory: [1, 3, 0],
      debrief: {
        explain: 'You looked for a middle path: cooperation without a permanent foreign presence. It gives some protection and some rent, and leaves you room to change your mind.',
        parallel: 'Under a 2014 agreement, US forces can rotate through bases in the Philippines and store equipment there, without the permanent bases that closed in 1992.',
        think: 'Discuss how small states can balance security and independence.' } }
  ],
  advice: {
    realist: 'A great power\'s base is the best insurance there is. Read the premium carefully.',
    liberal: 'Tie it to rules: what they may do, what they may not, and who decides.',
    constructivist: 'A foreign flag over Sandhaven tells every citizen something about who we are now.',
    finance: 'The rent is 120. The fishermen\'s compensation is 15. I can do that sum.'
  }
},
{
  id: 'N14', area: 'rights', concept: 'Human rights', related: 'Technology',
  actor: { name: 'Auric Vision Systems', type: 'company', icon: 'eye', state: 'auric' },
  title: 'Ten Thousand Eyes', case: 'Facial recognition and "safe cities"',
  text: "Auric Vision Systems offers {capital} a gift: ten thousand street cameras with face recognition, installed free, linked to one control room. Street crime, they promise, will fall by a third in a year. The small print says the images are processed on servers in the Directorate. Your police chief has already chosen an office for the control room. A coalition of lawyers and students has chosen a slogan: 'Smile, you are a suspect.'",
  options: [
    { label: 'Install the full system.',
      effects: { power: 6, sov: -4, legit: -4, rel: { auric: 2 } }, theory: [3, 0, 0],
      debrief: {
        explain: 'You gave the state a powerful new way to watch its citizens, and gave a foreign company the data. Order improves, but people who know they are watched behave differently, including at protests.',
        parallel: 'A 2019 study by the Carnegie Endowment found that Chinese companies had supplied AI surveillance technology to more than 60 countries.',
        think: 'To what extent does surveillance technology threaten human rights?' } },
    { label: 'Ban face recognition in public places.',
      effects: { power: -3, legit: 5, rel: { auric: -1 } }, theory: [0, 1, 3],
      debrief: {
        explain: 'You drew a line around a technology before it became normal. It protects privacy and the freedom to gather, but the police lose a tool that other states will happily use.',
        parallel: 'In 2019 San Francisco became the first major US city to ban the use of facial recognition by its police and city agencies.',
        think: 'Evaluate the claim that some technologies should be banned outright.' } },
    { label: 'Allow it only with a judge\'s warrant, on our own servers.',
      effects: { power: 2, legit: 1, treasury: -70, rel: { auric: -1 } }, theory: [1, 3, 1],
      debrief: {
        explain: 'You accepted the tool and wrapped it in law. Rules, warrants and local control can limit abuse, as long as the courts stay independent of the people holding the cameras.',
        parallel: 'The EU\'s Artificial Intelligence Act, adopted in 2024, bans most live facial recognition by police in public places, with narrow exceptions that need prior authorisation.',
        think: 'Discuss whether law can keep pace with new technology.' } }
  ],
  advice: {
    realist: 'Free cameras from Auric. Ask yourself who else will be watching the screens.',
    liberal: 'A tool is as good as the law around it. Write the law first.',
    constructivist: 'A square full of cameras is a different kind of square.',
    finance: 'Free to install. The servers, the staff and the lawsuits are extra.'
  }
},
{
  id: 'N15', area: 'rights', concept: 'Human rights', related: 'Soft power',
  actor: { name: 'Lantern Watch', type: 'NGO', icon: 'lantern', state: 'auric' },
  title: 'The Games', case: 'Olympic boycotts',
  text: "The Continental Games open in the Auric Directorate in six weeks. Your athletes have trained for four years; your swimmers are favourites for two golds. Lantern Watch has published the names of 300 journalists and lawyers jailed in the Directorate and asks every government to stay away. Director Orr has sent you a personal invitation, hand-delivered, with a seat next to his in the stadium.",
  options: [
    { label: 'Boycott the Games entirely.',
      effects: { legit: 4, inter: -3, power: -1, rel: { auric: -3, alvenmark: 1 } }, tags: ['hostile'], theory: [0, 1, 3],
      debrief: {
        explain: 'You used absence as a message. A boycott puts values above medals and embarrasses the host, but athletes pay the price, and the jailed are rarely released because a team stayed home.',
        parallel: 'In 1980 the United States led more than 60 countries in boycotting the Moscow Olympics after the Soviet invasion of Afghanistan. Soviet forces stayed in Afghanistan until 1989.',
        think: 'To what extent are boycotts an effective way to promote human rights?' } },
    { label: 'Send the athletes. No ministers, no handshake.',
      effects: { legit: 2, rel: { auric: -1 } }, cost: { influence: 1 }, theory: [1, 2, 2],
      debrief: {
        explain: 'You separated sport from the state. A diplomatic boycott lets athletes compete while refusing the host the pictures it wants. Critics call it a gesture that costs nothing.',
        parallel: 'In 2021 the United States, the United Kingdom, Canada and Australia announced diplomatic boycotts of the 2022 Winter Olympics in Beijing: their athletes competed, but no officials attended.',
        think: 'Evaluate symbolic actions as a tool of foreign policy.' } },
    { label: 'Go, sit next to Orr and wave.',
      effects: { legit: -4, inter: 2, treasury: 40, rel: { auric: 2, alvenmark: -1 } }, theory: [3, 1, 0],
      debrief: {
        explain: 'You put interests first. Your presence helps the host look normal and respected, which is exactly why you were invited. You gain a friend and lose some moral standing.',
        parallel: 'Before the 2022 World Cup in Qatar, human rights groups accused the host of "sportswashing": using a major sporting event to improve its image abroad.',
        think: 'Discuss the role of sport as a form of soft power.' } }
  ],
  advice: {
    realist: 'Go. Medals are free and Orr remembers who came.',
    liberal: 'Send the swimmers, keep the ministers at home. Everyone understands the message.',
    constructivist: 'A stadium full of presidents is how a prison gets to look like a party.',
    finance: 'The broadcasting rights are worth 40 to us if our swimmers win.'
  }
}
);

function stamp(ctx, part, pal) {
  part.rows.forEach((row, dy) => {
    for (let dx = 0; dx < row.length; dx++) {
      const c = row[dx];
      if (c === '.' || !pal[c]) continue;
      ctx.fillStyle = pal[c];
      ctx.fillRect(part.x + dx, part.y + dy, 1, 1);
    }
  });
}
function drawPerson(canvas, p, faceName, blink) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 24, 24);
  const [skin, shade] = SKINS[p.skin] || SKINS[0];
  const pal = {
    k: '#2a2230', s: skin, S: shade, h: p.hairCol, c: p.main, C: p.alt, t: p.trim, w: '#f7f4ee', O: p.trim,
    y: '#e8b923', G: '#2fa560', g: '#2a2230', b: '#58b4ff', p: '#e98a8a',
    B: p.hair === 'bald' || p.hair === 'cap' ? '#2a2230' : p.hairCol
  };
  const face = typeof faceName === 'object' ? faceName : FACES[faceName] || FACES.calm;
  stamp(ctx, { x: 0, y: 0, rows: HEAD }, pal);
  stamp(ctx, { x: 0, y: 16, rows: OUTFITS[p.outfit || 'suit'] }, pal);
  stamp(ctx, HAIR[p.hair] || HAIR.short, pal);
  if (p.tufts) stamp(ctx, { x: 6, y: 7, rows: ['hh........hh', 'hh........hh'] }, pal);
  if (p.beard) stamp(ctx, BEARD, pal);
  if (p.cover) { ctx.clearRect(5, 0, 14, 6); stamp(ctx, COVERS[p.cover], pal); }
  if (p.glasses) stamp(ctx, GLASSES, pal);
  stamp(ctx, EYES[blink ? 'closed' : face.eyes], pal);
  stamp(ctx, BROWS[face.brows], pal);
  stamp(ctx, MOUTHS[face.mouth], pal);
  if (face.sweat) stamp(ctx, SWEAT, pal);
  if (face.blush) stamp(ctx, BLUSH, pal);
  for (const x of (p.extras || [])) stamp(ctx, EXTRAS[x], pal);
}

let actx = null, master = null;
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.15;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, start, dur, type = 'square', vol = 1) {
  if (!actx || !settings.sound) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}

const PAL = { K: '#000000', W: '#FFFFFF', G: '#14F53C', O: '#FF7A00', V: '#B84CFF', B: '#1F9CFF', g: '#4A4A4A', d: '#2B2B2B' };
const DITHER = { o: 'O', b: 'B', v: 'V', n: 'G' };

function sym(half, w) {
  const h = w / 2;
  return half.map(r => { const p = r.padStart(h, '.').slice(-h); return p + [...p].reverse().join(''); });
}
function drawSprite(ctx, rows, x, y, s = 1, swap) {
  x = Math.round(x); y = Math.round(y);
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      let ch = row[c];
      if (ch === '.' || ch === ' ') continue;
      if (swap && swap[ch]) ch = swap[ch];
      const dith = DITHER[ch];
      if (dith) {
        ctx.fillStyle = PAL[dith];
        for (let yy = 0; yy < s; yy++) for (let xx = 0; xx < s; xx++) {
          const px = x + c * s + xx, py = y + r * s + yy;
          if ((px + py) % 2 === 0) ctx.fillRect(px, py, 1, 1);
        }
        continue;
      }
      ctx.fillStyle = PAL[ch] || PAL.W;
      ctx.fillRect(x + c * s, y + r * s, s, s);
    }
  }
}
function spriteSize(rows) { return { w: Math.max(...rows.map(r => r.length)), h: rows.length }; }

function textWidth(str, s = 1) { return str.length * 4 * s - s; }
function drawText(ctx, str, x, y, s = 1, color = 'W') {
  str = String(str).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  ctx.fillStyle = PAL[color];
  for (let i = 0; i < str.length; i++) {
    const g = FONT[str[i]] || FONT[' '];
    for (let p = 0; p < 15; p++) {
      if (g[p] === '#') ctx.fillRect(Math.round(x + (i * 4 + p % 3) * s), Math.round(y + Math.floor(p / 3) * s), s, s);
    }
  }
}

// ---- ENGINE (shared) ----
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rng(s, tag) { return mulberry32(hash(s.code + '|' + tag)); }

function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }

function pickWeighted(r, arr, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let x = r() * total;
  for (let i = 0; i < arr.length; i++) { x -= weights[i]; if (x < 0) return arr[i]; }
  return arr[arr.length - 1];
}

function newCode() {
  let c = '';
  for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function year(t) { return Math.ceil(t / 4); }

function quarterLabel(t) { return 'Q' + ((t - 1) % 4 + 1) + ' YEAR ' + year(t); }

function shortQuarter(t) { return 'Q' + ((t - 1) % 4 + 1) + ' Y' + year(t); }

function landmarkFor(t) { return CONTENT.landmarks.concat(CONTENT.landmarks2).find(l => l.turn === t); }

function findCard(id) { return [...CONTENT.cards, ...CONTENT.callbacks, ...CONTENT.landmarks, ...CONTENT.landmarks2, ...CONTENT.openings, ...CONTENT.specials].find(c => c.id === id); }

function nextLandmarkAfter(t) { return CONTENT.landmarks.find(l => l.turn > t); }

function publicMood(v) { return v < 20 ? 'FURIOUS' : v < 40 ? 'RESTLESS' : v < 60 ? 'UNEASY' : v < 80 ? 'CONTENT' : 'ADORING'; }

function relBand(v) { return v <= -3 ? 'hostile' : v < 0 ? 'cool' : v === 0 ? 'neutral' : v < 3 ? 'warm' : 'close'; }

function shortLabel(label) { const s = String(label).replace(/^"|"$/g, ''); const i = s.indexOf('. '); return i > 0 ? s.slice(0, i + 1) : s; }

function gambleChance(s, o) {
  let c = o.gamble.chance;
  const b = o.gamble.bonus;
  if (b && (s.assets[b.asset] || 0) >= b.min) c = b.chance;
  return c;
}

function mergeEffects(a, b) {
  const out = Object.assign({}, a);
  for (const k in b) {
    if (k === 'rel' || k === 'assets') {
      out[k] = Object.assign({}, a[k] || {});
      for (const j in b[k]) out[k][j] = (out[k][j] || 0) + b[k][j];
    } else out[k] = (out[k] || 0) + b[k];
  }
  return out;
}

function applyEffects(s, e, kind) {
  const out = {};
  let neg = CONFIG.difficulty[s.difficulty].neg;
  if (kind === 'card' || kind === 'event') neg *= CONFIG.moodNeg[s.mood];
  const scale = kind === 'card' ? CONFIG.cardScale : 1;
  for (const m of METERS) {
    let d = e[m] || 0;
    if (!d) continue;
    d *= scale;
    if (d < 0) d *= neg;
    if (d > 0 && m === 'legit' && s.coalition) d -= 1;
    d = Math.round(d);
    const before = s.meters[m];
    s.meters[m] = clamp(before + d, 0, 100);
    if (s.meters[m] !== before) out[m] = s.meters[m] - before;
  }
  if (e.treasury) { s.treasury += e.treasury; out.treasury = e.treasury; }
  if (e.rel) for (const k in e.rel) {
    const b = s.rel[k];
    s.rel[k] = clamp(b + e.rel[k], -5, 5);
    if (s.rel[k] !== b) (out.rel = out.rel || {})[k] = s.rel[k] - b;
  }
  if (e.assets) for (const k in e.assets) {
    const b = s.assets[k];
    s.assets[k] = Math.max(0, b + e.assets[k]);
    if (s.assets[k] !== b) (out.assets = out.assets || {})[k] = s.assets[k] - b;
  }
  if (e.mood) {
    const i = clamp(MOODS.indexOf(s.mood) + e.mood, 0, 2);
    if (MOODS[i] !== s.mood) { s.mood = MOODS[i]; out.mood = s.mood; }
  }
  return out;
}

function resolveOption(s, src, o, ctx = {}) {
  const kind = src.turn ? 'landmark' : 'card';
  for (const k in (o.cost || {})) s.assets[k] -= o.cost[k];
  let effects = typeof o.effects === 'function' ? o.effects(s) : (o.effects || {});
  let flags = (o.setFlags || []).slice();
  let text = '', won = null;
  if (o.gamble) {
    won = rng(s, 'gamble' + s.turn + src.id)() < gambleChance(s, o);
    const res = won ? o.gamble.win : o.gamble.lose;
    effects = mergeEffects(effects, res.effects || {});
    flags = flags.concat(res.setFlags || []);
    text = res.text;
  }
  if (o.vote) {
    won = !!ctx.passed;
    const res = won ? o.vote.pass : o.vote.fail;
    effects = mergeEffects(effects, res.effects || {});
    text = res.text;
  }
  if (o.special) {
    const res = SPECIALS[o.special](s, o);
    effects = mergeEffects(effects, res.effects || {});
    text = res.text;
  }
  const deltas = applyEffects(s, effects, kind);
  for (const f of flags) if (s.flags[f] == null) s.flags[f] = s.turn;
  const th = o.theory || [0, 0, 0];
  s.theory.realism += th[0];
  s.theory.liberalism += th[1];
  s.theory.constructivism += th[2];
  for (const c of [src.concept, src.related]) if (c) s.concepts[c] = (s.concepts[c] || 0) + 1;
  const db = o.debrief || {};
  const entry = {
    turn: s.turn, cardId: src.id, title: src.title, optionLabel: o.label,
    concept: src.concept, relatedConcept: src.related, case: src.case,
    parallel: db.parallel || src.parallel, deltas, theory: th, won,
    actorName: src.actor ? src.actor.name : src.name, actorType: src.actor ? src.actor.type : 'domestic'
  };
  s.log.push(entry);
  return { deltas, text, won, entry };
}

function eligibleCallbacks(s) {
  return CONTENT.callbacks.filter(c => !s.seen.includes(c.id) &&
    c.requires.some(f => s.flags[f] != null && s.turn - s.flags[f] >= 2));
}

function pickCard(s) {
  const r = rng(s, 'card' + s.turn);
  if (s.turn - s.lastCallback >= CONFIG.callbackGap) {
    const cbs = eligibleCallbacks(s);
    if (cbs.length) return pick(r, cbs);
  }
  const pool = CONTENT.cards.filter(c => !s.seen.includes(c.id));
  if (!pool.length) return null;
  const w = pool.map(c => (1 / (1 + s.areaSeen[c.area])) * (s.posture.domestic === 'austerity' && c.protest ? 2 : 1));
  return pickWeighted(r, pool, w);
}

function markSeen(s, card) {
  if (s.seen.includes(card.id)) return;
  s.seen.push(card.id);
  if (card.requires) s.lastCallback = s.turn;
  else s.areaSeen[card.area]++;
}

function eventEffects(s, ev) { return typeof ev.effects === 'function' ? ev.effects(s) : ev.effects; }

function rollEvent(s) {
  const r = rng(s, 'event' + s.turn);
  const chance = s.mood === 'volatile' ? CONFIG.eventChanceVolatile : CONFIG.eventChance;
  if (r() >= chance) return null;
  const pool = CONTENT.events.filter(ev => {
    if (s.seenEvents.includes(ev.id)) return false;
    if (ev.when && !ev.when(s)) return false;
    const e = eventEffects(s, ev);
    if (e.assets) for (const k in e.assets) if (e.assets[k] < 0 && s.assets[k] < -e.assets[k]) return false;
    return true;
  });
  return pool.length ? pick(r, pool) : null;
}

function applyEvent(s, ev) {
  s.seenEvents.push(ev.id);
  return applyEffects(s, eventEffects(s, ev), 'event');
}

function endTurn(s) {
  const f = CONTENT.policies.foreign[s.posture.foreign], d = CONTENT.policies.domestic[s.posture.domestic];
  const e = { treasury: CONFIG.baseIncome + (f.treasury || 0) + (d.treasury || 0) };
  for (const m of METERS) e[m] = (f[m] || 0) + (d[m] || 0);
  if (s.posture.domestic === 'generous' && s.treasury < 100) e.legit -= d.legit;
  if (s.posture.foreign === 'isolationist' && s.turn % 2 === 0) {
    e.rel = {};
    for (const id of STATE_IDS) if (s.rel[id]) e.rel[id] = s.rel[id] > 0 ? -1 : 1;
  }
  const deltas = applyEffects(s, e, 'policy');
  const moodBefore = s.mood;
  const roll = rng(s, 'mood' + s.turn)();
  const worse = CONFIG.moodWorse + (s.posture.foreign === 'interventionist' ? CONFIG.interventionMood : 0);
  let i = MOODS.indexOf(s.mood);
  if (roll < worse) i = Math.min(2, i + 1);
  else if (roll < worse + CONFIG.moodBetter) i = Math.max(0, i - 1);
  s.mood = MOODS[i];
  s.debtTurns = s.treasury < 0 ? s.debtTurns + 1 : 0;
  return { deltas, moodBefore, mood: s.mood, collapse: checkCollapse(s) };
}

function checkCollapse(s) {
  for (const m of METERS) {
    if (s.meters[m] <= 0) return m + '_low';
    if (s.meters[m] >= 100) return m + '_high';
  }
  if (s.debtTurns >= 4 || s.treasury <= -600) return 'default';
  return null;
}

function doRetreat(s) {
  for (const m of METERS) {
    const v = s.meters[m];
    s.meters[m] = v > 50 ? Math.max(50, v - CONFIG.retreatStep) : Math.min(50, v + CONFIG.retreatStep);
  }
  s.treasury -= CONFIG.retreatCost;
  s.retreatYear = year(s.turn);
  s.ts.retreat = true;
}

function balanceOf(s) { return METERS.reduce((a, k) => a + Math.abs(s.meters[k] - 50), 0) / 4; }

function computeScore(s) {
  const survived = s.ending && s.ending.type === 'survival';
  const meterPart = METERS.reduce((a, k) => a + (50 - Math.abs(s.meters[k] - 50)), 0);
  const assets = ASSETS.reduce((a, k) => a + s.assets[k], 0);
  const bg = CONTENT.backgrounds.find(b => b.id === s.leader.background).score;
  const dm = CONFIG.difficulty[s.difficulty].score;
  const raw = meterPart + 10 * s.turnsSurvived + s.treasury / 10 + 5 * assets + (survived ? 200 : 0);
  return { score: Math.round(raw * bg * dm), meterPart, turns: s.turnsSurvived, treasury: s.treasury, assets, survived, bg, dm };
}

function deltaSize(d) { return METERS.reduce((a, k) => a + Math.abs(d[k] || 0), 0); }

function lensData() {
  const t = S.theory;
  const sum = t.realism + t.liberalism + t.constructivism || 1;
  const keys = ['realism', 'liberalism', 'constructivism'];
  const pct = {};
  keys.forEach(k => { pct[k] = Math.round(t[k] / sum * 100); });
  const dom = keys.reduce((a, k) => t[k] > t[a] ? k : a, 'realism');
  const di = keys.indexOf(dom);
  const matches = S.log.filter(e => e.theory[di] > 0).sort((a, b) => (b.theory[di] - a.theory[di]) || ((b.theory[di] - Math.max(...b.theory.filter((_, i) => i !== di))) - (a.theory[di] - Math.max(...a.theory.filter((_, i) => i !== di))))).slice(0, 2);
  let against = null, againstLens = null, best = 0;
  for (const e of S.log) {
    keys.forEach((k, i) => {
      if (i === di) return;
      const gap = e.theory[i] - e.theory[di];
      if (gap > best) { best = gap; against = e; againstLens = k; }
    });
  }
  return { pct, dom, matches, against, againstLens };
}

function reflectionQuestions() {
  const top = S.log.filter(e => S.log.length < 6 || e.cardId[0] !== 'L').slice().sort((a, b) => deltaSize(b.deltas) - deltaSize(a.deltas)).slice(0, 5);
  const qs = [];
  const T = CONTENT.actorTypes;
  top.forEach((e, i) => {
    const ups = METERS.filter(k => (e.deltas[k] || 0) > 0).sort((a, b) => e.deltas[b] - e.deltas[a]);
    const downs = METERS.filter(k => (e.deltas[k] || 0) < 0).sort((a, b) => e.deltas[a] - e.deltas[b]);
    const choice = shortLabel(fillText(e.optionLabel));
    if (i === 0 && ups.length && downs.length) qs.push(`Evaluate your decision in "${e.title}". To what extent did it strengthen your state's ${METER_NAME[ups[0]].toLowerCase()} at the cost of its ${METER_NAME[downs[0]].toLowerCase()}?`);
    else if (i === 0 || i === 1) qs.push(`Discuss how your choice in "${e.title}" ("${choice}") affected the ${e.concept.toLowerCase()} of your state.`);
    else if (i === 2) qs.push(`Examine the role of ${e.actorName} in "${e.title}". How did ${T[e.actorType] || 'this actor'} shape the options you had?`);
    else if (i === 3) qs.push(`Justify your decision in "${e.title}" using one of the three theories you met: realism, liberalism or constructivism.`);
    else qs.push(`Compare and contrast your decision in "${e.title}" with the real-world case of ${e.case}.`);
  });
  const generic = [
    'To what extent is it possible for a state to maximise both its sovereignty and its interdependence?',
    'Discuss the claim that legitimacy matters more to a government\'s survival than power.',
    'Examine how non-state actors influenced the decisions you faced during your term.',
    'Evaluate which of the three theories best explains the outcome of your term.',
    'To what extent did your earlier decisions limit your later options?'
  ];
  let g = 0;
  while (qs.length < 5) qs.push(generic[g++]);
  return qs;
}

function lobbySkipChance(s) {
  const c = CONFIG.lobby;
  const friends = STATE_IDS.filter(id => s.rel[id] >= 3).length;
  return Math.min(0.95, c.skipBase + c.skipEnvoy * s.assets.influence + c.skipFriend * friends);
}

function simGame(code, mode, acc) {
  const r = mulberry32(hash(code + 'play'));
  const s = newState({ code, difficulty: 'minister', background: pick(r, CONTENT.backgrounds).id, leader: 'Sim', country: 'Simland', capital: 'Simcity' });
  applyStart(s, rollStart(s, 0));
  const play = src => {
    const o = simChoose(s, src, r, mode);
    if (!o) return;
    const ctx = o.vote ? { passed: r() < lobbySkipChance(s) } : {};
    const res = resolveOption(s, src, o, ctx);
    if (acc && !src.turn) {
      const a = acc[src.id] = acc[src.id] || { n: 0, power: 0, sov: 0, legit: 0, inter: 0 };
      a.n++;
      for (const k of METERS) a[k] += res.deltas[k] || 0;
    }
  };
  for (let t = 1; t <= CONFIG.turns; t++) {
    s.turn = t;
    s.ts = {};
    const lm = landmarkFor(t);
    if (lm && t !== CONFIG.turns) play(lm);
    s.treasury -= 25;
    const ev = rollEvent(s);
    if (ev) applyEvent(s, ev);
    const mr = rng(s, 'move' + t);
    if (t > 1 && mr() < 0.5) { const pool = CONTENT.moves.filter(m => !s.seenMoves.includes(m.id)); if (pool.length) { const m = pick(mr, pool); s.seenMoves.push(m.id); applyEffects(s, m.e, 'event'); } }
    if (!s.ts.retreat) { const c = pickCard(s); if (c) { markSeen(s, c); play(c); } }
    if (t > 4 && t % 2) { const c = pickCard(s); if (c) { markSeen(s, c); play(c); } }
    const rep = endTurn(s);
    if (rep.collapse) return { survived: false, cause: rep.collapse, turn: t };
  }
  play(landmarkFor(CONFIG.turns));
  if (s.flags.term_amended != null && s.meters.legit <= 0) return { survived: false, cause: 'legit_low', turn: 16 };
  return { survived: true, balance: balanceOf(s) };
}

function simulate(n = 1000, mode = 'random', quiet) {
  const causes = {}, acc = {};
  let survived = 0, turns = 0;
  for (let i = 0; i < n; i++) {
    const res = simGame('SIM' + mode + i, mode, acc);
    if (res.survived) survived++;
    else { causes[res.cause] = (causes[res.cause] || 0) + 1; turns += res.turn; }
  }
  const rate = Math.round(survived / n * 1000) / 10;
  const common = Object.entries(causes).sort((a, b) => b[1] - a[1]);
  if (!quiet) {
    console.log(`${mode}: ${n} games, survival ${rate}%`);
    console.table(common.map(([c, k]) => ({ cause: c, games: k })));
    const per = {};
    for (const id in acc) { const a = acc[id]; per[id] = { n: a.n }; for (const k of METERS) per[id][k] = Math.round(a[k] / a.n * 10) / 10; }
    console.table(per);
  }
  return { mode, n, rate, causes: common, avgCollapseTurn: n - survived ? Math.round(turns / (n - survived) * 10) / 10 : null };
}

function routePoint(p) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < ROUTE.length - 1; i++) {
    const [x1, y1] = ROUTE[i], [x2, y2] = ROUTE[i + 1];
    const len = Math.hypot(x2 - x1, y2 - y1);
    segs.push([x1, y1, x2, y2, len]);
    total += len;
  }
  let d = Math.max(0, Math.min(1, p)) * total;
  for (const [x1, y1, x2, y2, len] of segs) {
    if (d <= len) return [x1 + (x2 - x1) * d / len, y1 + (y2 - y1) * d / len];
    d -= len;
  }
  return ROUTE[ROUTE.length - 1];
}

function validateContent() {
  const problems = [];
  const add = (where, issue) => problems.push({ where, issue });
  const ids = new Set();
  const all = [...CONTENT.cards, ...CONTENT.callbacks];
  for (const x of [...all, ...CONTENT.landmarks, ...CONTENT.events]) {
    if (ids.has(x.id)) add(x.id, 'duplicate id');
    ids.add(x.id);
  }
  const flagsSet = new Set();
  const allOptions = [...all, ...CONTENT.landmarks].flatMap(c => c.options.map(o => [c, o]));
  for (const [, o] of allOptions) {
    (o.setFlags || []).forEach(f => flagsSet.add(f));
    if (o.gamble) ['win', 'lose'].forEach(w => (o.gamble[w].setFlags || []).forEach(f => flagsSet.add(f)));
  }
  for (const id in CONTENT.trades) CONTENT.trades[id].forEach(d => (d.setFlags || []).forEach(f => flagsSet.add(f)));
  const stateOk = id => STATE_IDS.includes(id);
  const relKeys = e => e && typeof e === 'object' ? Object.keys(e.rel || {}) : [];
  for (const c of all) {
    if (c.requires) c.requires.forEach(f => { if (!flagsSet.has(f)) add(c.id, `requires flag "${f}" that is never set`); });
    if (c.actor && c.actor.state && !stateOk(c.actor.state)) add(c.id, `unknown state "${c.actor.state}"`);
    if (!c.advice || ['realist', 'liberal', 'constructivist', 'finance'].some(k => !c.advice[k])) add(c.id, 'missing advisor lines');
    const words = fillText(c.text).split(/\s+/).length;
    if (words < 50 || words > 130) add(c.id, `card text is ${words} words`);
    if (!c.options.some(o => !o.cost && !o.needs && !(o.tags || []).includes('cooperative'))) add(c.id, 'no free option that is always available');
    c.options.forEach((o, i) => {
      const w = `${c.id} option ${i + 1}`;
      if (!o.effects && !o.gamble) add(w, 'missing effects');
      if (!Array.isArray(o.theory) || o.theory.length !== 3) add(w, 'missing theory weights');
      const d = o.debrief || {};
      if (!d.explain || !d.parallel || !d.think) add(w, 'incomplete debrief');
      if (d.think && !/^(To what extent|Evaluate|Discuss|Examine|Justify|Compare and contrast)/.test(d.think)) add(w, 'think question lacks an IB command term');
      const e = o.effects || {};
      const negative = Object.keys(e).some(k => (METERS.includes(k) || k === 'treasury') && e[k] < 0) || Object.values(e.rel || {}).some(v => v < 0) || o.cost || o.gamble;
      if (!negative) add(w, 'option has no downside');
      [...relKeys(o.effects), ...(o.gamble ? [...relKeys(o.gamble.win.effects), ...relKeys(o.gamble.lose.effects)] : [])].forEach(k => { if (!stateOk(k)) add(w, `unknown state "${k}"`); });
    });
  }
  for (const lm of CONTENT.landmarks.concat(CONTENT.landmarks2, CONTENT.openings)) {
    lm.options.forEach((o, i) => {
      if (!Array.isArray(o.theory) || o.theory.length !== 3) add(`${lm.id} option ${i + 1}`, 'missing theory weights');
      if (!o.debrief || !o.debrief.explain) add(`${lm.id} option ${i + 1}`, 'missing explanation');
    });
  }
  for (const id in CONTENT.trades) if (!stateOk(id)) add('trades', `unknown state "${id}"`);
  if (CONTENT.cards.length < 48) add('cards', `only ${CONTENT.cards.length} main cards`);
  if (CONTENT.callbacks.length < 10) add('callbacks', `only ${CONTENT.callbacks.length} callback cards`);
  if (CONTENT.events.length < 24) add('events', `only ${CONTENT.events.length} events`);
  if (CONTENT.glossary.length < 30) add('glossary', `only ${CONTENT.glossary.length} terms`);
  if (problems.length) console.table(problems); else console.log('CONTENT OK');
  return problems;
}

function historyVerdict() {
