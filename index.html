// ---- ENGINE (shared) ----
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rng(s, tag) { return mulberry32(hash(s.code + '|' + tag)); }

function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }

function pickWeighted(r, arr, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let x = r() * total;
  for (let i = 0; i < arr.length; i++) { x -= weights[i]; if (x < 0) return arr[i]; }
  return arr[arr.length - 1];
}

function newCode() {
  let c = '';
  for (let i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return c;
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function year(t) { return Math.ceil(t / 4); }

function quarterLabel(t) { return 'Q' + ((t - 1) % 4 + 1) + ' YEAR ' + year(t); }

function shortQuarter(t) { return 'Q' + ((t - 1) % 4 + 1) + ' Y' + year(t); }

function landmarkFor(t) { return CONTENT.landmarks.find(l => l.turn === t); }

function nextLandmarkAfter(t) { return CONTENT.landmarks.find(l => l.turn > t); }

function publicMood(v) { return v < 20 ? 'FURIOUS' : v < 40 ? 'RESTLESS' : v < 60 ? 'UNEASY' : v < 80 ? 'CONTENT' : 'ADORING'; }

function relBand(v) { return v <= -3 ? 'hostile' : v < 0 ? 'cool' : v === 0 ? 'neutral' : v < 3 ? 'warm' : 'close'; }

function shortLabel(label) { const s = String(label).replace(/^"|"$/g, ''); const i = s.indexOf('. '); return i > 0 ? s.slice(0, i + 1) : s; }

function gambleChance(s, o) {
  let c = o.gamble.chance;
  const b = o.gamble.bonus;
  if (b && (s.assets[b.asset] || 0) >= b.min) c = b.chance;
  return c;
}

function mergeEffects(a, b) {
  const out = Object.assign({}, a);
  for (const k in b) {
    if (k === 'rel' || k === 'assets') {
      out[k] = Object.assign({}, a[k] || {});
      for (const j in b[k]) out[k][j] = (out[k][j] || 0) + b[k][j];
    } else out[k] = (out[k] || 0) + b[k];
  }
  return out;
}

function applyEffects(s, e, kind) {
  const out = {};
  let neg = CONFIG.difficulty[s.difficulty].neg;
  if (kind === 'card' || kind === 'event') neg *= CONFIG.moodNeg[s.mood];
  const scale = kind === 'card' ? CONFIG.cardScale : 1;
  for (const m of METERS) {
    let d = e[m] || 0;
    if (!d) continue;
    d *= scale;
    if (d < 0) d *= neg;
    if (d > 0 && m === 'legit' && s.coalition) d -= 1;
    d = Math.round(d);
    const before = s.meters[m];
    s.meters[m] = clamp(before + d, 0, 100);
    if (s.meters[m] !== before) out[m] = s.meters[m] - before;
  }
  if (e.treasury) { s.treasury += e.treasury; out.treasury = e.treasury; }
  if (e.rel) for (const k in e.rel) {
    const b = s.rel[k];
    s.rel[k] = clamp(b + e.rel[k], -5, 5);
    if (s.rel[k] !== b) (out.rel = out.rel || {})[k] = s.rel[k] - b;
  }
  if (e.assets) for (const k in e.assets) {
    const b = s.assets[k];
    s.assets[k] = Math.max(0, b + e.assets[k]);
    if (s.assets[k] !== b) (out.assets = out.assets || {})[k] = s.assets[k] - b;
  }
  if (e.mood) {
    const i = clamp(MOODS.indexOf(s.mood) + e.mood, 0, 2);
    if (MOODS[i] !== s.mood) { s.mood = MOODS[i]; out.mood = s.mood; }
  }
  return out;
}

function resolveOption(s, src, o, ctx = {}) {
  const kind = src.turn ? 'landmark' : 'card';
  for (const k in (o.cost || {})) s.assets[k] -= o.cost[k];
  let effects = typeof o.effects === 'function' ? o.effects(s) : (o.effects || {});
  let flags = (o.setFlags || []).slice();
  let text = '', won = null;
  if (o.gamble) {
    won = rng(s, 'gamble' + s.turn + src.id)() < gambleChance(s, o);
    const res = won ? o.gamble.win : o.gamble.lose;
    effects = mergeEffects(effects, res.effects || {});
    flags = flags.concat(res.setFlags || []);
    text = res.text;
  }
  if (o.vote) {
    won = !!ctx.passed;
    const res = won ? o.vote.pass : o.vote.fail;
    effects = mergeEffects(effects, res.effects || {});
    text = res.text;
  }
  if (o.special) {
    const res = SPECIALS[o.special](s, o);
    effects = mergeEffects(effects, res.effects || {});
    text = res.text;
  }
  const deltas = applyEffects(s, effects, kind);
  for (const f of flags) if (s.flags[f] == null) s.flags[f] = s.turn;
  const th = o.theory || [0, 0, 0];
  s.theory.realism += th[0];
  s.theory.liberalism += th[1];
  s.theory.constructivism += th[2];
  for (const c of [src.concept, src.related]) if (c) s.concepts[c] = (s.concepts[c] || 0) + 1;
  const db = o.debrief || {};
  const entry = {
    turn: s.turn, cardId: src.id, title: src.title, optionLabel: o.label,
    concept: src.concept, relatedConcept: src.related, case: src.case,
    parallel: db.parallel || src.parallel, deltas, theory: th, won,
    actorName: src.actor ? src.actor.name : src.name, actorType: src.actor ? src.actor.type : 'domestic'
  };
  s.log.push(entry);
  return { deltas, text, won, entry };
}

function eligibleCallbacks(s) {
  return CONTENT.callbacks.filter(c => !s.seen.includes(c.id) &&
    c.requires.some(f => s.flags[f] != null && s.turn - s.flags[f] >= 2));
}

function pickCard(s) {
  const r = rng(s, 'card' + s.turn);
  if (s.turn - s.lastCallback >= CONFIG.callbackGap) {
    const cbs = eligibleCallbacks(s);
    if (cbs.length) return pick(r, cbs);
  }
  const pool = CONTENT.cards.filter(c => !s.seen.includes(c.id));
  if (!pool.length) return null;
  const w = pool.map(c => (1 / (1 + s.areaSeen[c.area])) * (s.posture.domestic === 'austerity' && c.protest ? 2 : 1));
  return pickWeighted(r, pool, w);
}

function markSeen(s, card) {
  if (s.seen.includes(card.id)) return;
  s.seen.push(card.id);
  if (card.requires) s.lastCallback = s.turn;
  else s.areaSeen[card.area]++;
}

function eventEffects(s, ev) { return typeof ev.effects === 'function' ? ev.effects(s) : ev.effects; }

function rollEvent(s) {
  const r = rng(s, 'event' + s.turn);
  const chance = s.mood === 'volatile' ? CONFIG.eventChanceVolatile : CONFIG.eventChance;
  if (r() >= chance) return null;
  const pool = CONTENT.events.filter(ev => {
    if (s.seenEvents.includes(ev.id)) return false;
    if (ev.when && !ev.when(s)) return false;
    const e = eventEffects(s, ev);
    if (e.assets) for (const k in e.assets) if (e.assets[k] < 0 && s.assets[k] < -e.assets[k]) return false;
    return true;
  });
  return pool.length ? pick(r, pool) : null;
}

function applyEvent(s, ev) {
  s.seenEvents.push(ev.id);
  return applyEffects(s, eventEffects(s, ev), 'event');
}

function endTurn(s) {
  const f = CONTENT.policies.foreign[s.posture.foreign], d = CONTENT.policies.domestic[s.posture.domestic];
  const e = { treasury: CONFIG.baseIncome + (f.treasury || 0) + (d.treasury || 0) };
  for (const m of METERS) e[m] = (f[m] || 0) + (d[m] || 0);
  if (s.posture.domestic === 'generous' && s.treasury < 100) e.legit -= d.legit;
  if (s.posture.foreign === 'isolationist' && s.turn % 2 === 0) {
    e.rel = {};
    for (const id of STATE_IDS) if (s.rel[id]) e.rel[id] = s.rel[id] > 0 ? -1 : 1;
  }
  const deltas = applyEffects(s, e, 'policy');
  const moodBefore = s.mood;
  const roll = rng(s, 'mood' + s.turn)();
  const worse = CONFIG.moodWorse + (s.posture.foreign === 'interventionist' ? CONFIG.interventionMood : 0);
  let i = MOODS.indexOf(s.mood);
  if (roll < worse) i = Math.min(2, i + 1);
  else if (roll < worse + CONFIG.moodBetter) i = Math.max(0, i - 1);
  s.mood = MOODS[i];
  s.debtTurns = s.treasury < 0 ? s.debtTurns + 1 : 0;
  return { deltas, moodBefore, mood: s.mood, collapse: checkCollapse(s) };
}

function checkCollapse(s) {
  for (const m of METERS) {
    if (s.meters[m] <= 0) return m + '_low';
    if (s.meters[m] >= 100) return m + '_high';
  }
  if (s.debtTurns >= 2) return 'default';
  return null;
}

function doRetreat(s) {
  for (const m of METERS) {
    const v = s.meters[m];
    s.meters[m] = v > 50 ? Math.max(50, v - CONFIG.retreatStep) : Math.min(50, v + CONFIG.retreatStep);
  }
  s.treasury -= CONFIG.retreatCost;
  s.retreatYear = year(s.turn);
  s.ts.retreat = true;
}

function balanceOf(s) { return METERS.reduce((a, k) => a + Math.abs(s.meters[k] - 50), 0) / 4; }

function computeScore(s) {
  const survived = s.ending && s.ending.type === 'survival';
  const meterPart = METERS.reduce((a, k) => a + (50 - Math.abs(s.meters[k] - 50)), 0);
  const assets = ASSETS.reduce((a, k) => a + s.assets[k], 0);
  const bg = CONTENT.backgrounds.find(b => b.id === s.leader.background).score;
  const dm = CONFIG.difficulty[s.difficulty].score;
  const raw = meterPart + 10 * s.turnsSurvived + s.treasury / 10 + 5 * assets + (survived ? 200 : 0);
  return { score: Math.round(raw * bg * dm), meterPart, turns: s.turnsSurvived, treasury: s.treasury, assets, survived, bg, dm };
}

function deltaSize(d) { return METERS.reduce((a, k) => a + Math.abs(d[k] || 0), 0); }

function lensData() {
  const t = S.theory;
  const sum = t.realism + t.liberalism + t.constructivism || 1;
  const keys = ['realism', 'liberalism', 'constructivism'];
  const pct = {};
  keys.forEach(k => { pct[k] = Math.round(t[k] / sum * 100); });
  const dom = keys.reduce((a, k) => t[k] > t[a] ? k : a, 'realism');
  const di = keys.indexOf(dom);
  const matches = S.log.filter(e => e.theory[di] > 0).sort((a, b) => (b.theory[di] - a.theory[di]) || ((b.theory[di] - Math.max(...b.theory.filter((_, i) => i !== di))) - (a.theory[di] - Math.max(...a.theory.filter((_, i) => i !== di))))).slice(0, 2);
  let against = null, againstLens = null, best = 0;
  for (const e of S.log) {
    keys.forEach((k, i) => {
      if (i === di) return;
      const gap = e.theory[i] - e.theory[di];
      if (gap > best) { best = gap; against = e; againstLens = k; }
    });
  }
  return { pct, dom, matches, against, againstLens };
}

function reflectionQuestions() {
  const top = S.log.filter(e => S.log.length < 6 || e.cardId[0] !== 'L').slice().sort((a, b) => deltaSize(b.deltas) - deltaSize(a.deltas)).slice(0, 5);
  const qs = [];
  const T = CONTENT.actorTypes;
  top.forEach((e, i) => {
    const ups = METERS.filter(k => (e.deltas[k] || 0) > 0).sort((a, b) => e.deltas[b] - e.deltas[a]);
    const downs = METERS.filter(k => (e.deltas[k] || 0) < 0).sort((a, b) => e.deltas[a] - e.deltas[b]);
    const choice = shortLabel(fillText(e.optionLabel));
    if (i === 0 && ups.length && downs.length) qs.push(`Evaluate your decision in "${e.title}". To what extent did it strengthen your state's ${METER_NAME[ups[0]].toLowerCase()} at the cost of its ${METER_NAME[downs[0]].toLowerCase()}?`);
    else if (i === 0 || i === 1) qs.push(`Discuss how your choice in "${e.title}" ("${choice}") affected the ${e.concept.toLowerCase()} of your state.`);
    else if (i === 2) qs.push(`Examine the role of ${e.actorName} in "${e.title}". How did ${T[e.actorType] || 'this actor'} shape the options you had?`);
    else if (i === 3) qs.push(`Justify your decision in "${e.title}" using one of the three theories you met: realism, liberalism or constructivism.`);
    else qs.push(`Compare and contrast your decision in "${e.title}" with the real-world case of ${e.case}.`);
  });
  const generic = [
    'To what extent is it possible for a state to maximise both its sovereignty and its interdependence?',
    'Discuss the claim that legitimacy matters more to a government\'s survival than power.',
    'Examine how non-state actors influenced the decisions you faced during your term.',
    'Evaluate which of the three theories best explains the outcome of your term.',
    'To what extent did your earlier decisions limit your later options?'
  ];
  let g = 0;
  while (qs.length < 5) qs.push(generic[g++]);
  return qs;
}

function lobbySkipChance(s) {
  const c = CONFIG.lobby;
  const friends = STATE_IDS.filter(id => s.rel[id] >= 3).length;
  return Math.min(0.95, c.skipBase + c.skipEnvoy * s.assets.influence + c.skipFriend * friends);

function simGame(code, mode, acc) {
  const r = mulberry32(hash(code + 'play'));
  const s = newState({ code, difficulty: 'minister', background: pick(r, CONTENT.backgrounds).id, leader: 'Sim', country: 'Simland', capital: 'Simcity' });
  if (mode === 'random') {
    for (let i = 0; i < 30; i++) { const k = pick(r, ASSETS); if (s.credits - CONFIG.prices[k] >= 0 && r() < 0.8) { s.credits -= CONFIG.prices[k]; s.assets[k]++; } }
  } else {
    let i = 0;
    while (s.credits > 350) { const k = ASSETS[i++ % 5]; s.credits -= CONFIG.prices[k]; s.assets[k]++; }
  }
  s.treasury = s.credits;
  delete s.credits;
  const play = src => {
    const o = simChoose(s, src, r, mode);
    if (!o) return;
    const ctx = o.vote ? { passed: r() < lobbySkipChance(s) } : {};
    const res = resolveOption(s, src, o, ctx);
    if (acc && !src.turn) {
      const a = acc[src.id] = acc[src.id] || { n: 0, power: 0, sov: 0, legit: 0, inter: 0 };
      a.n++;
      for (const k of METERS) a[k] += res.deltas[k] || 0;
    }
  };
  for (let t = 1; t <= CONFIG.turns; t++) {
    s.turn = t;
    s.ts = {};
    const lm = landmarkFor(t);
    if (lm && t !== CONFIG.turns) play(lm);
    const ev = rollEvent(s);
    if (ev) applyEvent(s, ev);
    if (!s.ts.retreat) { const c = pickCard(s); if (c) { markSeen(s, c); play(c); } }
    const rep = endTurn(s);
    if (rep.collapse) return { survived: false, cause: rep.collapse, turn: t };
  }
  play(landmarkFor(CONFIG.turns));
  if (s.flags.term_amended != null && s.meters.legit <= 0) return { survived: false, cause: 'legit_low', turn: 16 };
  return { survived: true, balance: balanceOf(s) };
}

function simulate(n = 1000, mode = 'random', quiet) {
  const causes = {}, acc = {};
  let survived = 0, turns = 0;
  for (let i = 0; i < n; i++) {
    const res = simGame('SIM' + mode + i, mode, acc);
    if (res.survived) survived++;
    else { causes[res.cause] = (causes[res.cause] || 0) + 1; turns += res.turn; }
  }
  const rate = Math.round(survived / n * 1000) / 10;
  const common = Object.entries(causes).sort((a, b) => b[1] - a[1]);
  if (!quiet) {
    console.log(`${mode}: ${n} games, survival ${rate}%`);
    console.table(common.map(([c, k]) => ({ cause: c, games: k })));
    const per = {};
    for (const id in acc) { const a = acc[id]; per[id] = { n: a.n }; for (const k of METERS) per[id][k] = Math.round(a[k] / a.n * 10) / 10; }
    console.table(per);
  }
  return { mode, n, rate, causes: common, avgCollapseTurn: n - survived ? Math.round(turns / (n - survived) * 10) / 10 : null };
}

function routePoint(p) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < ROUTE.length - 1; i++) {
    const [x1, y1] = ROUTE[i], [x2, y2] = ROUTE[i + 1];
    const len = Math.hypot(x2 - x1, y2 - y1);
    segs.push([x1, y1, x2, y2, len]);
    total += len;
  }
  let d = Math.max(0, Math.min(1, p)) * total;
  for (const [x1, y1, x2, y2, len] of segs) {
    if (d <= len) return [x1 + (x2 - x1) * d / len, y1 + (y2 - y1) * d / len];
    d -= len;
  }
  return ROUTE[ROUTE.length - 1];
}

function validateContent() {
  const problems = [];
  const add = (where, issue) => problems.push({ where, issue });
  const ids = new Set();
  const all = [...CONTENT.cards, ...CONTENT.callbacks];
  for (const x of [...all, ...CONTENT.landmarks, ...CONTENT.events]) {
    if (ids.has(x.id)) add(x.id, 'duplicate id');
    ids.add(x.id);
  }
  const flagsSet = new Set();
  const allOptions = [...all, ...CONTENT.landmarks].flatMap(c => c.options.map(o => [c, o]));
  for (const [, o] of allOptions) {
    (o.setFlags || []).forEach(f => flagsSet.add(f));
    if (o.gamble) ['win', 'lose'].forEach(w => (o.gamble[w].setFlags || []).forEach(f => flagsSet.add(f)));
  }
  for (const id in CONTENT.trades) CONTENT.trades[id].forEach(d => (d.setFlags || []).forEach(f => flagsSet.add(f)));
  const stateOk = id => STATE_IDS.includes(id);
  const relKeys = e => e && typeof e === 'object' ? Object.keys(e.rel || {}) : [];
  for (const c of all) {
    if (c.requires) c.requires.forEach(f => { if (!flagsSet.has(f)) add(c.id, `requires flag "${f}" that is never set`); });
    if (c.actor && c.actor.state && !stateOk(c.actor.state)) add(c.id, `unknown state "${c.actor.state}"`);
    if (!c.advice || ['realist', 'liberal', 'constructivist', 'finance'].some(k => !c.advice[k])) add(c.id, 'missing advisor lines');
    const words = fillText(c.text).split(/\s+/).length;
    if (words < 50 || words > 130) add(c.id, `card text is ${words} words`);
    if (!c.options.some(o => !o.cost && !o.needs && !(o.tags || []).includes('cooperative'))) add(c.id, 'no free option that is always available');
    c.options.forEach((o, i) => {
      const w = `${c.id} option ${i + 1}`;
      if (!o.effects && !o.gamble) add(w, 'missing effects');
      if (!Array.isArray(o.theory) || o.theory.length !== 3) add(w, 'missing theory weights');
      const d = o.debrief || {};
      if (!d.explain || !d.parallel || !d.think) add(w, 'incomplete debrief');
      if (d.think && !/^(To what extent|Evaluate|Discuss|Examine|Justify|Compare and contrast)/.test(d.think)) add(w, 'think question lacks an IB command term');
      const e = o.effects || {};
      const negative = Object.keys(e).some(k => (METERS.includes(k) || k === 'treasury') && e[k] < 0) || Object.values(e.rel || {}).some(v => v < 0) || o.cost || o.gamble;
      if (!negative) add(w, 'option has no downside');
      [...relKeys(o.effects), ...(o.gamble ? [...relKeys(o.gamble.win.effects), ...relKeys(o.gamble.lose.effects)] : [])].forEach(k => { if (!stateOk(k)) add(w, `unknown state "${k}"`); });
    });
  }
  for (const lm of CONTENT.landmarks) {
    lm.options.forEach((o, i) => {
      if (!Array.isArray(o.theory) || o.theory.length !== 3) add(`${lm.id} option ${i + 1}`, 'missing theory weights');
      if (!o.debrief || !o.debrief.explain) add(`${lm.id} option ${i + 1}`, 'missing explanation');
    });
  }
  for (const id in CONTENT.trades) if (!stateOk(id)) add('trades', `unknown state "${id}"`);
  if (CONTENT.cards.length < 33) add('cards', `only ${CONTENT.cards.length} main cards`);
  if (CONTENT.callbacks.length < 10) add('callbacks', `only ${CONTENT.callbacks.length} callback cards`);
  if (CONTENT.events.length < 24) add('events', `only ${CONTENT.events.length} events`);
  if (CONTENT.glossary.length < 30) add('glossary', `only ${CONTENT.glossary.length} terms`);
  if (problems.length) console.table(problems); else console.log('CONTENT OK');
  return problems;
}

function assetLabel(k, n) { return n + ' ' + ASSET_NAME[k]; }
function costText(c) { return Object.keys(c).filter(k => c[k]).map(k => k === 'treasury' ? c[k] + ' Treasury' : assetLabel(k, c[k])).join(', '); }
function fillText(t) {

function optionCheck(s, src, o) {
  for (const k in (o.cost || {})) if ((s.assets[k] || 0) < o.cost[k]) return { ok: false, why: 'needs ' + assetLabel(k, o.cost[k]) };
  for (const k in (o.needs || {})) if ((s.assets[k] || 0) < o.needs[k]) return { ok: false, why: 'needs ' + assetLabel(k, o.needs[k]) };
  const st = src.actor && src.actor.state;
  const tags = o.tags || [];
  if (st && tags.includes('cooperative') && s.rel[st] <= -3) return { ok: false, why: CONTENT.states[st].short + ' will not work with you' };
  if (st && tags.includes('hostile') && s.rel[st] >= 3) return { ok: true, warn: 'Your allies would not forget this.' };
  return { ok: true };
}
function riskText(s, o) {
  const mode = CONFIG.difficulty[s.difficulty].risk;
  if (mode === 'hidden') return '';
  if (o.gamble) {
    const c = gambleChance(s, o);
    if (mode === 'percent') return Math.round(c * 100) + '% success';
    return o.risk || (c >= 0.65 ? 'Low' : c >= 0.45 ? 'Medium' : 'High');
  }
  return o.risk || '';
}
const SPECIALS = {
  election(s, o) {
    const spend = (o.cost && o.cost.influence) || 0;
    const score = s.meters.legit + 8 * spend;
    if (score >= 50) return { effects: { legit: 4 }, text: o.outcomes.win };
    if (score >= 30) return { effects: {}, text: o.outcomes.narrow };
    s.coalition = true;
    return { effects: {}, text: o.outcomes.coalition };
  }
};
function simChoose(s, src, r, mode) {
  const avail = src.options.filter(o => optionCheck(s, src, o).ok);
  if (!avail.length) return null;
  if (mode === 'random') return pick(r, avail);
  const worst = METERS.reduce((a, k) => Math.abs(s.meters[k] - 50) > Math.abs(s.meters[a] - 50) ? k : a, 'power');
  if (s.meters[worst] >= CONFIG.danger.low && s.meters[worst] <= CONFIG.danger.high) return pick(r, avail);
  const dir = s.meters[worst] > 50 ? -1 : 1;
  const pull = o => {
    const e = typeof o.effects === 'function' ? o.effects(s) : (o.effects || {});
    let v = e[worst] || 0;
    if (o.gamble) { const c = gambleChance(s, o); v += c * ((o.gamble.win.effects || {})[worst] || 0) + (1 - c) * ((o.gamble.lose.effects || {})[worst] || 0); }
    if (o.vote) v += 0.5 * (((o.vote.pass.effects || {})[worst] || 0) + ((o.vote.fail.effects || {})[worst] || 0));
    if (s.treasury + (e.treasury || 0) < 0) v -= 100 * dir;
    return v * dir;
  };
  const best = Math.max(...avail.map(pull));
  return pick(r, avail.filter(o => pull(o) === best));
}

  if (a.type === 'state' && a.state) {
    person = PEOPLE[a.state];
    name = LEADERS[a.state];
  } else {
    const r = mulberry32(hash('msg' + src.id));
    const look = ROLE_LOOKS[a.type] || ROLE_LOOKS.domestic;
    person = Object.assign({ skin: Math.floor(r() * 5), hair: pick(r, HAIRS), hairCol: pick(r, HAIR_COLS), glasses: r() < 0.25 }, look);
    if (person.hair === 'bald') person.beard = r() < 0.6;
    name = pick(r, CONTENT.names.first) + ' ' + pick(r, CONTENT.names.last);
  }
  msgCache[src.id] = { person, name, org: a.name, type: a.type };
  return msgCache[src.id];
}
function personFor(key) {
  if (key === 'leader') return S ? S.avatar : ui.draft.avatar;
  if (key.startsWith('adv:')) return PEOPLE[ADVISOR_PEOPLE[key.slice(4)]];
  if (key.startsWith('state:')) return PEOPLE[key.slice(6)];
  if (key.startsWith('msg:')) {
    const id = key.slice(4);
    const src = [...CONTENT.cards, ...CONTENT.callbacks, ...CONTENT.landmarks].find(c => c.id === id);
    return messengerFor(src).person;
  }
  if (key.startsWith('del:')) {
    const r = mulberry32(hash('del' + key));
    return { skin: Math.floor(r() * 5), hair: pick(r, HAIRS), hairCol: pick(r, HAIR_COLS), outfit: 'suit', main: pick(r, OUTFIT_COLS)[0], alt: '#222', trim: '#ddd' };
  }
  return PEOPLE[key] || PEOPLE.lund;
}

// preview on hover
function showPreview(src, idx) {
  ui.hover = idx;
  const o = idx == null ? null : src.options[idx];
  const pre = o ? previewDeltas(src, o) : null;
  const unsure = o && (o.gamble || o.vote || o.special);
  for (const m of METERS) {
    const a = $('a-' + m), g = $('g-' + m);
    if (!a) continue;
    const d = pre ? pre[m] || 0 : 0;
    if (d) {
      const nv = clamp(S.meters[m] + d, 0, 100);
      const good = Math.abs(nv - 50) < Math.abs(S.meters[m] - 50);
      const n = Math.abs(d) <= 5 ? 1 : Math.abs(d) <= 12 ? 2 : 3;
      a.textContent = (d > 0 ? '↑' : '↓').repeat(n);
      a.className = 'arr ' + (good ? 'good' : 'bad');
      a.title = good ? 'Toward the safe middle' : 'Away from the safe middle';
      g.style.display = 'block';
      g.style.left = nv + '%';
    } else if (unsure) {
      a.textContent = '?';
      a.className = 'arr unk';
      a.title = 'Depends on how it turns out';
      g.style.display = 'none';
    } else {
      a.textContent = '';
      g.style.display = 'none';
    }
  }
  const [f, line] = leaderFace(pre);
  setFace('canvas[data-person="leader"]', f);
  const lm = $('leadermood');
  if (lm) lm.textContent = line;
  reactAdvisors(src, idx);
}
function advisorStance(src) {
  const opts = src.options;
  const pickBy = fn => {
    const vals = opts.map(fn);
    const max = Math.max(...vals), min = Math.min(...vals);
    const once = v => vals.filter(x => x === v).length === 1;
    return { favours: once(max) ? vals.indexOf(max) : -1, opposes: min < max && once(min) ? vals.indexOf(min) : -1 };
  };
  return {
    realist: pickBy(o => o.theory[0] * 10 + ((o.effects && o.effects.power) || 0) / 10),
    liberal: pickBy(o => o.theory[1] * 10 + ((o.effects && o.effects.inter) || 0) / 10),
    constructivist: pickBy(o => o.theory[2] * 10 + ((o.effects && o.effects.legit) || 0) / 10),
    finance: pickBy(o => ((o.effects && o.effects.treasury) || 0) - 40 * Object.values(o.cost || {}).reduce((a, b) => a + b, 0))
  };
}
let lastReact = null;
function reactAdvisors(src, idx) {
  const box = $('advisors');
  if (!box || box.dataset.hidden) return;
  const stance = advisorStance(src);
  for (const a of CONTENT.advisors) {
    const el = box.querySelector(`[data-adv="${a.id}"]`);
    if (!el) continue;
    const r = el.querySelector('.react');
    const st = stance[a.id];
    let f = 'calm', cls = '', txt = '';
    if (idx != null) {
      if (st.favours === idx) { f = 'happy'; cls = 'yes'; txt = 'BACKS THIS'; }
      else if (st.opposes === idx) { f = 'angry'; cls = 'no'; txt = 'AGAINST'; }
      else { cls = 'meh'; txt = 'UNSURE'; }
    }
    el.querySelector('canvas').dataset.face = f;
    drawPerson(el.querySelector('canvas'), personFor('adv:' + a.id), f, false);
    r.className = 'react ' + cls;
    r.textContent = txt;
    if (idx !== lastReact && idx != null && !reducedMotion()) {
      const p = el.querySelector('.portrait');
      p.classList.remove('nod', 'shake');
      void p.offsetWidth;
      if (cls === 'yes') p.classList.add('nod');
      if (cls === 'no') p.classList.add('shake');
    }
  }
  lastReact = idx;
}

function deltaChips(d) {
  const out = [];
  const sign = n => (n > 0 ? '+' : '') + n;
  for (const m of METERS) if (d[m]) {
    const after = S.meters[m], before = after - d[m];
    out.push(`<span class="chip ${Math.abs(after - 50) < Math.abs(before - 50) ? 'good' : 'bad'}">${METER_NAME[m]} ${sign(d[m])}</span>`);
  }
  if (d.treasury) out.push(`<span class="chip ${d.treasury > 0 ? 'good' : 'bad'}">Treasury ${sign(d.treasury)}</span>`);
  if (d.rel) for (const k in d.rel) out.push(`<span class="chip ${d.rel[k] > 0 ? 'good' : 'bad'}">${CONTENT.states[k].short} ${sign(d.rel[k])}</span>`);
  if (d.assets) for (const k in d.assets) out.push(`<span class="chip ${d.assets[k] > 0 ? 'good' : 'bad'}">${ASSET_NAME[k]} ${sign(d.assets[k])}</span>`);
  if (d.mood) out.push(`<span class="chip bad">World ${d.mood}</span>`);
  return out.join('');
}
function choiceHtml(src, o, i, picked) {
  const chk = optionCheck(S, src, o);
  const e = typeof o.effects === 'function' ? o.effects(S) : (o.effects || {});
  const chips = [];
  chips.push(o.cost ? `<span class="chip blue">Uses ${costText(o.cost)}</span>` : o.needs ? `<span class="chip blue">Needs ${costText(o.needs)}</span>` : '<span class="chip">Free</span>');
  if (e.treasury) chips.push(`<span class="chip">Treasury ${e.treasury > 0 ? '+' : ''}${e.treasury}</span>`);
  const risk = riskText(S, o);
  if (risk) chips.push(`<span class="chip bad">Risk: ${esc(risk)}</span>`);
  if (o.vote) chips.push('<span class="chip blue">Needs a vote</span>');
  return `<button class="choice ${picked === i ? 'picked' : ''}" type="button" data-act="pick" data-arg="${i}" data-key="${i + 1}" data-hover="${i}" aria-pressed="${picked === i}" ${chk.ok ? '' : 'aria-disabled="true"'}>
    <span class="num">${i + 1}</span><span class="label">${esc(fillText(o.label))}</span>
    ${chk.ok ? '' : `<span class="why">(${esc(chk.why)})</span>`}${chk.warn ? `<span class="why">${esc(chk.warn)}</span>` : ''}
    <span class="chips">${chips.join('')}</span>${DEBUG ? `<span class="c-violet" style="font-size:.7em">${esc(fxText(o))}</span>` : ''}</button>`;
}
function fxText(o) {
  const e = typeof o.effects === 'function' ? o.effects(S) : (o.effects || {});

    <div class="prompt"><button class="btn go" type="button" data-act="lobbyStart" data-key="1" data-autofocus>1. Start lobbying</button>
    <button class="btn" type="button" data-act="lobbySkip" data-key="s">S. Skip and let the vote happen (${Math.round(chance * 100)}% chance)</button></div></div>`);
}
const SEAT_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];
function lobbyPlay() {
  const { src, o, total } = ui.view;
  const c = CONFIG.lobby;
  const r = rng(S, 'lobby');
  const seats = [];
  for (let i = 0; i < 12; i++) {
    const owner = i < 5 ? STATE_IDS[i] : null;
    let st = 'grey';
    if (owner && S.rel[owner] >= 3) st = 'green';
    if (owner && S.rel[owner] <= -3) st = 'orange';
    seats.push({ st, owner, until: 0 });
  }
  const L = ui.lobby = { seats, elapsed: 0, nextAt: c.gapMin + r() * (c.gapMax - c.gapMin), last: performance.now(), ended: false, timer: null };
  ui.view = { name: 'lobby', src, o, total };
  const faceOf = st => ({ grey: 'calm', white: 'shocked', green: 'happy', orange: 'angry' }[st]);
  desk(`<div class="box">
    <div class="timer"><span id="ltime">TIME ${total}</span><span class="c-green" id="lfor">VOTES 0 / ${c.need}</span></div>
    <div class="seats" id="seats">${seats.map((s, i) => `<button class="seat" type="button" data-act="seat" data-arg="${i}" data-key="${SEAT_KEYS[i]}">${face(s.owner ? 'state:' + s.owner : 'del:' + i, 64, faceOf(s.st))}<span>${SEAT_KEYS[i]} ${s.owner ? CONTENT.states[s.owner].short.toUpperCase() : 'SEAT ' + (i + 1)}</span></button>`).join('')}</div>
    <div class="prompt"><button class="btn" type="button" data-act="lobbyStop" data-key="s">S. Call the vote now</button><span class="c-muted">Delegates that light up are undecided. Win them before they turn away.</span></div></div>`);
  const ayes = () => seats.filter(s => s.st === 'green').length;
  const paint = () => {
    seats.forEach((s, i) => {
      const b = document.querySelector(`.seat[data-arg="${i}"]`);
      if (!b) return;
      const cls = 'seat ' + (s.st === 'grey' ? '' : s.st);
      if (b.className !== cls) {
        b.className = cls;
        const cv = b.querySelector('canvas');
        cv.dataset.face = faceOf(s.st);
        drawPerson(cv, personFor(cv.dataset.person), cv.dataset.face, false);
      }
    });
    $('ltime').textContent = 'TIME ' + Math.max(0, Math.ceil(total - L.elapsed / 1000));
    $('lfor').textContent = `VOTES ${ayes()} / ${c.need}`;
  };
  L.hit = i => {
    if (L.ended) return;
    if (seats[i].st === 'white') { seats[i].st = 'green'; SFX.positive(); paint(); check(); }
  };
  const check = () => {
    const open = seats.some(s => s.st === 'grey' || s.st === 'white');
    if (ayes() >= c.need || L.elapsed >= total * 1000 || !open) end();
  };
  const end = () => {
    if (L.ended) return;
    L.ended = true;
    clearInterval(L.timer);
    const passed = ayes() >= c.need;
    S.minigame = { played: true, passed, ayes: ayes() };
    finish(src, o, { passed });
  };
  L.stop = () => { L.elapsed = total * 1000; check(); };
  L.timer = setInterval(() => {
    const now = performance.now();
    if (ui.modal || ui.drawer) { L.last = now; return; }
    if (ui.view.name !== 'lobby') { clearInterval(L.timer); return; }
    L.elapsed += now - L.last;
    L.last = now;
    for (const s of seats) if (s.st === 'white' && L.elapsed >= s.until) s.st = 'orange';
    if (L.elapsed >= L.nextAt) {
      const greys = seats.filter(s => s.st === 'grey');
      if (greys.length) { const s = greys[Math.floor(r() * greys.length)]; s.st = 'white'; s.until = L.elapsed + c.windowMs; SFX.select(); }
      L.nextAt = L.elapsed + c.gapMin + r() * (c.gapMax - c.gapMin);
    }
    paint();
    check();
  }, 50);
}

      <div class="mlist">${item('1', 'Save and quit', 'mquit', '', '', true)}${item('2', 'Keep playing', 'mview', 'data-arg="main"')}</div>`;
  }
  const first = body.querySelector('.mitem, .seg button[aria-pressed="true"], input');
  if (first) first.focus();
}
function closeModal() {
  ui.modal = null;
  $('modal').classList.remove('open');
  const f = $('view').querySelector('.choice.picked, [data-autofocus], .btn.go');
  if (f) f.focus({ preventScroll: true });
}
function applySettings() {
  document.documentElement.setAttribute('data-theme', settings.theme === 'daylight' ? 'daylight' : 'crt');
  const b = document.body.classList;
  b.toggle('nocrt', !settings.crt);
  b.toggle('readable', settings.font === 'readable');
  b.toggle('large', settings.text === 'large');
  b.toggle('reduced', reducedMotion());
  startBlink();
}

// ---- REPORT ----
function tombLines() {
  const E = CONTENT.endings.collapse[S.ending.cause];
  return ['HERE LIES', 'THE GOVERNMENT OF', S.leader.name, S.country.name, `${shortQuarter(1)} - ${shortQuarter(S.turn)}`, E.cause];
}
function collapseEnding(cause) {
  const E = CONTENT.endings.collapse[cause];
  S.ending = { type: 'collapse', cause, title: E.title };
  S.turnsSurvived = Math.max(0, S.turn - 1);
  store.del(CONFIG.keys.save);
  closeDrawer();
  SFX.collapse();
  ui.view = { name: 'collapse' };
  render(`<div class="full center">
    <canvas class="px" id="tomb" width="96" height="120" style="width:288px;height:360px" aria-hidden="true"></canvas>
    <p class="c-muted">${tombLines().map(esc).join(' &middot; ')}</p>
    <div class="field" style="min-width:420px;text-align:left"><label for="f-epitaph">Your epitaph? (40 characters)</label><input id="f-epitaph" maxlength="40" autocomplete="off" data-autofocus></div>
    <button class="btn go" type="button" data-act="carve">Carve it <kbd>ENTER</kbd></button>
  </div>`, () => {
    const c = $('tomb').getContext('2d');
    let f = 0;
    const draw = () => {
      c.clearRect(0, 0, 96, 120);
      drawSprite(c, TOMB, 0, 10, 2);
      drawSprite(c, CROW[f++ % 7 === 6 ? 1 : 0], 70, 8, 2);
      tombLines().forEach((l, i) => drawTextC(c, l, 48, 36 + i * 9, 1, i === 5 ? 'O' : 'K'));
    };
    draw();
    if (!reducedMotion()) mapTimer = setInterval(draw, 330);
    $('f-epitaph').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); act('carve'); } });
  });
}
function collapseText() {
  const E = CONTENT.endings.collapse[S.ending.cause];
  render(`<div class="full"><div class="box" style="max-width:980px;margin:0 auto">
    <div class="who">${face('leader', 96, 'dead')}<div><div class="kicker">THE END OF ${esc(S.country.name.toUpperCase())}'S GOVERNMENT</div><h1 class="title">${esc(E.title)}</h1></div></div>
    ${S.epitaph ? `<p class="c-blue">"${esc(S.epitaph)}"</p>` : ''}
    <p class="lede">${esc(fillText(E.text))}</p>
    <div class="sec">WHAT HAPPENED, IN CONCEPT TERMS</div><p>${para(E.concept)}</p>
    <div class="sec">REAL-WORLD ECHO</div><p>${para(E.echo)}</p>
    <div class="prompt"><button class="btn go" type="button" data-act="report" data-key="space" data-autofocus>See your report <kbd>SPACE</kbd></button></div></div></div>`);
}
function finalEnding() {
  S.turnsSurvived = CONFIG.turns;
  if (S.flags.term_amended != null && S.meters.legit <= 0) return collapseEnding('legit_low');
  const bal = balanceOf(S);
  let key = bal < 12 ? 'steady' : bal <= 22 ? 'handover' : 'barely';
  if (S.flags.elections_postponed != null || S.flags.term_amended != null) key = 'keeps';
  const E = CONTENT.endings.survival[key];
  S.ending = { type: 'survival', key, title: E.title, balance: Math.round(bal * 10) / 10 };
  store.del(CONFIG.keys.save);
  closeDrawer();
  key === 'steady' ? SFX.victory() : SFX.positive();
  const fin = ['term_amended', 'ran_again', 'stepped_down'].find(f => S.flags[f] != null);
  ui.view = { name: 'survival' };
  render(`<div class="full"><div class="box" style="max-width:980px;margin:0 auto">
    <div class="who">${face('leader', 120, key === 'keeps' ? 'smug' : 'happy')}<div><div class="kicker">THE TERM IS OVER</div><h1 class="title">${esc(E.title)}</h1></div></div>
    ${fin ? `<p class="lede">${esc(CONTENT.endings.final[fin])}</p>` : ''}
    <p class="lede">${esc(E.text)}</p>
    <p class="c-blue">${esc(historyVerdict())}</p>
    <p class="c-muted">Balance (average distance of your meters from 50): ${S.ending.balance}</p>
    <div class="prompt"><button class="btn go" type="button" data-act="report" data-key="space" data-autofocus>See your report <kbd>SPACE</kbd></button></div></div></div>`);
}
function reportScreen() {
  const sc = computeScore(S);
  S.score = sc.score;
  const L = lensData();
  const T = CONTENT.theories;
  const bars = ['realism', 'liberalism', 'constructivism'].map(k => {
    const on = Math.round(L.pct[k] / 5);
    let cells = '';
    for (let i = 0; i < 20; i++) cells += `<i class="${i < on ? 'on' : ''}"></i>`;
    return `<div class="lens c-${T[k].color}"><span>${T[k].name.toUpperCase()}</span><span class="lensbar">${cells}</span><span>${L.pct[k]}%</span></div>`;
  }).join('');
  const m = L.matches.map(e => `"${esc(shortLabel(fillText(e.optionLabel)))}" in <i>${esc(e.title)}</i>`);
  const concepts = Object.entries(S.concepts).sort((a, b) => b[1] - a[1]);
  const seen = new Set();
  const cases = S.log.filter(e => e.case && !seen.has(e.case) && seen.add(e.case)).map(e => `<li><span class="c-blue">${esc(e.case)}</span></li>`).join('');
  const hof = loadHof();
  const qualifies = hof.length < 10 || S.score > hof[hof.length - 1].score;
  const bgName = CONTENT.backgrounds.find(b => b.id === S.leader.background).name;
  ui.view = { name: 'report' };
  render(`<div class="full report"><div style="max-width:1000px;margin:0 auto">
    <div class="who">${face('leader', 96, S.ending.type === 'survival' ? 'happy' : 'dead')}<div><div class="kicker">END OF TERM REPORT &middot; CODE ${esc(S.code)}</div><h1 class="title">${esc(S.leader.name)} of ${esc(S.country.name)}: ${esc(S.ending.title)}</h1></div></div>
    <h2>SCORE</h2>
    <div class="big c-blue">${sc.score}</div>
    <p class="c-muted">( meter balance ${sc.meterPart} + 10 &times; ${sc.turns} quarters + treasury ${sc.treasury} &divide; 10 + 5 &times; ${sc.assets} resources left + ${sc.survived ? 200 : 0} for finishing ) &times; ${sc.bg} (${esc(bgName)}) &times; ${sc.dm} (${CONFIG.difficulty[S.difficulty].name})</p>
    <h2>YOUR THEORY LENS: ${esc(T[L.dom].name.toUpperCase())}</h2>
    ${bars}
    ${m.length ? `<p>You sounded most ${T[L.dom].adj} when you chose ${m.join(' and ')}.</p>` : ''}
    ${L.against ? `<p>Even so, when you chose "${esc(shortLabel(fillText(L.against.optionLabel)))}" in <i>${esc(L.against.title)}</i>, you sounded like a ${T[L.againstLens].adj}.</p>` : ''}
    ${['realism', 'liberalism', 'constructivism'].map(k => `<p><span class="c-${T[k].color}">${T[k].name}:</span> ${esc(T[k].text)}</p>`).join('')}
    <p class="c-muted">DP Global Politics also explores Marxist, feminist and postcolonial perspectives, which might read your term very differently.</p>
    <h2>CONCEPTS YOU MET</h2>
    <p>${concepts.map(([c, n], i) => `<span class="chip ${i === 0 ? 'good' : ''}">${esc(c)} &times;${n}</span>`).join(' ')}</p>
    <h2>REAL-WORLD CASES (${seen.size})</h2><ul>${cases}</ul>
    <h2>HALL OF FAME</h2>
    ${qualifies && !S.hofSaved ? `<div style="display:flex;gap:10px;align-items:end"><div class="field" style="margin:0"><label for="f-hof">You made the top 10. Name or initials:</label><input id="f-hof" maxlength="16" value="${esc(S.leader.name)}"></div><button class="btn go" type="button" data-act="hofSave">Engrave it</button></div>` : ''}
    ${hofTable(loadHof(), S.hofId)}
    <div class="prompt"><button class="btn go" type="button" data-act="teacher" data-key="t">T. Teacher report</button><button class="btn" type="button" data-act="title" data-key="space">Back to the title screen</button></div>
  </div></div>`);
}
function hofTable(hof, mark) {
  if (!hof.length) return '<p class="c-muted">No names yet. The chair is waiting.</p>';
  return '<table class="tbl"><tr><th>#</th><th>Name</th><th>Country</th><th>Background</th><th>Outcome</th><th>Score</th></tr>' +
    hof.map((h, i) => `<tr${h.id === mark ? ' class="c-green"' : ''}><td>${i + 1}</td><td>${esc(h.name)}</td><td>${esc(h.country)}</td><td>${esc(h.background)}</td><td>${esc(h.outcome)}</td><td>${h.score}</td></tr>`).join('') + '</table>';
}
function hallScreen() {
  ui.view = { name: 'hall' };
  render(`<div class="full"><div style="max-width:900px;margin:0 auto"><h1 class="title">Hall of Fame</h1>${hofTable(loadHof())}
    <div class="prompt"><button class="btn go" type="button" data-act="title" data-key="space" data-autofocus>Back <kbd>SPACE</kbd></button></div></div></div>`);
}

// ---- INPUT ----
const ACTIONS = {
  title: () => titleScreen(),
  newTerm() {
    const code = ui.pendingCode || newCode();
    ui.pendingCode = null;
    const n = randomNames();
    ui.draft = { code, leader: n.leader, country: n.country, capital: n.capital, background: 'diplomat', difficulty: 'minister', avatar: Object.assign({}, LOOKS[0]) };
    setupScreen();
  },
  useCode() {
    const v = $('f-code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (v.length !== 6 || [...v].some(c => !CODE_CHARS.includes(c))) { $('codemsg').textContent = 'Codes are 6 characters: letters and the digits 2 to 9.'; SFX.warn(); return; }
    ui.pendingCode = v;
    SFX.confirm();
    ACTIONS.newTerm();
  },
  resume() { S = store.get(CONFIG.keys.save); startQuarter(); },
  howto: () => openModal('howto'),
  settings: () => openModal('settings'),
  hall: () => hallScreen(),
  look(arg) {
    const a = ui.draft.avatar;
    const [k, v] = arg.split(':');
    if (k === 'skin') a.skin = +v;
    else if (k === 'hair') a.hair = v;
    else if (k === 'hairCol') a.hairCol = HAIR_COLS[+v];
    else if (k === 'outfitCol') [a.main, a.alt, a.trim] = OUTFIT_COLS[+v];
    else if (k === 'glasses') a.glasses = !a.glasses;
    else if (k === 'beard') a.beard = !a.beard;
    else if (k === 'random') {
      const r = Math.random;
      Object.assign(a, { skin: Math.floor(r() * 5), hair: pick(r, HAIRS), hairCol: pick(r, HAIR_COLS), glasses: r() < 0.3, beard: r() < 0.25 });
      [a.main, a.alt, a.trim] = pick(r, OUTFIT_COLS);
    }
    setupScreen();
  },
  randNames() { Object.assign(ui.draft, randomNames()); setupScreen(); },
  bg(arg) { ui.draft.background = arg; setupScreen(); },
  diff(arg) { ui.draft.difficulty = arg; setupScreen(); },
  toShop() {
    const d = ui.draft;
    const n = randomNames();
    S = newState({
      code: d.code, difficulty: d.difficulty, background: d.background, avatar: d.avatar,
      leader: cleanInput(d.leader, 16) || n.leader, country: cleanInput(d.country, 18) || n.country, capital: cleanInput(d.capital, 16) || n.capital
    });
    d.line = CONTENT.shop.greet;
    d.bought = [];
    d.firsts = {};
    d.warned = false;
    SFX.confirm();
    shopScreen();
  },
  buy(k) {
    const d = ui.draft;
    if (S.credits < CONFIG.prices[k]) { d.line = CONTENT.shop.broke; d.lundFace = 'worried'; SFX.warn(); }
    else {
      S.credits -= CONFIG.prices[k];
      S.assets[k]++;
      d.bought.push(k);
      d.line = d.firsts[k] ? pick(Math.random, CONTENT.shop.idle) : CONTENT.shop.first[k];
      d.firsts[k] = true;
      d.lundFace = 'happy';
      SFX.select();
    }
    shopScreen();
  },
  unbuy(k) {
    const d = ui.draft;
    const i = d.bought.lastIndexOf(k);
    if (i < 0) { SFX.warn(); return; }
    d.bought.splice(i, 1);
    S.assets[k]--;
    S.credits += CONFIG.prices[k];
    d.line = CONTENT.shop.refund;
    d.lundFace = 'calm';
    shopScreen();
  },
  takeOffice() {
    const d = ui.draft;
    const empty = ASSETS.filter(k => !S.assets[k]);
    if (empty.length >= 2 && !d.warned) {
      d.warned = true;
      d.line = CONTENT.shop.none[empty[0]] + ' ' + CONTENT.shop.warn + ' (Press Take office again to go anyway.)';
      d.lundFace = 'worried';
      SFX.warn();
      return shopScreen();
    }
    S.treasury = S.credits;
    delete S.credits;
    S.turn = 1;
    S.lastReport = [];
    SFX.positive();
    startQuarter();
  },
  afterTravel: () => afterTravel(),
  pick: arg => pickChoice(+arg),
  confirm: () => confirmChoice(),
  consult() {
    const cost = CONFIG.difficulty[S.difficulty].advisorCost;
    if (S.assets.security < cost) return SFX.warn();
    S.assets.security -= cost;
    S.ts.advised = ui.view.src.id;
    const picked = ui.view.picked;
    cardScreen(ui.view.src);
    if (picked != null) pickChoice(picked);
  },
  tab(arg) { ui.view.tab = arg; resultScreen(); },
  afterResult: () => afterResult(),
  endQuarter: () => endQuarter(),
  lobbyStart: () => lobbyPlay(),
  lobbySkip() {
    const { src, o, chance } = ui.view;
    const passed = rng(S, 'lobbyskip')() < chance;
    S.minigame = { played: false, passed, ayes: null };
    finish(src, o, { passed });
  },
  seat: arg => ui.lobby && ui.lobby.hit(+arg),
  lobbyStop: () => ui.lobby && ui.lobby.stop(),
  drawer() { ui.drawer ? closeDrawer() : openDrawer(); },
  policy(arg) { const [k, v] = arg.split(':'); S.posture[k] = v; SFX.select(); renderDrawer(); },
  retreat() {
    doRetreat(S);
    closeDrawer();
    SFX.positive();
    quietScreen(CONTENT.text.retreatDone + ' Every meter moved toward the middle.');
  },
  favour(arg) {
    const [id, i] = arg.split(':');
    const d = CONTENT.trades[id][+i];
    for (const k in d.give) { if (k === 'treasury') S.treasury -= d.give[k]; else S.assets[k] -= d.give[k]; }
    for (const k in d.get) { if (k === 'treasury') S.treasury += d.get[k]; else S.assets[k] += d.get[k]; }
    if (d.rel) for (const k in d.rel) S.rel[k] = clamp(S.rel[k] + d.rel[k], -5, 5);
    if (d.legit) S.meters.legit = clamp(S.meters.legit + d.legit, 0, 100);
    for (const f of (d.setFlags || [])) if (S.flags[f] == null) S.flags[f] = S.turn;
    S.ts.traded = true;
    SFX.confirm();
    refreshAfterDesk();
  },
  menu: () => openModal('main'),
  openGloss: () => openModal('glossary'),
  gloss: arg => openModal('glossary', arg),
  mview: arg => openModal(arg),
  mclose: () => closeModal(),
  mquit() { closeModal(); titleScreen(); },
  pref(arg) {
    const [k, v] = arg.split(':');
    settings[k] = v === 'true' ? true : v === 'false' ? false : v;
    saveSettings();
    applySettings();
    openModal('settings');
  },
  carve() { S.epitaph = cleanInput($('f-epitaph').value, 40); collapseText(); },
  report: () => reportScreen(),
  hofSave() {
    const hof = loadHof();
    const name = cleanInput($('f-hof').value, 16) || S.leader.name;
    const id = Date.now().toString(36);
    hof.push({ id, name, country: S.country.name, background: CONTENT.backgrounds.find(b => b.id === S.leader.background).name, outcome: S.ending.title, score: S.score, code: S.code });
    hof.sort((a, b) => b.score - a.score);
    store.set(CONFIG.keys.hof, hof.slice(0, 10));
    S.hofSaved = true;
    S.hofId = id;
    reportScreen();
  },
  teacher: () => teacherReport()
};
function act(name, arg, el) {
  if (!ACTIONS[name]) return;
  unlockAudio();
  ACTIONS[name](arg, el);
}
function bindInput() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'pick') return;
    e.preventDefault();
    act(el.dataset.act, el.dataset.arg, el);
  });
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-hover]');
    if (el && ui.view && ui.view.name === 'card' && ui.hover !== +el.dataset.hover) showPreview(ui.view.src, +el.dataset.hover);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-hover]');
    if (el && !el.contains(e.relatedTarget) && ui.view && ui.view.name === 'card') showPreview(ui.view.src, ui.view.picked);
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest('[data-hover]');
    if (el && ui.view && ui.view.name === 'card') showPreview(ui.view.src, +el.dataset.hover);
  });
  document.addEventListener('keydown', e => {
    unlockAudio();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    const k = e.key.toLowerCase();
    if (ui.modal) {
      if (k === 'escape') { e.preventDefault(); ui.modal === 'main' ? closeModal() : openModal('main'); return; }
      if (tag === 'INPUT') return;
      const b = $('mbody').querySelector(`[data-key="${k}"]`);
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    if ((k === 'enter' || k === ' ') && e.target.classList && e.target.classList.contains('choice') && !e.target.classList.contains('picked')) { e.preventDefault(); e.target.click(); return; }
    if (tag === 'INPUT') {
      if (k === 'escape') { e.preventDefault(); openModal('main'); }
      else if (k === 'enter' && ui.view && ui.view.name === 'setup') { e.preventDefault(); act('toShop'); }
      return;
    }
    if (k === 'escape' && ui.drawer) { e.preventDefault(); closeDrawer(); return; }
    if (k === 'escape' || k === 'p') { e.preventDefault(); openModal('main'); return; }
    if (k === 'g') { e.preventDefault(); openModal('glossary'); return; }
    if (k === 'd' && S && !S.ending) { e.preventDefault(); act('drawer'); return; }
    if ((k === 'enter' || k === ' ') && tag === 'BUTTON' && !e.target.dataset.key) return;
    if ((k === 'enter' || k === ' ') && e.target.classList.contains('gl')) { e.preventDefault(); act('gloss', e.target.dataset.arg); return; }
    const key = k === ' ' || k === 'enter' ? 'space' : k;
    const b = $('view').querySelector(`[data-key="${CSS.escape(key)}"]:not([disabled])`);
    if (b) { e.preventDefault(); b.click(); }
  });
  $('mclose').addEventListener('click', () => closeModal());
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
}

// ---- DEBUG ----
const DEBUG = typeof location !== 'undefined' && /[?&]debug=1\b/.test(location.search);
function buildDebug() {
  const d = document.createElement('div');
  d.id = 'debug';
  const out = document.createElement('pre');
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', fn); d.appendChild(b); };
  const need = fn => () => { if (!S) { out.textContent = 'Start a game first.'; return; } fn(); };
  d.innerHTML = '<b>DEBUG</b><br>';
  for (const m of METERS) {
    btn(METER_SHORT[m] + '+10', need(() => { S.meters[m] = clamp(S.meters[m] + 10, 0, 100); refreshAfterDesk(); }));
    btn(METER_SHORT[m] + '-10', need(() => { S.meters[m] = clamp(S.meters[m] - 10, 0, 100); refreshAfterDesk(); }));
  }
  btn('+1 resources', need(() => { ASSETS.forEach(k => S.assets[k]++); refreshAfterDesk(); }));
  btn('+500 treasury', need(() => { S.treasury += 500; refreshAfterDesk(); }));
  btn('flags', need(() => { out.textContent = JSON.stringify(S.flags, null, 1); }));
  btn('force card', need(() => { const id = (prompt('Card id (RJ1, CB5, L3...)') || '').toUpperCase(); const c = [...CONTENT.cards, ...CONTENT.callbacks, ...CONTENT.landmarks].find(x => x.id === id); if (c) cardScreen(c); }));
  btn('force ending', need(() => { const k = prompt('Ending: ' + [...Object.keys(CONTENT.endings.collapse), 'survival'].join(', ')); if (k === 'survival') finalEnding(); else if (CONTENT.endings.collapse[k]) collapseEnding(k); }));
  btn('sim random x1000', () => { out.textContent = JSON.stringify(simulate(1000, 'random'), null, 1); });
  btn('sim heuristic x1000', () => { out.textContent = JSON.stringify(simulate(1000, 'heuristic'), null, 1); });
  btn('validate', () => { const p = validateContent(); out.textContent = p.length ? p.length + ' problems (see console)' : 'CONTENT OK'; });
  d.appendChild(out);
  document.body.appendChild(d);
}

// ---- BOOT ----
function boot() {
  applySettings();
  validateContent();
  bindInput();
  try { window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', applySettings); } catch (e) { }
  if (DEBUG) buildDebug();
  titleScreen();
}
if (typeof document !== 'undefined' && document.getElementById('screen')) boot();
</script>
