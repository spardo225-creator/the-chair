<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --screen: #000000;
  --panel: #07080c;
  --panel-2: #10121a;
  --text: #ffffff;
  --muted: #a9adb8;
  --line: #2f3340;
  --line-hi: #4a4f60;
  --green: #14F53C;
  --orange: #FF7A00;
  --violet: #B84CFF;
  --blue: #1F9CFF;
  --on-blue: #000000;
  --zone-safe: rgba(20, 245, 60, .28);
  --zone-caution: rgba(255, 196, 0, .28);
  --zone-danger: rgba(255, 70, 40, .38);
  --portrait-bg: #141826;
  --bezel: #2B2B2B;
  --bezel-hi: #4A4A4A;
  --case-hi: #e2dccb;
  --case: #c9c1ad;
  --case-lo: #988f7c;
  --body: 'VT323', monospace;
  --title: 'Press Start 2P', monospace;
  --size: clamp(18px, 0.9vw + 9px, 25px);
}
:root[data-theme="daylight"] {
  --screen: #f3eee2;
  --panel: #fbf8f1;
  --panel-2: #ece5d6;
  --text: #15131a;
  --muted: #4f4a57;
  --line: #cfc5b2;
  --line-hi: #a99f8b;
  --green: #0b7a2b;
  --orange: #b04600;
  --violet: #6f2fc4;
  --blue: #0b5bc4;
  --on-blue: #ffffff;
  --zone-safe: rgba(11, 122, 43, .25);
  --zone-caution: rgba(200, 140, 0, .3);
  --zone-danger: rgba(200, 50, 30, .32);
  --portrait-bg: #e3dccd;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--body); color: var(--text); background: var(--screen); overflow: hidden; }
body.readable { --body: 'Atkinson Hyperlegible', Arial, sans-serif; --size: clamp(15px, 0.6vw + 9px, 19px); }
body.large { --size: clamp(21px, 1vw + 11px, 29px); }
body.readable.large { --size: clamp(17px, 0.7vw + 11px, 22px); }
button, input { font: inherit; color: inherit; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

#screen { position: fixed; inset: 0; background: var(--screen); overflow: clip; display: flex; flex-direction: column; font-size: var(--size); line-height: 1.15;
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--blue) 55%, transparent), inset 0 0 60px color-mix(in srgb, var(--blue) 12%, transparent); }
#badge { position: fixed; right: 14px; bottom: 10px; z-index: 45; display: flex; align-items: center; gap: 8px; pointer-events: none;
  font-family: var(--title); font-size: 10px; letter-spacing: 3px; color: var(--blue); opacity: .75; text-shadow: 0 0 6px var(--blue); }
#badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
#crt { position: fixed; inset: 0; pointer-events: none; z-index: 40;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.45) 100%);
  animation: flicker 5s steps(1) infinite; }
:root[data-theme="daylight"] #crt { background: repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.18) 100%); }
body.nocrt #crt { display: none; }
@keyframes flicker { 0% { opacity: .96; } 30% { opacity: 1; } 31% { opacity: .93; } 33% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }

#view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.hud { height: 50px; flex: none; display: flex; align-items: center; gap: 22px; padding: 0 16px 0 20px; border-bottom: 2px solid var(--blue); white-space: nowrap; }
.hud .moodic { width: 24px; height: 24px; vertical-align: -4px; margin-right: 6px; display: inline-block; }
.hud .debt { color: var(--orange); animation: blink 1s steps(2) infinite; }
.hud .code { color: var(--blue); }
.hud .sp { flex: 1; }
.hbtn { background: transparent; border: 2px solid var(--line-hi); color: var(--text); padding: 2px 12px; cursor: pointer; font-size: 20px; }
.hbtn:hover { border-color: var(--blue); color: var(--blue); }
.hbtn.menu { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.hbtn kbd { font: inherit; opacity: .7; margin-left: 6px; }

.desk { flex: 1; min-height: 0; display: grid; grid-template-columns: clamp(250px, 21vw, 330px) 1fr; }
.me { border-right: 2px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.me-head { display: flex; gap: 12px; align-items: center; }
.me-name { font-family: var(--title); font-size: 13px; line-height: 1.5; }
.me-sub { color: var(--muted); font-size: .8em; }
.mood { color: var(--green); font-size: .85em; }
.portrait { background: var(--portrait-bg); border: 2px solid var(--line-hi); padding: 4px; flex: none; position: relative; }
.meter { display: grid; gap: 3px; }
.meter .row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: baseline; }
.meter .nm { font-family: var(--title); font-size: 11px; }
.meter .val { font-size: .8em; color: var(--muted); }
.meter .what { font-size: .72em; color: var(--muted); }
.meter .arr { font-size: .95em; letter-spacing: -2px; text-align: right; font-weight: bold; }
.arr.good { color: var(--green); } .arr.bad { color: var(--orange); } .arr.unk { color: var(--muted); }
.m-power .nm { color: var(--orange); } .m-sov .nm { color: var(--blue); } .m-legit .nm { color: var(--green); } .m-inter .nm { color: var(--violet); }
.track { position: relative; height: 18px; border: 2px solid var(--line-hi); background: var(--panel); }
.zones { height: 6px; margin-top: -1px; background: linear-gradient(90deg, var(--zone-danger) 0 15%, var(--zone-caution) 15% 30%, var(--zone-safe) 30% 70%, var(--zone-caution) 70% 85%, var(--zone-danger) 85% 100%); }
.track::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--screen) calc(10% - 2px) 10%); opacity: .6; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; z-index: 1; transition: width .6s steps(10); }
.m-power .fill { background: var(--orange); } .m-sov .fill { background: var(--blue); } .m-legit .fill { background: var(--green); } .m-inter .fill { background: var(--violet); }
.track .fill { opacity: .85; }
.track .ghost { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; background: var(--text); z-index: 2; display: none; animation: blink .8s steps(2) infinite; }
.meter.danger .track { border-color: var(--orange); animation: blink .7s steps(2) infinite; }
.meter.danger .val { color: var(--orange); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .7em; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; }
.note { font-size: .72em; color: var(--muted); }

.main { min-height: 0; overflow-y: auto; padding: 18px clamp(16px, 2vw, 32px) 28px; }
.main > * { max-width: 1240px; margin-left: auto; margin-right: auto; }
.box { border: 2px solid var(--line-hi); background: var(--panel); padding: 14px 16px; }
.who { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
.who .speaker { font-family: var(--title); font-size: 12px; line-height: 1.6; }
.who .role { color: var(--muted); font-size: .8em; }
.kicker { color: var(--violet); font-size: .8em; margin-bottom: 2px; }
h1.title { font-family: var(--title); font-size: 20px; font-weight: normal; line-height: 1.4; margin: 6px 0 6px; text-transform: uppercase; }
.chip { display: inline-block; border: 1px solid var(--line-hi); padding: 0 8px; font-size: .75em; margin-right: 6px; white-space: nowrap; }
.chip.blue { color: var(--blue); border-color: var(--blue); }
.chip.good { color: var(--green); border-color: var(--green); }
.chip.bad { color: var(--orange); border-color: var(--orange); }
.lede { margin: 10px 0 14px; max-width: 64em; }
.gl { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.choice { text-align: left; background: var(--panel); border: 2px solid var(--line-hi); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 110px; }
.choice .num { font-family: var(--title); font-size: 11px; color: var(--green); }
.choice .label { font-size: 1em; }
.choice .chips { margin-top: auto; padding-top: 4px; }
.choice:hover, .choice:focus-visible { border-color: var(--blue); }
.choice.picked { border-color: var(--blue); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--blue); }
.choice[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.choice .why { color: var(--orange); font-size: .8em; }
.prompt { margin-top: 10px; color: var(--green); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cur { animation: blink 1s steps(2) infinite; }
.btn { background: var(--panel); border: 2px solid var(--line-hi); color: var(--text); padding: 4px 16px; cursor: pointer; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.go { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.btn.go:hover { color: var(--on-blue); filter: brightness(1.15); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn kbd { font: inherit; opacity: .7; margin-left: 6px; }

.cabinet { margin-top: 16px; }
.cabinet .head, .sec { font-family: var(--title); font-size: 11px; color: var(--muted); margin: 0 0 10px; }
.advisors { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.adv { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.adv .bubble { border: 2px solid var(--line-hi); background: var(--panel); padding: 6px 8px; font-size: .78em; position: relative; }
.adv .bubble::before { content: ''; position: absolute; left: -8px; top: 14px; border: 6px solid transparent; border-right-color: var(--line-hi); border-left: 0; }
.adv .nm { font-size: .72em; color: var(--muted); margin-top: 4px; }
.react { display: inline-block; font-size: .72em; padding: 0 6px; margin-top: 4px; visibility: hidden; border: 1px solid; }
.react.yes { visibility: visible; color: var(--green); }
.react.no { visibility: visible; color: var(--orange); }
.react.meh { visibility: visible; color: var(--muted); }
.nod { animation: nod .45s steps(2) 2; }
.shake { animation: shake .35s steps(2) 2; }
@keyframes nod { 50% { transform: translateY(4px); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 12px 0 10px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 4px 14px; cursor: pointer; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
.tabpanel { max-width: 62em; min-height: 120px; }
.tabpanel .q { color: var(--green); }
.outcome { border-left: 4px solid var(--blue); padding-left: 12px; margin: 8px 0; }
.quote { font-style: italic; color: var(--muted); }

.mapart { width: 100%; border: 2px solid var(--line); }
.news { margin-top: 12px; }
.news .item { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; }
.news .tag { font-family: var(--title); font-size: 10px; color: var(--orange); flex: none; }
.news .tag.b { color: var(--blue); }

.seats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 10px 0; }
.seat { background: var(--panel); border: 2px solid var(--line-hi); padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .75em; }
.seat.white { border-color: var(--text); box-shadow: 0 0 0 2px var(--text); animation: blink .35s steps(2) infinite; }
.seat.green { border-color: var(--green); color: var(--green); }
.seat.orange { border-color: var(--orange); color: var(--orange); opacity: .8; }
.timer { display: flex; justify-content: space-between; font-family: var(--title); font-size: 14px; }

.full { flex: 1; min-height: 0; overflow-y: auto; padding: 28px clamp(16px, 3vw, 48px); }
.full > div:not(.center), .full > .grid2 { max-width: 1240px; margin-left: auto; margin-right: auto; }
.center { display: flex; flex-direction: column; align-items: center; text-align: center; }
.logo { font-family: var(--title); font-size: 48px; margin: 12px 0 6px; }
.tagline { font-family: var(--title); font-size: 16px; color: var(--green); margin-bottom: 18px; }
.menu-list { display: grid; gap: 8px; min-width: 420px; text-align: left; }
.menu-list .btn { text-align: left; display: flex; justify-content: space-between; }
.menu-list .btn .k { color: var(--green); margin-right: 10px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { color: var(--green); font-size: .85em; }
.field input { background: var(--panel); border: 2px solid var(--line-hi); padding: 4px 8px; }
.field input:focus { border-color: var(--blue); outline: none; }
.grid2 { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 30px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.sw { width: 34px; height: 34px; border: 2px solid var(--line-hi); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--blue); border-color: var(--blue); }
.sw.txt { width: auto; padding: 0 10px; background: var(--panel); font-size: .8em; }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { text-align: left; background: var(--panel); border: 2px solid var(--line-hi); padding: 10px 12px; cursor: pointer; }
.card[aria-pressed="true"] { border-color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
.card b { font-family: var(--title); font-size: 11px; display: block; margin-bottom: 4px; line-height: 1.5; }
.card .dim { color: var(--muted); font-size: .8em; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--line-hi); }
.seg button { background: var(--panel); border: 0; padding: 4px 14px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--line-hi); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
.shoprow { display: grid; grid-template-columns: 1fr 80px 140px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 2px solid var(--line); }
.shoprow .d { font-size: .75em; color: var(--muted); }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 40px; height: 36px; background: var(--panel); border: 2px solid var(--line-hi); cursor: pointer; }
.step button:hover { border-color: var(--blue); }
.lund { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
.lund .say { border: 2px solid var(--green); padding: 8px 12px; color: var(--green); }
.tbl { border-collapse: collapse; width: 100%; font-size: .85em; }
.tbl td, .tbl th { padding: 3px 8px; text-align: left; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--blue); font-weight: normal; }
.lens { display: grid; grid-template-columns: 200px 1fr 60px; gap: 10px; align-items: center; margin: 4px 0; }
.lensbar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 20px; }
.lensbar i { border: 1px solid currentColor; } .lensbar i.on { background: currentColor; }
.c-green { color: var(--green); } .c-orange { color: var(--orange); } .c-blue { color: var(--blue); } .c-violet { color: var(--violet); } .c-muted { color: var(--muted); }
.big { font-family: var(--title); font-size: 34px; margin: 8px 0; }
.report h2 { font-family: var(--title); font-size: 13px; color: var(--blue); margin: 22px 0 10px; font-weight: normal; }

.drawer { position: fixed; top: 50px; right: 0; bottom: 0; width: min(480px, 92vw); box-shadow: -18px 0 40px rgba(0,0,0,.5); background: var(--panel); border-left: 2px solid var(--blue); z-index: 20; transform: translateX(105%); transition: transform .2s steps(4); display: flex; flex-direction: column; }
.drawer:not(.open) { visibility: hidden; transition: transform .2s steps(4), visibility 0s .2s; }
.drawer.open { transform: none; }
.drawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 2px solid var(--line); font-family: var(--title); font-size: 12px; }
.drawer .db { padding: 12px 16px; overflow-y: auto; flex: 1; font-size: .9em; }
.drawer section { margin-bottom: 18px; }
.res { display: grid; grid-template-columns: 1fr auto; padding: 4px 0; border-bottom: 1px solid var(--line); }
.res .n { color: var(--green); font-size: 1.2em; }
.res .d { grid-column: 1 / -1; font-size: .75em; color: var(--muted); }
.pnote { font-size: .75em; color: var(--muted); margin: 4px 0 12px; }
.nb { display: grid; grid-template-columns: 60px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.relbar { display: inline-grid; grid-template-columns: repeat(11, 12px); gap: 2px; vertical-align: middle; margin: 0 6px; }
.relbar i { height: 10px; border: 1px solid var(--line-hi); }
.relbar i.pos { background: var(--green); border-color: var(--green); } .relbar i.neg { background: var(--orange); border-color: var(--orange); } .relbar i.mid { border-color: var(--blue); }
.nb .line { font-size: .78em; color: var(--muted); }
.favour { display: block; width: 100%; text-align: left; margin-top: 4px; font-size: .8em; padding: 2px 8px; }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .88); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; }
:root[data-theme="daylight"] .modal { background: rgba(243, 238, 226, .9); }
.modal.open { display: flex; }
.modal .win { width: min(600px, 92vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--blue); line-height: 1.3;
  box-shadow: 0 0 0 6px var(--screen), 0 0 0 8px var(--line-hi), 0 0 50px color-mix(in srgb, var(--blue) 30%, transparent); }
.modal .mh { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 2px solid var(--line); font-family: var(--title); font-size: 16px; letter-spacing: 1px; }
#mclose { font-family: var(--body); font-size: 20px; letter-spacing: 0; padding: 2px 12px; }
.modal .mb { padding: 18px 22px 22px; overflow-y: auto; }
.minfo { color: var(--muted); font-size: .85em; margin: 0 0 14px; }
.mlist { display: grid; gap: 10px; }
.mitem { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; width: 100%; padding: 10px 14px; text-align: left; cursor: pointer;
  background: var(--panel); border: 2px solid var(--line-hi); color: var(--text); font-size: 1.05em; }
.mitem .n { font-family: var(--title); font-size: 12px; color: var(--green); border: 2px solid currentColor; text-align: center; padding: 6px 0; }
.mitem .hint { color: var(--muted); font-size: .8em; }
.mitem:hover, .mitem:focus-visible { border-color: var(--blue); background: var(--panel-2); }
.mitem.primary { border-color: var(--blue); }
.mitem.primary .n { color: var(--blue); }
.srow { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srow:last-of-type { border-bottom: 0; }
.srow .lab { color: var(--green); }
.srow .seg { display: grid; width: 100%; }
.srow .seg button { padding: 6px 8px; }
.mfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 2px solid var(--line); }
.mfoot .c-muted { font-size: .8em; }
.mtext p { margin: 0 0 10px; }
.mtext .sec { margin-top: 14px; }
.gsearch { width: 100%; background: var(--screen); border: 2px solid var(--blue); padding: 4px 8px; margin-bottom: 10px; }
.gterm { padding: 6px 0; border-bottom: 1px solid var(--line); }
.gterm b { color: var(--blue); font-weight: normal; }
.gterm .ex { color: var(--green); font-size: .85em; }
.mrow { margin-bottom: 12px; }
.mrow > div:first-child { color: var(--green); margin-bottom: 4px; }

#sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#debug { position: fixed; right: 8px; bottom: 8px; z-index: 60; width: 300px; background: #000; color: #fff; border: 2px solid #B84CFF; font: 12px/1.3 monospace; padding: 8px; }
#debug button { font: 12px monospace; margin: 2px; background: #222; color: #fff; border: 1px solid #666; cursor: pointer; }
#debug pre { white-space: pre-wrap; color: #14F53C; max-height: 200px; overflow: auto; }

#print { display: none; position: fixed; inset: 0; z-index: 100; background: #fff; color: #000; overflow: auto; font-family: 'Atkinson Hyperlegible', Arial, sans-serif; font-size: 14px; line-height: 1.4; }
#print.on { display: block; }
#print .sheet { max-width: 190mm; margin: 0 auto; padding: 16px; }
#print h1 { font-size: 22px; margin: 0 0 4px; }
#print h2 { font-size: 16px; margin: 18px 0 6px; border-bottom: 2px solid #000; }
#print table { border-collapse: collapse; width: 100%; font-size: 12px; }
#print td, #print th { border: 1px solid #555; padding: 3px 5px; text-align: left; vertical-align: top; }
#print th { background: #eee; }
#print .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
#print .meta input { font: inherit; border: 0; border-bottom: 1px solid #000; width: 60%; }
#print .lines div { border-bottom: 1px solid #999; height: 26px; }
#print .q { margin-top: 12px; font-weight: 700; }
#print .tools { position: sticky; top: 0; background: #fff; padding: 8px 0; border-bottom: 1px solid #ccc; margin-bottom: 10px; }
#print .tools button { font: inherit; padding: 6px 14px; margin-right: 6px; cursor: pointer; }
#print .copied { color: #0a6; margin-left: 8px; }
@media print {
  body { background: #fff; overflow: visible; }
  #screen, #badge, #crt, #debug { display: none !important; }
  #print { display: block; position: static; overflow: visible; }
  #print .tools { display: none; }
  #print .sheet { max-width: none; padding: 0; }
  #print tr, #print .q { break-inside: avoid; }
  @page { margin: 14mm; }
}
body.reduced #crt, body.reduced #badge i, body.reduced .cur, body.reduced .hud .debt, body.reduced .meter.danger .track, body.reduced .seat.white, body.reduced .ghost { animation: none; }
body.reduced .nod, body.reduced .shake { animation: none; }
body.reduced .drawer, body.reduced .track .fill { transition: none; }

CONTENT.glossary = [
  { term: 'power', def: 'The ability to make others do what they would not otherwise do, or to get the outcomes you want.', ex: 'A state with a large army and economy has a lot of power.' },
  { term: 'hard power', def: 'Power based on force or payment: military strength, sanctions and money.', ex: 'Threatening a blockade is hard power.' },
  { term: 'soft power', def: 'Power based on attraction: culture, values and reputation that make others want what you want.', ex: 'Foreign students choosing your universities is soft power.' },
  { term: 'smart power', def: 'Combining hard and soft power so they support each other.', ex: 'Sending troops to protect aid workers alongside a cultural exchange programme.' },
  { term: 'sovereignty', def: 'A state\'s supreme authority over its territory and people, and its independence from outside control.', ex: 'Deciding your own border policy is an exercise of sovereignty.' },
  { term: 'legitimacy', def: 'The belief, at home and abroad, that a government has the right to rule and act.', ex: 'A government elected in a fair vote has strong legitimacy.' },
  { term: 'interdependence', aliases: ['interdependent'], def: 'A situation where states rely on each other, so what happens to one affects the others.', ex: 'Two countries that trade food and fuel with each other are interdependent.' },
  { term: 'state', aliases: ['states'], def: 'A political unit with a territory, a population, a government and sovereignty.', ex: 'Port Selene is a state, even though it is a single city.' },
  { term: 'nation', def: 'A group of people who feel they share an identity, such as language, history or culture. A nation is not always a state.', ex: 'A nation can be spread across several states.' },
  { term: 'non-state actor', aliases: ['non-state actors'], def: 'Any actor in global politics that is not a state, such as an NGO, company, armed group or social movement.', ex: 'The Free Highlands Front is a non-state actor.' },
  { term: 'IGO', aliases: ['IGOs', 'intergovernmental organisation'], def: 'An intergovernmental organisation, made up of member states.', ex: 'The Concord of Nations is an IGO.' },
  { term: 'NGO', aliases: ['NGOs'], def: 'A non-governmental organisation: a private, non-profit group working on an issue.', ex: 'Lantern Watch is a human rights NGO.' },
  { term: 'MNC', aliases: ['MNCs', 'multinational'], def: 'A multinational corporation: a company that operates in many countries.', ex: 'Helix Data is a tech MNC.' },
  { term: 'globalization', aliases: ['globalisation'], def: 'The growing connection of the world through trade, technology, travel and ideas.', ex: 'Cheap grain from abroad in your shops is a sign of globalization.' },
  { term: 'development', def: 'Improving people\'s lives, including income, health, education and freedom.', ex: 'Building rural schools is part of development.' },
  { term: 'sustainability', aliases: ['sustainable'], def: 'Meeting today\'s needs without damaging the ability of future generations to meet theirs.', ex: 'Replacing coal with wind power supports sustainability.' },
  { term: 'inequality', def: 'Unequal access to wealth, power or opportunity between people or countries.', ex: 'Rich states buying most of the vaccines is an example of inequality.' },
  { term: 'human rights', def: 'Rights every person has simply because they are human, such as life, freedom of speech and a fair trial.', ex: 'The ban on torture is a human right.' },
  { term: 'justice', def: 'Fairness in how people are treated, how wrongs are punished and how resources are shared.', ex: 'A trial for past abuses is one way of seeking justice.' },
  { term: 'liberty', def: 'Freedom from unjustified control by government or others.', ex: 'Free speech online is a liberty question.' },
  { term: 'equality', def: 'People having the same rights, status and opportunities.', ex: 'Equal pay for equal work is about equality.' },
  { term: 'self-determination', def: 'The right of a people to choose their own political status and government.', ex: 'A region voting on autonomy is using self-determination.' },
  { term: 'peace', def: 'Negative peace is the absence of war; positive peace also includes justice and the removal of the causes of conflict.', ex: 'A ceasefire is negative peace; fair courts and schools for all help build positive peace.' },
  { term: 'negative peace', def: 'The absence of direct violence or war.', ex: 'Two armies facing each other without firing.' },
  { term: 'positive peace', def: 'A lasting peace built on justice, fairness and cooperation.', ex: 'Former enemies running joint schools and businesses.' },
  { term: 'conflict', def: 'A clash of interests or goals between actors. Conflict can be violent or non-violent.', ex: 'Two states arguing over a river is a conflict, even before any shots.' },
  { term: 'violence', def: 'Harm done to people. It can be direct (physical) or structural (built into systems).', ex: 'Both a bombing and an unfair law can be called violence.' },
  { term: 'direct violence', def: 'Physical harm caused by an identifiable actor.', ex: 'Police beating protesters.' },
  { term: 'structural violence', def: 'Harm caused by unfair social or economic systems, such as poverty or discrimination, without a single attacker.', ex: 'Children dying of curable diseases because clinics are too expensive.' },
  { term: 'non-violence', aliases: ['nonviolent', 'non-violent'], def: 'Pursuing change through methods such as protests, strikes and boycotts without physical harm.', ex: 'A peaceful sit-in is non-violence.' },
  { term: 'collective security', def: 'An arrangement where states agree that an attack on one is a concern for all and respond together.', ex: 'Council sanctions against an invader are collective security in action.' },
  { term: 'Responsibility to Protect', aliases: ['R2P'], def: 'The principle, agreed in 2005, that states must protect their people from atrocities, and others may act if they fail.', ex: 'A Council-authorised mission to stop mass killings.' },
  { term: 'balance of power', def: 'A situation where power is spread so that no single state can dominate; states may ally to keep it that way.', ex: 'Small states joining together against a giant neighbour.' },
  { term: 'security dilemma', def: 'When one state\'s efforts to feel safe make others feel less safe, leading to an arms race.', ex: 'New missiles for defence look like a threat from across the border.' },
  { term: 'sanctions', def: 'Penalties, often economic, used to pressure a state or person to change behaviour.', ex: 'Banning trade with a state that invaded its neighbour.' },
  { term: 'conditionality', def: 'Attaching conditions to loans or aid, such as reforms or spending cuts.', ex: 'A loan given only if the borrower cuts public spending.' },
  { term: 'hegemony', aliases: ['hegemon'], def: 'Dominance by one state over others, often with influence over the rules everyone follows.', ex: 'A superpower setting the terms of world trade.' },
  { term: 'multilateralism', aliases: ['multilateral'], def: 'Several states working together through shared rules and institutions.', ex: 'Negotiating a climate deal with 190 countries at once.' },
  { term: 'national interest', def: 'The goals a state sees as important for its survival and well-being.', ex: 'Securing cheap energy is often called a national interest.' },
  { term: 'realism', aliases: ['realist'], def: 'A theory that sees world politics as a struggle for power and survival among states in an anarchic system.', ex: 'Building up your army because you cannot trust neighbours is realist thinking.' },
  { term: 'liberalism', def: 'A theory that sees cooperation, trade, democracy and institutions as ways to make world politics more peaceful.', ex: 'Joining a trade bloc to reduce the risk of war is liberal thinking.' },
  { term: 'constructivism', aliases: ['constructivist'], def: 'A theory that says ideas, identities and norms shape how states see their interests and act.', ex: 'A state refusing to use landmines because it sees itself as humane.' },
  { term: 'anarchy', aliases: ['anarchic'], def: 'In international relations, the absence of a world government above states. It does not mean chaos.', ex: 'No world police can force a superpower to obey a court ruling.' },
  { term: 'norm', aliases: ['norms'], def: 'A shared expectation about how actors should behave.', ex: 'The idea that using chemical weapons is unacceptable is a norm.' },
  { term: 'non-refoulement', def: 'The rule that refugees must not be sent back to a place where they face serious danger.', ex: 'Pushing refugees back across a border into a war zone breaks non-refoulement.' },
  { term: 'refugee', aliases: ['refugees'], def: 'A person forced to flee their country because of persecution, war or violence.', ex: 'Families crossing from Drevania to escape fighting.' },
  { term: 'treaty', aliases: ['treaties'], def: 'A formal written agreement between states that is binding under international law.', ex: 'A water-sharing agreement signed by two neighbours.' }
];
