}
// ---- ENGINE ----
function assetLabel(k, n) { return n + ' ' + ASSET_NAME[k]; }
function costText(c) { return Object.keys(c).filter(k => c[k]).map(k => k === 'treasury' ? c[k] + ' Treasury' : assetLabel(k, c[k])).join(', '); }
function fillText(t) {
  t = String(t == null ? '' : t);
  if (!S) return t;
  return t.replace(/\{country\}/g, S.country.name).replace(/\{capital\}/g, S.country.capital).replace(/\{leader\}/g, S.leader.name);
}
function optionCheck(s, src, o) {
  for (const k in (o.cost || {})) if ((s.assets[k] || 0) < o.cost[k]) return { ok: false, why: 'needs ' + assetLabel(k, o.cost[k]) };
  for (const k in (o.needs || {})) if ((s.assets[k] || 0) < o.needs[k]) return { ok: false, why: 'needs ' + assetLabel(k, o.needs[k]) };
  const st = src.actor && src.actor.state;
  const tags = o.tags || [];
  if (st && tags.includes('cooperative') && s.rel[st] <= -3) return { ok: false, why: CONTENT.states[st].short + ' will not work with you' };
  if (st && tags.includes('hostile') && s.rel[st] >= 3) return { ok: true, warn: 'Your allies would not forget this.' };
  return { ok: true };
}
function riskText(s, o) {
  const mode = CONFIG.difficulty[s.difficulty].risk;
  if (mode === 'hidden') return '';
  if (o.gamble) {
    const c = gambleChance(s, o);
    if (mode === 'percent') return Math.round(c * 100) + '% success';
    return o.risk || (c >= 0.65 ? 'Low' : c >= 0.45 ? 'Medium' : 'High');
  }
  return o.risk || '';
}
const SPECIALS = {
  election(s, o) {
    const spend = (o.cost && o.cost.influence) || 0;
    const score = s.meters.legit + 8 * spend;
    if (score >= 50) return { effects: { legit: 4 }, text: o.outcomes.win };
    if (score >= 30) return { effects: {}, text: o.outcomes.narrow };
    s.coalition = true;
    return { effects: {}, text: o.outcomes.coalition };
  }
};
function simChoose(s, src, r, mode) {
  const avail = src.options.filter(o => optionCheck(s, src, o).ok);
  if (!avail.length) return null;
  if (mode === 'random') return pick(r, avail);
  const worst = METERS.reduce((a, k) => Math.abs(s.meters[k] - 50) > Math.abs(s.meters[a] - 50) ? k : a, 'power');
  if (s.meters[worst] >= CONFIG.danger.low && s.meters[worst] <= CONFIG.danger.high) return pick(r, avail);
  const dir = s.meters[worst] > 50 ? -1 : 1;
  const pull = o => {
    const e = typeof o.effects === 'function' ? o.effects(s) : (o.effects || {});
    let v = e[worst] || 0;
    if (o.gamble) { const c = gambleChance(s, o); v += c * ((o.gamble.win.effects || {})[worst] || 0) + (1 - c) * ((o.gamble.lose.effects || {})[worst] || 0); }
    if (o.vote) v += 0.5 * (((o.vote.pass.effects || {})[worst] || 0) + ((o.vote.fail.effects || {})[worst] || 0));
    if (s.treasury + (e.treasury || 0) < 0) v -= 100 * dir;
    return v * dir;
  };
  const best = Math.max(...avail.map(pull));
  return pick(r, avail.filter(o => pull(o) === best));
}
function previewDeltas(src, o) {
  const shadow = JSON.parse(JSON.stringify({ meters: S.meters, difficulty: S.difficulty, mood: S.mood, coalition: S.coalition, treasury: S.treasury, rel: S.rel, assets: S.assets }));
  const e = typeof o.effects === 'function' ? o.effects(S) : (o.effects || {});
  return applyEffects(shadow, e, src.turn ? 'landmark' : 'card');
}
function zoneOf(v) { return v < CONFIG.danger.low || v > CONFIG.danger.high ? 'danger' : v < CONFIG.caution.low || v > CONFIG.caution.high ? 'caution' : 'safe'; }

function advisorStance(src) {

  const pickBy = fn => {

    const once = v => vals.filter(x => x === v).length === 1;
    return { favours: once(max) ? vals.indexOf(max) : -1, opposes: min < max && once(min) ? vals.indexOf(min) : -1 };
  };

    realist: pickBy(o => o.theory[0] * 10 + ((o.effects && o.effects.power) || 0) / 10),
    liberal: pickBy(o => o.theory[1] * 10 + ((o.effects && o.effects.inter) || 0) / 10),
    constructivist: pickBy(o => o.theory[2] * 10 + ((o.effects && o.effects.legit) || 0) / 10),

function endQuarter() {
  countryTick(S);
  pressureTick();
  threatTick();
  const rep = endTurn(S);
  if (S.mode === 'strongman' && !rep.collapse && S.meters.legit < 25 && rng(S, 'coup' + S.turn)() < 0.25) rep.collapse = 'legit_low';
  const sign = n => (n > 0 ? '+' : '') + n;
  const bits = [];
  for (const m of METERS) if (rep.deltas[m]) bits.push(`${METER_NAME[m]} ${sign(rep.deltas[m])}`);
  if (rep.deltas.treasury) bits.push(`Treasury ${sign(rep.deltas.treasury)}`);
  log('cash', `End of quarter. Income and standing policies: ${bits.join(', ') || 'no change'}.`);
  if (rep.mood !== rep.moodBefore) log('globe', `The world mood ${MOODS.indexOf(rep.mood) > MOODS.indexOf(rep.moodBefore) ? 'worsened' : 'improved'} to ${rep.mood.toUpperCase()}.`);
  if (S.debtTurns === 1) log('warn', 'We are in debt and paying interest on it. Four quarters in debt, or a debt of 600, and the government defaults.', null, true);
  if (rep.collapse) return collapseEnding(rep.collapse);
  if (S.turn >= S.endAt) {
    if (S.mode !== 'term') return finalEnding();
    S.ts.queue = [{ kind: 'card', id: S.term === 2 ? 'M5' : 'L6' }];
    return nextInQueue();
  }
  S.turn++;
  startQuarter();
}

const SEAT_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];
function lobbyPlay() {
  const { src, o, total } = ui.view;
  const c = CONFIG.lobby;
  const r = rng(S, 'lobby');
  const seats = [];
  for (let i = 0; i < 12; i++) {
    const owner = i < 5 ? STATE_IDS[i] : null;
    let st = 'grey';
    if (owner && S.rel[owner] >= 3) st = 'green';
    if (owner && S.rel[owner] <= -3) st = 'orange';
    seats.push({ st, owner, until: 0 });
  }
  const L = ui.lobby = { seats, elapsed: 0, nextAt: c.gapMin + r() * (c.gapMax - c.gapMin), last: performance.now(), ended: false, timer: null };
  ui.view = { name: 'lobby', src, o, total };
  const faceOf = st => ({ grey: 'calm', white: 'shocked', green: 'happy', orange: 'angry' }[st]);
  desk(`<div class="box">
    <div class="timer"><span id="ltime">TIME ${total}</span><span class="c-green" id="lfor">VOTES 0 / ${c.need}</span></div>
    <div class="seats" id="seats">${seats.map((s, i) => `<button class="seat" type="button" data-act="seat" data-arg="${i}" data-key="${SEAT_KEYS[i]}">${face(s.owner ? 'state:' + s.owner : 'del:' + i, 64, faceOf(s.st))}<span>${SEAT_KEYS[i]} ${s.owner ? CONTENT.states[s.owner].short.toUpperCase() : 'SEAT ' + (i + 1)}</span></button>`).join('')}</div>
    <div class="prompt"><button class="btn" type="button" data-act="lobbyStop" data-key="s">S. Call the vote now</button><span class="c-muted">Delegates that light up are undecided. Win them before they turn away.</span></div></div>`);
  const ayes = () => seats.filter(s => s.st === 'green').length;
  const paint = () => {
    seats.forEach((s, i) => {
      const b = document.querySelector(`.seat[data-arg="${i}"]`);
      if (!b) return;
      const cls = 'seat ' + (s.st === 'grey' ? '' : s.st);
      if (b.className !== cls) {
        b.className = cls;
        const cv = b.querySelector('canvas');
        cv.dataset.face = faceOf(s.st);
        drawPerson(cv, personFor(cv.dataset.person), cv.dataset.face, false);
      }
    });
    $('ltime').textContent = 'TIME ' + Math.max(0, Math.ceil(total - L.elapsed / 1000));
    $('lfor').textContent = `VOTES ${ayes()} / ${c.need}`;
  };
  L.hit = i => {
    if (L.ended) return;
    if (seats[i].st === 'white') { seats[i].st = 'green'; SFX.positive(); paint(); check(); }
  };
  const check = () => {
    const open = seats.some(s => s.st === 'grey' || s.st === 'white');
    if (ayes() >= c.need || L.elapsed >= total * 1000 || !open) end();
  };
  const end = () => {
    if (L.ended) return;
    L.ended = true;
    clearInterval(L.timer);
    const passed = ayes() >= c.need;
    S.minigame = { played: true, passed, ayes: ayes() };
    finish(src, o, { passed });
  };
  L.stop = () => { L.elapsed = total * 1000; check(); };
  L.timer = setInterval(() => {
    const now = performance.now();
    if (ui.modal) { L.last = now; return; }
    if (ui.view.name !== 'lobby') { clearInterval(L.timer); return; }
    L.elapsed += now - L.last;
    L.last = now;
    for (const s of seats) if (s.st === 'white' && L.elapsed >= s.until) s.st = 'orange';
    if (L.elapsed >= L.nextAt) {
      const greys = seats.filter(s => s.st === 'grey');
      if (greys.length) { const s = greys[Math.floor(r() * greys.length)]; s.st = 'white'; s.until = L.elapsed + c.windowMs; SFX.select(); }
      L.nextAt = L.elapsed + c.gapMin + r() * (c.gapMax - c.gapMin);
    }
    paint();
    check();
  }, 50);
}

function policyNote(p) {
  const bits = [];
  for (const m of METERS) if (p[m]) bits.push(`${METER_NAME[m]} ${p[m] > 0 ? '+' : ''}${p[m]}`);
  if (p.treasury) bits.push(`Treasury ${p.treasury > 0 ? '+' : ''}${p.treasury}`);
  return (bits.length ? bits.join(', ') + ' per quarter. ' : '') + p.note;
}

function act(name, arg, el) {

function bindInput() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'pick') return;
    e.preventDefault();
    act(el.dataset.act, el.dataset.arg, el);
  });
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-hover]');
    if (el && ui.view && ui.view.name === 'card' && ui.hover !== +el.dataset.hover) showPreview(ui.view.src, +el.dataset.hover);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-hover]');
    if (el && !el.contains(e.relatedTarget) && ui.view && ui.view.name === 'card') showPreview(ui.view.src, ui.view.picked);
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest('[data-hover]');
    if (el && ui.view && ui.view.name === 'card') showPreview(ui.view.src, +el.dataset.hover);
  });
  document.addEventListener('keydown', e => {
    unlockAudio();
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = e.target.tagName;
    const k = e.key.toLowerCase();
    if (ui.modal) {
      if (k === 'escape') { e.preventDefault(); ui.modal === 'main' ? closeModal() : openModal('main'); return; }
      if (tag === 'INPUT') return;
      const b = $('mbody').querySelector(`[data-key="${k}"]`);
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    if ((k === 'enter' || k === ' ') && e.target.classList && e.target.classList.contains('choice') && !e.target.classList.contains('picked')) { e.preventDefault(); e.target.click(); return; }
    if (tag === 'INPUT') {
      if (k === 'escape') { e.preventDefault(); openModal('main'); }
      else if (k === 'enter' && ui.view && ui.view.name === 'setup') { e.preventDefault(); act('toShop'); }
      return;
    }
    if (k === 'escape' && stageOpen() && ui.view && ['actions', 'country', 'world', 'ops'].includes(ui.view.name)) { e.preventDefault(); closeStage(); return; }
    if (k === 'escape' || k === 'p') { e.preventDefault(); openModal('main'); return; }
    if (k === 'g') { e.preventDefault(); openModal('glossary'); return; }
    if ((k === 'enter' || k === ' ') && tag === 'BUTTON' && !e.target.dataset.key) return;
    if ((k === 'enter' || k === ' ') && e.target.classList.contains('gl')) { e.preventDefault(); act('gloss', e.target.dataset.arg); return; }
    const key = k === ' ' || k === 'enter' ? 'space' : k;
    const b = $('view').querySelector(`[data-key="${CSS.escape(key)}"]:not([disabled])`);
    if (b) { e.preventDefault(); b.click(); }
  });
  $('mclose').addEventListener('click', () => closeModal());
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
}

function diffState(b) {
  const d = {};
  for (const m of METERS) if (S.meters[m] !== b.meters[m]) d[m] = S.meters[m] - b.meters[m];
  if (S.treasury !== b.treasury) d.treasury = S.treasury - b.treasury;
  for (const k of ASSETS) if (S.assets[k] !== b.assets[k]) (d.assets = d.assets || {})[k] = S.assets[k] - b.assets[k];
  for (const k of STATE_IDS) if (S.rel[k] !== b.rel[k]) (d.rel = d.rel || {})[k] = S.rel[k] - b.rel[k];
  return d;
}

function talk(cv, ms) {
  if (reducedMotion()) return;
  const p = personFor(cv.dataset.person), base = FACES[cv.dataset.face] || FACES.calm;
  const wrap = cv.parentElement;
  wrap.classList.add('talking');
  let n = 0;
  const t = setInterval(() => {
    if (!cv.isConnected || n * 120 > ms) { clearInterval(t); wrap.classList.remove('talking'); if (cv.isConnected) drawPerson(cv, p, cv.dataset.face, false); return; }
    drawPerson(cv, p, n % 2 ? base : Object.assign({}, base, { mouth: 'open' }), false);
    n++;
  }, 120);
}
function updateShell() {
  if (!S || !ui.shell || !$('top')) return;

function feedHtml() {
  let out = '', last = 0;
  for (const h of S.history) {
    if (h.t !== last) { out += `<div class="q">${quarterLabel(h.t)}</div>`; last = h.t; }
    const ic = h.i.startsWith('p:') ? `<canvas class="px ic" width="24" height="24" data-person="${h.i.slice(2)}" data-face="calm"></canvas>` : `<canvas class="px ic" width="16" height="16" data-ico="${h.i}"></canvas>`;

}

const TILE_COL = { sea: ['#2f6fb0', '#3b7cc0'], grass: ['#7cb35c', '#6fa650'], forest: ['#6fa650', '#2f6b3a'], hills: ['#a6a463', '#8b8a50'], mount: ['#8d8a92', '#f2f0ea'] };

function drawBuilding(c, b, f) {

// ---- TERMS ----
function quarterExtras() {
  const r = rng(S, 'move' + S.turn);
  if (S.turn > 1 && r() < 0.5) {
    const pool = CONTENT.moves.filter(m => !S.seenMoves.includes(m.id));
    if (pool.length) {
      const m = pick(r, pool);
      S.seenMoves.push(m.id);
      log('p:state:' + m.st, m.text, applyEffects(S, m.e, 'event'));
    }
  }
  for (const id of STATE_IDS) {
    if (S.rel[id] >= 5 && S.flags['al_offer_' + id] == null) {
      S.flags['al_offer_' + id] = S.turn;
      S.ts.queue.push({ kind: 'card', id: 'AL_' + id });
    }
    if (S.rel[id] <= -5 && S.flags['hostile_' + id] == null) {
      S.flags['hostile_' + id] = S.turn;
      S.concepts.Coercion = (S.concepts.Coercion || 0) + 1;
      const kind = pick(rng(S, 'hostile' + id), ['sanctions', 'troops', 'gas']);
      if (kind === 'troops') S.ts.queue.push({ kind: 'card', id: 'TB_' + id });
      else {
        S.pressure.push({ id, kind });
        log('p:state:' + id, kind === 'sanctions'
          ? `${LEADERS[id]} imposed trade sanctions on us. Treasury -40 every quarter until relations improve.`
          : `${LEADERS[id]} cut off our energy supplies. Expect cold winters until relations improve.`, null, true);
      }
    }
  }
  vorhalQuarter();
  if (S.treasury < -300 && S.flags.lenders == null) { S.flags.lenders = S.turn; S.ts.queue.push({ kind: 'card', id: 'D_lenders' }); }
  emergencyRoll();
  const i = S.secrets.findIndex(x => x.hot && !x.done && x.due <= S.turn);
  if (i >= 0) { S.secrets[i].done = true; S.ts.queue.push({ kind: 'leak', i }); }
}
function pressureTick() {
  S.pressure = S.pressure.filter(p => {
    const st = CONTENT.states[p.id];
    if (S.rel[p.id] > -3) { log('p:state:' + p.id, `${st.short} lifted its ${p.kind === 'sanctions' ? 'sanctions' : 'energy cut-off'}.`); return false; }
    if (p.kind === 'sanctions') log('stop', hasBuild('port') ? `Sanctions from ${st.short} bite, but our trade port keeps half the goods moving.` : `Sanctions from ${st.short} cost us again this quarter.`, applyEffects(S, { treasury: hasBuild('port') ? -20 : -40 }, 'policy'));
    else if (hasBuild('nuclear') || hasBuild('dam')) { if (S.turn % 4 === 1) log('bolt', `${st.short}'s energy cut-off does nothing: our own power stations keep homes warm.`); }

function pickEnding() {
  const m = S.meters, bal = balanceOf(S);
  const force = ['crack', 'censor', 'drill', 'sanction'].some(k => S.used[k]);
  if (S.flags.elections_postponed != null) return 'keeps';
  if (S.vorhal.peace) return 'bridge';
  if (S.vorhal.warResult === 'lostnorth') return 'lostnorth';
  if (S.vorhal.warResult === 'victory') return 'pyrrhic';
  if (STATE_IDS.every(id => S.rel[id] >= 2) && !S.ops.length && !force) return 'nobel';
  if (m.sov <= 30 && STATE_IDS.some(id => S.rel[id] >= 4)) return 'puppet';
  if (STATE_IDS.some(id => S.rel[id] <= -4) && m.power >= 55) return 'frozen';
  if (m.power >= 62 && STATE_IDS.filter(id => S.rel[id] >= 2).length >= 3) return 'regional';
  if (m.legit >= 66 && !force && !S.ops.length) return 'reformer';
  if (S.term === 2) return 'statesman';
  return bal < 12 ? 'steady' : bal <= 22 ? 'handover' : 'barely';
}
function finalEnding(force) {
  S.turnsSurvived = Math.min(S.turn, S.endAt);
  const key = force || (S.mode === 'strongman' ? 'keeps' : S.mode === 'epilogue' ? (balanceOf(S) <= 20 ? 'legacy' : 'legacy_lost') : pickEnding());
  const E = CONTENT.endings.survival[key];
  S.ending = { type: 'survival', key, title: E.title, balance: Math.round(balanceOf(S) * 10) / 10 };
  store.del(CONFIG.keys.save);

}

function vorhalTool(id) {
  const t = V_TOOLS.find(x => x.id === id), V = S.vorhal;
  if (!t || S.ts.queue.length || V.war || S.ts.done.includes('v_' + id) || S.ts.days < 1 || Object.keys(t.cost || {}).some(k => S.assets[k] < t.cost[k])) return SFX.warn();
  for (const k in (t.cost || {})) S.assets[k] -= t.cost[k];
  S.ts.days--;
  S.ts.done.push('v_' + id);
  const o = t.run(rng(S, 'vt' + S.turn + id));

}

        const acc = (A.keys.d || A.keys.ArrowRight ? 1 : 0) - (A.keys.a || A.keys.ArrowLeft ? 1 : 0);
        car.speed = clamp(car.speed + acc * dt * 0.8, 0.6, 1.5);
        nitro = Math.max(0, nitro - dt); nitroCd = Math.max(0, nitroCd - dt);
        const sp = (150 + A.t * 2) * car.speed * (nitro > 0 ? 1.7 : 1);
        dist += sp * dt / 60;
        spawn -= dt;
        if (spawn <= 0) { spawn = Math.max(0.4, 1.1 - A.t / 50); obs.push({ x: 500, y: ROAD[0] + 14 + Math.random() * (ROAD[1] - ROAD[0] - 28), k: Math.random() < 0.6 ? 'car' : 'block', vx: Math.random() < 0.6 ? 60 : 0 }); }
        for (const b of obs) { b.x -= (sp - b.vx) * dt; if (!b.hit && Math.abs(b.x - 60) < 22 && Math.abs(b.y - car.y) < 14) { b.hit = 1; car.speed = 0.6; A.strike('CRASH!'); A.burst(60, car.y, '#ffb547', 16, 90); } }
        copT -= dt;
        if (copT <= 0 && cops.length < 2) { copT = 8; cops.push({ x: -30, y: car.y }); A.pop(40, 40, 'POLICE BEHIND YOU', '#ff5d47'); }
        for (const p of cops) {
          p.x += ((nitro > 0 ? -90 : 30 + heat * 6) - (car.speed - 1) * 60) * dt;
          p.y += clamp(car.y - p.y, -dt * 60, dt * 60);
          if (!p.hit && Math.abs(p.x - 60) < 24 && Math.abs(p.y - car.y) < 14) { p.hit = 1; p.x -= 80; A.strike('RAMMED BY THE POLICE'); }
          if (p.hit && p.x < -60) p.gone = 1;
        }
        for (let i = cops.length - 1; i >= 0; i--) if (cops[i].x < -80 || cops[i].gone) cops.splice(i, 1);
        if (dist >= 100) A.finish(1 - A.alarm * 0.18);
      },
      draw(A) {
        const c = A.c;
        c.fillStyle = '#0e121c'; c.fillRect(0, 0, A.W, A.H);
        for (let i = 0; i < 12; i++) { const x = ((i * 53 - A.f * 2) % 540 + 540) % 540 - 40; c.fillStyle = '#1a2030'; c.fillRect(x, 20, 36, 50); c.fillStyle = (i + Math.floor(A.f / 20)) % 3 ? '#ffd56a' : '#1a2030'; c.fillRect(x + 8, 30, 4, 4); }
        c.fillStyle = '#2a2a30'; c.fillRect(0, ROAD[0], A.W, ROAD[1] - ROAD[0]);
        c.fillStyle = '#e3d39a'; c.fillRect(0, ROAD[0], A.W, 2); c.fillRect(0, ROAD[1] - 2, A.W, 2);
        for (let x = -((A.f * 9 * car.speed) % 30); x < A.W; x += 30) { c.fillStyle = '#d6d3da'; c.fillRect(x, 124, 14, 2); c.fillRect(x, 168, 14, 2); }
        for (const b of obs) {
          if (b.k === 'block') { for (let k = 0; k < 4; k++) { c.fillStyle = k % 2 ? '#f4f1e8' : '#d0443a'; c.fillRect(b.x - 16 + k * 8, b.y - 7, 8, 6); } c.fillStyle = '#7d7a86'; c.fillRect(b.x - 14, b.y - 1, 2, 8); c.fillRect(b.x + 12, b.y - 1, 2, 8); }
          else { c.fillStyle = '#5a6a8a'; c.fillRect(b.x - 16, b.y - 7, 32, 14); c.fillStyle = '#9cc8ee'; c.fillRect(b.x - 6, b.y - 5, 10, 10); }
        }
        for (const p of cops) { c.fillStyle = '#f4f1e8'; c.fillRect(p.x - 18, p.y - 8, 36, 16); c.fillStyle = '#1f3a6e'; c.fillRect(p.x - 6, p.y - 6, 14, 12); c.fillStyle = A.f % 6 < 3 ? '#d0443a' : '#3a7fd0'; c.fillRect(p.x - 2, p.y - 11, 6, 3); }
        if (nitro > 0) for (let k = 0; k < 4; k++) { c.fillStyle = k % 2 ? '#ffd56a' : '#ff5d47'; c.fillRect(40 - k * 6 - (A.f % 3) * 2, car.y - 2 + (k % 2), 6, 4); }
        c.fillStyle = '#14F53C'; c.fillRect(44, car.y - 8, 34, 16); c.fillStyle = '#0b5a20'; c.fillRect(54, car.y - 6, 14, 12); c.fillStyle = '#9cc8ee'; c.fillRect(66, car.y - 5, 4, 10); c.fillStyle = '#ffe678'; c.fillRect(78, car.y - 6, 2, 3); c.fillRect(78, car.y + 3, 2, 3);
        c.fillStyle = '#1a1e30'; c.fillRect(10, A.H - 10, A.W - 20, 4); c.fillStyle = '#3ee06a'; c.fillRect(10, A.H - 10, (A.W - 20) * Math.min(1, dist / 100), 4);
        A.text(nitroCd > 0 ? 'NITRO ' + Math.ceil(nitroCd) : 'NITRO READY', 10, 14, 6, nitroCd > 0 ? '#ffb547' : '#3ee06a');
      },
      score: A => (dist >= 100 ? 1 : dist / 140) - A.alarm * 0.12,
      summary: () => dist >= 100 ? 'ACROSS THE BORDER' : `${Math.round(dist)}% OF THE WAY`,
      stat: () => `TO THE BORDER ${Math.max(0, 100 - Math.floor(dist))}%`
    });
  }
};

function convoyGame() {
  const B = S.vorhal.blockade;
  ui.view = { name: 'convoy' };
  desk(`<div class="box ops">
    <div class="timer"><span>RUNNING THE BLOCKADE</span><span id="opclock"></span></div>
    <canvas class="px opcv" id="opcv" width="480" height="240" style="aspect-ratio:2/1"></canvas>
    <div class="opbar"><span id="opstat"></span><span class="c-green">STEER WITH THE MOUSE OR WASD · SPACE FOR A SMOKE SCREEN</span></div>
  </div>`);
  const slow = (S.assets.security >= 2 ? 0.85 : 1) * (STATE_IDS.some(id => S.flags['ally_' + id] != null) ? 0.8 : 1);
  const pats = [140, 230, 320, 390].map((x, i) => ({ x, y: 120, ph: Math.random() * 6, sp: (0.6 + Math.random() * 0.4) * slow, r: 34 }));
  const ship = { x: 30, y: 120 };
  let through = 0, lost = 0, n = 1, smoke = 0, smokeCd = 0;
  const A = arcade($('opcv'), {
    title: 'RUNNING THE BLOCKADE', secs: 60, keys: ['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'],
    rows: [['MOUSE OR WASD', 'STEER EACH CARGO SHIP ACROSS'], ['STAY OUT OF THE SEARCHLIGHTS', 'OR THE SHIP IS TURNED BACK'], ['SPACE', 'SMOKE SCREEN: A FEW SECONDS UNSEEN'], ['FIVE SHIPS', 'GET AS MANY TO OPEN SEA AS YOU CAN']],
    key(A, k) { if (k === ' ' && smokeCd <= 0) { smoke = 2.5; smokeCd = 9; A.pop(ship.x, ship.y - 16, 'SMOKE!', '#cfd6e6'); SFX.confirm(); } },
    update(A, dt) {
      smoke = Math.max(0, smoke - dt); smokeCd = Math.max(0, smokeCd - dt);
      const mx = (A.keys.d || A.keys.ArrowRight ? 1 : 0) - (A.keys.a || A.keys.ArrowLeft ? 1 : 0), my = (A.keys.s || A.keys.ArrowDown ? 1 : 0) - (A.keys.w || A.keys.ArrowUp ? 1 : 0);
      if (mx || my) { A.mouse.x = ship.x + mx * 40; A.mouse.y = ship.y + my * 40; }
      const dx = A.mouse.x - ship.x, dy = A.mouse.y - ship.y, d = Math.hypot(dx, dy), v = Math.min(d, dt * 70);
      if (d > 1) { ship.x += dx / d * v; ship.y += dy / d * v; }
      ship.x = clamp(ship.x, 10, 476); ship.y = clamp(ship.y, 30, 226);
      for (const p of pats) { p.cy = 120 + Math.sin(A.t * p.sp + p.ph) * 85; p.cx = p.x + Math.cos(A.t * p.sp * 0.7 + p.ph) * 18; }
      if (!smoke && pats.some(p => Math.hypot(p.cx - ship.x, p.cy - ship.y) < p.r)) { lost++; A.jolt(0.3); A.pop(ship.x, ship.y - 14, 'TURNED BACK', '#ff5d47'); SFX.warn(); next(A); }
      if (ship.x >= 470) { through++; A.burst(ship.x, ship.y, '#3ee06a', 16, 80); A.pop(ship.x - 30, ship.y - 14, 'THROUGH!', '#3ee06a'); SFX.positive(); next(A); }
    },
    over: () => n > 5,
    draw(A) {
      const c = A.c;
      c.fillStyle = '#0a1a30'; c.fillRect(0, 0, A.W, A.H);
      for (let y = 8; y < A.H; y += 12) for (let x = ((y * 5 + A.f) % 22); x < A.W; x += 22) { c.fillStyle = '#16365e'; c.fillRect(x, y, 8, 1); }
      c.fillStyle = '#6fa650'; c.fillRect(0, 0, 8, A.H); c.fillStyle = '#3ee06a'; c.fillRect(472, 0, 8, A.H);
      for (const p of pats) {
        c.fillStyle = 'rgba(255,230,120,.16)'; c.beginPath(); c.arc(p.cx, p.cy, p.r, 0, 6.28); c.fill();
        c.fillStyle = '#5a5f6e'; c.fillRect(p.cx - 7, p.cy - 16, 14, 32); c.fillStyle = '#3a3f4a'; c.fillRect(p.cx - 4, p.cy - 6, 8, 12); c.fillStyle = '#c23b3b'; c.fillRect(p.cx - 1, p.cy - 14, 2, 4);
      }
      c.fillStyle = '#f4f1e8'; c.fillRect(ship.x - 12, ship.y - 5, 24, 10); c.fillStyle = '#e8862a'; c.fillRect(ship.x - 6, ship.y - 9, 10, 4); c.fillStyle = '#3a7fd0'; c.fillRect(ship.x - 10, ship.y - 3, 4, 6); c.fillRect(ship.x - 4, ship.y - 3, 4, 6);
      if (smoke > 0) for (let k = 0; k < 10; k++) { c.fillStyle = 'rgba(200,205,215,.5)'; c.beginPath(); c.arc(ship.x - 10 + Math.sin(A.f / 5 + k) * 14, ship.y + Math.cos(A.f / 7 + k) * 12, 9, 0, 6.28); c.fill(); }
      A.text(`SHIP ${Math.min(5, n)} OF 5`, 14, 14, 7, '#ffffff'); A.text(smokeCd > 0 ? 'SMOKE ' + Math.ceil(smokeCd) : 'SMOKE READY', 466, 14, 7, smokeCd > 0 ? '#ffb547' : '#3ee06a', 'right');
    },
    score: () => through / 5,
    verdict: s => ['THE BLOCKADE HOLDS', 'A FEW GOT THROUGH', 'THE BLOCKADE IS LEAKING', 'THE BLOCKADE IS BROKEN'][s],
    summary: () => `${through} OF 5 SHIPS REACHED OPEN SEA`,
    hud: A => { $('opstat').textContent = `THROUGH ${through} · TURNED BACK ${lost}`; $('opclock').textContent = ''; },
    done: () => {
      const d = applyEffects(S, { treasury: 30 * through, legit: through >= 3 ? 2 : -1 }, 'event');
      S.threat = clamp(S.threat - through, 0, 100);
      if (through >= 4 && B && ++B.runs >= 2) return blockadeLift(`${through} of 5 ships got through again. Vorhal has given up the blockade: it was not working.`, d);
      log('port', `We ran the blockade: ${through} of 5 cargo ships got through.`, d);
      blockadeResult(false, `${through} of 5 cargo ships slipped past the patrols. ${through >= 4 ? 'One more run like that and the blockade is pointless.' : 'The rest were turned back at gunpoint.'}`, d);
    }
  });
  function next() { n++; ship.x = 30; ship.y = 60 + Math.random() * 120; A.mouse.x = ship.x; A.mouse.y = ship.y; }
  ui.field = { finish: s => { A.stop(); through = Math.round(s * 5); A.phase = 'end'; const d = applyEffects(S, { treasury: 30 * through }, 'event'); log('port', `We ran the blockade: ${through} of 5 cargo ships got through.`, d); blockadeResult(false, `${through} of 5 cargo ships slipped past the patrols.`, d); } };
}
</script>
