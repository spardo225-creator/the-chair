      effects: { power: 2, sov: -8, inter: 7, treasury: 150, rel: { karst: 2 } }, setFlags: ['karst_port'], tags: ['cooperative'], theory: [1, 2, 0],
      debrief: {
        explain: 'You accepted infrastructure that you could not afford alone, with a powerful neighbour holding the keys if things go wrong. It boosts development and trade, but it ties a strategic asset to another state\'s decisions.',
        parallel: 'In 2017, Sri Lanka leased its Hambantota port to a Chinese state-owned company for 99 years in exchange for about 1.1 billion dollars. It is often called an example of "debt-trap diplomacy", but researchers have argued that the lease was negotiated by Sri Lanka and that most of its debt was owed to other lenders.',
        think: 'To what extent is "debt-trap diplomacy" an accurate description of infrastructure lending?' } },
    { label: 'Accept only with a short lease and joint management.', cost: { influence: 1 },
      effects: { sov: -2, inter: 4, treasury: 60, rel: { karst: 1 } }, tags: ['cooperative'], theory: [1, 2, 1],
      debrief: {
        explain: 'You renegotiated to keep more control. You get a smaller, slower deal, but you protect your sovereignty and show that recipients can shape the terms of foreign investment.',
        parallel: 'In 2019, Malaysia renegotiated the East Coast Rail Link with its Chinese contractor, cutting the cost by about a third. Myanmar similarly scaled down the planned Kyaukphyu port project in 2018.',
        think: 'Evaluate whether renegotiation allows smaller states to benefit from great-power investment on their own terms.' } },
    { label: 'Refuse. Kessel Bay stays ours.',
      effects: { sov: 6, power: -1, inter: -3, treasury: -30, rel: { karst: -2 } }, tags: ['hostile'], theory: [2, 0, 2],
      debrief: {
        explain: 'You kept full sovereignty over a strategic asset. But the port is not built, exports stay where they are, and the region\'s most powerful state now sees you as unfriendly.',
        parallel: 'In 2018, Sierra Leone cancelled a planned Chinese-funded international airport near its capital, with its government arguing that the project was too expensive and unnecessary.',
        think: 'Discuss whether refusing foreign investment protects or harms a developing state\'s interests.' } }
  ],
  advice: {
    realist: 'A port that can host warships is not a business deal. It is a military question. Refuse, or at least keep the lease short.',
    liberal: 'Infrastructure links economies. Take it, but write the contract carefully.',
    constructivist: 'People will call it "Karst\'s port" within a year, whatever the lease says. Names matter.',
    finance: 'If the port earns what the engineers say, the lease clause never matters. Engineers are optimists. I am not.'
  }
},
{
  id: 'DS4', area: 'development', concept: 'Legitimacy', related: 'Sustainability', protest: true,
  actor: { name: 'Greenwake', type: 'NGO', icon: 'leaf' },
  title: 'Fuel Tax Friday', case: 'France\'s gilets jaunes protests, 2018',
  text: "To meet its climate pledge, {country} needs a carbon tax: about 18 cents more per litre of fuel. Greenwake says anything less is 'a betrayal of children'. Drivers' groups say it punishes rural people who have no buses and must drive to work. Last Friday, truckers blocked the ring road around {capital} in a 'slow protest'. Some wore reflective safety vests. Pictures of the vests are everywhere.",
  options: [
    { label: 'Impose the full carbon tax now.',
      effects: { power: 1, legit: -8, inter: 2, treasury: 120, rel: { alvenmark: 1 } }, theory: [1, 2, 1],
      debrief: {
        explain: 'You chose sustainability and revenue over short-term popularity. The tax works by making pollution expensive, but people who depend on cars feel targeted, and a policy that loses public consent can be reversed.',
        parallel: 'Sweden introduced a carbon tax in 1991 and gradually raised it to one of the highest in the world, while its economy continued to grow. It was phased in over many years and paired with other tax cuts.',
        think: 'To what extent must climate policies have public consent to succeed?' } },
    { label: 'Impose it, but return the money to poorer households as rebates.',
      effects: { legit: -2, inter: 1, treasury: 30 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You designed the policy around fairness. Rebates protect people on low incomes, so the tax changes behaviour without making the poor pay the most. It raises less money, and many people never notice the rebate.',
        parallel: 'Canada introduced a federal carbon price in 2019 and returned most of the revenue to households as rebates. The consumer charge remained politically contested, and it was reduced to zero in 2025.',
        think: 'Evaluate whether rebates can make environmental taxes fair.' } },
    { label: 'Drop the tax. Find the emissions cuts somewhere else.',
      effects: { legit: 5, inter: -3, treasury: -20, rel: { alvenmark: -1 } }, theory: [2, 0, 1],
      debrief: {
        explain: 'You listened to the protesters and backed down. You regain support at home, but you weaken your climate pledge and your reputation abroad, and Greenwake will not forget.',
        parallel: 'France\'s "gilets jaunes" (yellow vests) protests began in November 2018 over a planned fuel tax increase. After weeks of demonstrations, some violent, the government suspended the tax rise in December 2018.',
        think: 'Discuss the tension between sustainability goals and the legitimacy of governments that pursue them.' } }
  ],
  advice: {
    realist: 'Do not pick fights with truckers. They control the roads, and the roads control the cities.',
    liberal: 'Tax the carbon and send the money back. It is the textbook answer for a reason.',
    constructivist: 'People do not hate the tax. They hate feeling forgotten. Show them they are not, and they will accept more than you think.',
    finance: 'The full tax raises 120. The rebate version raises 30. Dropping it costs us 20. The planet does not show up on my spreadsheets, which is part of the problem.'
  }
},
{
  id: 'DS5', area: 'development', concept: 'Interdependence', related: 'Justice',
  actor: { name: 'Threadline Apparel', type: 'MNC', icon: 'factory' },
  title: 'The Factory Fire', case: 'Rana Plaza collapse, 2013',
  text: "A nine-storey garment factory in the Mollen industrial zone collapsed at 8:40 this morning. Rescuers have recovered 214 bodies so far. Cracks had appeared in the walls the day before; workers were told to return or lose a month's pay. The factory made clothing for Threadline Apparel, whose shirts sell in forty countries. Threadline says it is 'devastated' and also that strict new safety laws 'could make sourcing from {country} unviable'.",
  options: [
    { label: 'Pass strict safety laws with independent inspections.',
      effects: { power: -1, legit: 8, inter: -4, treasury: -80 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You used state authority to protect workers. Some factories will close or move abroad, costing jobs and investment. But you have declared that workers\' lives are not a competitive advantage, which strengthens legitimacy and justice.',
        parallel: 'After the 1911 Triangle Shirtwaist Factory fire in New York killed 146 garment workers, many of them young immigrant women, New York passed a wave of new fire safety and labour laws.',
        think: 'To what extent should states risk losing foreign investment to protect workers?' } },
    { label: 'Broker a binding agreement between brands, unions and factory owners.',
      effects: { legit: 4, inter: 4, treasury: -30 }, setFlags: ['accord_signed'], theory: [0, 3, 1],
      debrief: {
        explain: 'You brought non-state actors together to solve a problem the state could not solve alone. Brands pay for inspections, unions help enforce them. It shares responsibility, but it relies on companies keeping their promises.',
        parallel: 'After the Rana Plaza building collapsed in Bangladesh in April 2013, killing more than 1,100 garment workers, over 200 brands signed the legally binding Accord on Fire and Building Safety with trade unions, funding thousands of factory inspections.',
        think: 'Evaluate the role of multinational corporations in protecting workers\' rights in developing countries.' } },
    { label: 'Hold a day of mourning, but keep regulation light.',
      effects: { power: 2, legit: -10, inter: 3, treasury: 60 }, theory: [2, 1, 0],
      debrief: {
        explain: 'You protected jobs and investment by avoiding new costs for businesses. Threadline stays. But the families of the dead see a state that values exports over lives, and the next disaster will be blamed on you.',
        parallel: 'Five months before Rana Plaza, a fire at the Tazreen Fashions factory in Bangladesh killed at least 112 workers. Limited changes after that fire were widely criticised once Rana Plaza collapsed.',
        think: 'Discuss whether developing countries face a "race to the bottom" in labour standards.' } }
  ],
  advice: {
    realist: 'Our advantage is cheap labour. Throw that away and Threadline goes to the next country with cheap labour.',
    liberal: 'An agreement with the brands. They have the money and the reputations to lose. Make them part of the solution.',
    constructivist: 'Today our country\'s name appeared next to the word "collapse" on every screen in the world. What happens next decides whether that is who we are.',
    finance: 'Light regulation pays this quarter. The next collapse costs far more. I would rather pay for inspectors than funerals.'
  }
},
{
  id: 'DS6', area: 'development', concept: 'Legitimacy', related: 'Development', protest: true,
  actor: { name: 'Petrava Energy consortium', type: 'MNC', icon: 'factory' },
  title: 'Who Owns the Rain', case: 'Cochabamba water protests, 2000',
  text: "{capital}'s water system is a century old. A third of the water leaks from broken pipes, and the poorest districts get water only three days a week. A consortium led by Petrava Energy offers to take over the system for forty years: it would invest 400 million and fix the pipes, but water bills would rise by up to 35%. A coalition of neighbourhood groups has already painted a slogan on the main reservoir: 'THE RAIN IS NOT FOR SALE'.",
  options: [
    { label: 'Privatise the water system.',
      effects: { power: 1, sov: -3, legit: -8, inter: 4, treasury: 160 }, setFlags: ['water_privatised'], theory: [1, 2, 0],
      debrief: {
        explain: 'You brought in private capital to fix public infrastructure. The pipes may be repaired faster, but people who cannot pay higher bills may lose access to something many see as a human right, and anger can turn quickly.',
        parallel: 'In 2000, the Bolivian city of Cochabamba privatised its water system to a consortium linked to the US company Bechtel. Bills rose sharply, mass protests followed, and the government cancelled the contract within months.',
        think: 'To what extent should essential services like water be run by private companies?' } },
    { label: 'A public-private partnership with a legal price cap.',
      effects: { sov: -1, legit: 1, inter: 2, treasury: 50 }, theory: [1, 2, 1],
      debrief: {
        explain: 'You tried to combine private investment with public protection. Price caps protect consumers, but they also reduce the company\'s incentive to invest, so these deals need careful monitoring.',
        parallel: 'In 1997, Manila in the Philippines split its water system between two private concessions. Results were mixed: one company greatly expanded access, while the other struggled financially and was later restructured.',
        think: 'Evaluate whether public-private partnerships can deliver both efficiency and fairness.' } },
    { label: 'Keep water public and borrow to invest in it ourselves.',
      effects: { sov: 2, legit: 6, treasury: -120 }, theory: [0, 1, 2],
      debrief: {
        explain: 'You kept water as a public good under democratic control. People trust it, but the state must find the money itself, which means debt or cuts elsewhere.',
        parallel: 'In 2010, Paris brought its water services back into public ownership after decades of private contracts. The city reported savings and cut prices, though conditions differ greatly between a rich capital and a poor one.',
        think: 'Discuss whether access to water should be treated as a human right or a commodity.' } }
  ],
  advice: {
    realist: 'Water is security. Whoever controls the reservoir controls the capital. Keep it in our hands.',
    liberal: 'Private investment with public rules. Markets fix pipes; regulators keep prices fair.',
    constructivist: 'Read the slogan on the reservoir. People have already decided what water means to them.',
    finance: 'Privatising gives us 160. Keeping it public costs 120. That is a 280 swing. I just want everyone to see the number before they make a speech.'
  }
},
{
  id: 'DS7', area: 'development', concept: 'Power', related: 'Development',
  actor: { name: 'Corvan Mining', type: 'MNC', icon: 'pickaxe', state: 'karst' },
  title: 'White Gold', case: 'Indonesia\'s nickel ore export ban',
  text: "Geologists have confirmed huge lithium reserves under the Sarn salt flats, enough for millions of electric car batteries. Corvan Mining, backed by Karst investors, offers a 30-year partnership with a 20% royalty. Your national mining company says it could do the job itself, slowly. Your economists propose a third idea: ban the export of raw ore so that companies must build battery factories in {country}.",
  options: [
    { label: 'Nationalise the reserves. The state will mine them.',
      effects: { power: 6, sov: 6, legit: 2, inter: -6, treasury: -60, rel: { selene: -1, karst: -1 } }, theory: [3, 0, 1],
      debrief: {
        explain: 'You kept the resource under state control. It strengthens sovereignty and future power, but state companies often lack capital and expertise, and foreign investors may hesitate to come back.',
        parallel: 'In 2022, Mexico nationalised its lithium reserves and created a state company to develop them. Supporters called it economic sovereignty; critics warned that Mexico lacked the technology and capital to mine lithium quickly.',
        think: 'To what extent does controlling natural resources increase a state\'s power?' } },
    { label: 'Partner with Corvan on its terms.',
      effects: { power: 1, sov: -6, legit: -2, inter: 6, treasury: 180, rel: { karst: 1 } }, tags: ['cooperative'], theory: [0, 3, 0],
      debrief: {
        explain: 'You chose fast money and expertise from a multinational. The treasury fills, but most of the value is added abroad, and foreign investors gain influence over a strategic resource.',
        parallel: 'Chile, one of the world\'s largest lithium producers, has for decades let private companies such as SQM and Albemarle mine its lithium under contracts with a state agency, earning large royalties while debating how much control the state should have.',
        think: 'Evaluate the costs and benefits of foreign investment in a state\'s natural resources.' } },
    { label: 'Ban raw ore exports. Build the factories here.',
      effects: { power: 3, sov: 5, inter: -3, treasury: -80, rel: { selene: -1 } }, setFlags: ['ore_ban'], theory: [2, 0, 2],
      debrief: {
        explain: 'You used control over a resource to force development at home. It may build a new industry, but it costs money now and angers trading partners who rely on raw materials.',
        parallel: 'Indonesia banned exports of raw nickel ore (fully reinstated in 2020) to force companies to build processing plants locally. Investment in smelters rose sharply. The EU challenged the ban at the WTO, which ruled against Indonesia in 2022; Indonesia appealed.',
        think: 'Discuss whether export bans are a legitimate development strategy in a globalized economy.' } }
  ],
  advice: {
    realist: 'Lithium is the oil of this century. Never let another power hold the tap.',
    liberal: 'Partner with Corvan. Capital and expertise now, and an investor with an interest in our stability.',
    constructivist: 'For a century we sold raw materials and bought finished goods. The ban says we intend to be a different kind of country.',
    finance: 'Corvan pays us 180 now. The other two cost us money now and might pay more later. "Might" is a word I distrust.'
  }
},
{
  id: 'DS8', area: 'development', concept: 'Interdependence', related: 'Inequality',
  actor: { name: 'Alvenmark Health Service', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'The Doctors Are Leaving', case: 'WHO Code on recruiting health workers, 2010',
  text: "Last year, 340 of the 900 doctors who graduated from {country}'s medical schools left for jobs in Alvenmark, where pay is five times higher. Three rural hospitals have closed their maternity wards. Alvenmark's health service runs recruitment fairs in your universities and calls it 'a partnership'. Your health minister calls it 'harvesting'. The doctors themselves say they have student debts, and families to support.",
  options: [
    { label: 'Require new doctors to serve five years at home before leaving.',
      effects: { power: 2, sov: 4, legit: -5, inter: -2 }, theory: [2, 0, 1],
      debrief: {
        explain: 'You used state authority to keep public investment at home. Rural hospitals gain staff, but young doctors see it as limiting their liberty, and some may simply avoid studying medicine here.',
        parallel: 'Several countries, including some Indian states, require medical graduates of public colleges to serve for a set period or pay a large bond. Supporters say it keeps doctors where they are needed; critics say it is hard to enforce and unfair to graduates.',
        think: 'To what extent can a state limit its citizens\' freedom to work abroad?' } },
    { label: 'Negotiate a training-and-return agreement with Alvenmark.', cost: { influence: 1 },
      effects: { legit: 3, inter: 5, treasury: 40, rel: { alvenmark: 1 } }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You turned a one-way flow into a shared arrangement: Alvenmark helps fund training and some doctors return with new skills. It depends on Alvenmark honouring its side of the bargain.',
        parallel: 'The 2010 WHO Global Code of Practice on the International Recruitment of Health Personnel asks rich countries not to actively recruit from countries with severe health worker shortages, and encourages agreements that benefit both sides. It is voluntary.',
        think: 'Evaluate whether voluntary international codes can reduce inequality between rich and poor states.' } },
    { label: 'Let them go. Their remittances will help the economy.',
      effects: { legit: -6, inter: 4, treasury: 90 }, theory: [1, 2, 0],
      debrief: {
        explain: 'You accepted the market. Money sent home by workers abroad, called remittances, supports many families. But the people left behind lose medical care, and inequality between your country and Alvenmark grows.',
        parallel: 'In the 2000s, large numbers of nurses and doctors from countries such as Zimbabwe and Malawi moved to the UK. Remittances helped families, while health systems at home faced severe shortages.',
        think: 'Discuss whether the movement of skilled workers from poor to rich countries is a form of inequality.' } }
  ],
  advice: {
    realist: 'We paid to train them. Make them serve. A state that cannot keep its doctors cannot keep its people healthy or loyal.',
    liberal: 'Negotiate. Migration can benefit both sides if the rules are right.',
    constructivist: 'If our brightest people believe their future is elsewhere, we have a bigger problem than doctors.',
    finance: 'Remittances bring in 90 a quarter. A closed maternity ward costs us something I cannot put on a spreadsheet, and I hate that.'
  }
},
{
  id: 'DS9', area: 'development', concept: 'Sovereignty', related: 'Development',
  actor: { name: 'The Commonwealth of Alvenmark', type: 'state', icon: 'handshake', state: 'alvenmark' },
  title: 'Aid With Strings', case: 'The Marshall Plan, 1948',
  text: "Alvenmark offers the largest aid package in your history: new rural roads, 200 schools, and a water treatment plant for the south. The condition: an international anti-corruption commission with power to investigate any official, including ministers. Transparency groups are thrilled. Several members of your cabinet have suddenly discovered urgent business abroad. Alvenmark's ambassador wants an answer before her parliament's budget vote.",
  options: [
    { label: 'Accept the aid and the commission.',
      effects: { power: -3, sov: -6, legit: 6, inter: 4, treasury: 160, rel: { alvenmark: 2 } }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You accepted outside oversight in exchange for development. It may reduce corruption and builds trust, but foreign-backed investigators now have power over your officials, a real limit on sovereignty.',
        parallel: 'From 2007, the International Commission against Impunity in Guatemala (CICIG), backed by the UN, investigated corruption cases that led, in 2015, to the resignation and arrest of a sitting president. It became one of the best-known examples of internationally supported anti-corruption work.',
        think: 'To what extent is foreign oversight an acceptable price for development aid?' } },
    { label: 'Accept the money, then stall the commission in committee.',
      effects: { power: 2, legit: -4, treasury: 120, rel: { alvenmark: -1 } }, setFlags: ['monitors_stalled'], theory: [3, 0, 0],
      debrief: {
        explain: 'You took the benefits while avoiding the obligations. It works for now, but donors notice, and when the commission never starts, your reputation as a partner suffers.',
        parallel: 'In 2019, Guatemala\'s government declined to renew CICIG\'s mandate after the commission investigated people close to the president, ending its work despite its popularity with many Guatemalans.',
        think: 'Evaluate why governments may accept international commitments they do not intend to keep.' } },
    { label: 'Refuse. We will not be supervised by foreigners.',
      effects: { power: 1, sov: 7, legit: -1, inter: -4, rel: { alvenmark: -2 } }, tags: ['hostile'], theory: [2, 0, 2],
      debrief: {
        explain: 'You protected sovereignty and national pride, but gave up roads and schools that your citizens needed. Refusing aid sends a message of independence, and a bill that the poorest regions pay.',
        parallel: 'In 1947, the Soviet Union refused to take part in the US-funded Marshall Plan, seeing its conditions on economic cooperation as Western interference, and pressured Czechoslovakia and Poland to refuse it too.',
        think: 'Discuss whether aid with conditions is a form of soft power.' } }
  ],
  advice: {
    realist: 'Aid is never charity. It is influence purchased at a discount. Either refuse it or take it and give nothing back.',
    liberal: 'Accept it all. A clean government is a strong government, and donors invest where they trust.',
    constructivist: 'Watch which ministers left the country this morning. They have told you what the commission would find.',
    finance: 'One hundred and sixty is a great deal of money. The commission might find where the last hundred and sixty went.'
  }
},
{
  id: 'DS10', area: 'development', concept: 'Sovereignty', related: 'Sustainability',
  actor: { name: 'Greenwake / Alvenmark', type: 'NGO', icon: 'leaf', state: 'alvenmark' },
  title: 'Forest or Exports', case: 'EU-Mercosur deal and Amazon deforestation',
  text: "Satellite images published by Greenwake show 2,400 square kilometres of the Valla rainforest cleared last year, mostly for cattle and soy farms. Alvenmark's parliament has voted to block its trade deal with the Southern Basin Union unless {country} acts. Ranchers say the forest is theirs to farm and that Alvenmark cut down its own forests centuries ago. Exports of beef and soy make up a fifth of your earnings.",
  options: [
    { label: 'Pass a strict law against deforestation, with heavy fines.',
      effects: { power: -2, legit: -1, inter: 6, treasury: -70, rel: { alvenmark: 2 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You chose sustainability and integration with your trading partners. Farmers lose income and some voters resent rules shaped by foreign pressure, but you protect a shared resource and keep markets open.',
        parallel: 'Between 2004 and 2012, Brazil cut Amazon deforestation by around 80% through stricter enforcement, protected areas and satellite monitoring, while its agricultural exports kept growing.',
        think: 'To what extent can trade pressure from other states promote sustainability?' } },
    { label: 'Set up satellite monitoring and phase rules in gradually.', cost: { security: 1 },
      effects: { sov: 1, legit: 2, inter: 3, treasury: -20, rel: { alvenmark: 1 } }, theory: [1, 2, 1],
      debrief: {
        explain: 'You used information to make enforcement possible and gave farmers time to adjust. It is slower than critics want, but it keeps the state in control of how and when the rules apply.',
        parallel: 'Brazil\'s space research institute (INPE) runs the PRODES and DETER satellite systems, which measure deforestation and send near real-time alerts to enforcement agencies.',
        think: 'Evaluate the role of technology in enforcing environmental laws.' } },
    { label: 'Call it foreign interference. Our forest, our decision.',
      effects: { power: 1, sov: 7, legit: 2, inter: -6, rel: { alvenmark: -3 } }, tags: ['hostile'], theory: [3, 0, 1],
      debrief: {
        explain: 'You defended sovereignty over your own territory and pointed to the hypocrisy of rich countries. Many people agree. But the trade deal stalls, and the forest\'s role in the global climate makes it hard to call it a purely national matter.',
        parallel: 'In 2019, during record Amazon fires, Brazil\'s government at first rejected an offer of 20 million dollars from the G7 to fight them, calling it interference. The EU-Mercosur trade agreement, agreed in principle that year, stalled partly over concerns about deforestation.',
        think: 'Discuss whether global environmental problems limit state sovereignty over natural resources.' } }
  ],
  advice: {
    realist: 'They cut their forests to get rich. Now they want to stop us doing the same. Say no.',
    liberal: 'Protect the forest and keep the deal. Trade agreements are how we make shared problems everyone\'s business.',
    constructivist: 'The world now sees the forest as everyone\'s. We can fight that idea or use it.',
    finance: 'A fifth of our exports depend on clearing that forest. A fifth of our exports also depend on Alvenmark buying them. Lovely.'
  }
},
{
  id: 'DS11', area: 'development', concept: 'Interdependence', related: 'Inequality',
  actor: { name: 'Field Medics International / Concord', type: 'NGO', icon: 'lantern' },
  title: 'Too Few Vials', case: 'COVAX and vaccine nationalism',
  text: "A new respiratory virus is spreading through the region. A vaccine exists, but rich countries have pre-ordered most of this year's supply. Field Medics International reports that hospitals in {capital} are at 140% capacity. Three options are on your desk: join the Concord's shared vaccine pool, outbid others for a private deal with the manufacturer, or join a campaign to suspend the vaccine patent so it can be made locally.",
  options: [
    { label: 'Join the shared procurement pool.',
      effects: { power: -1, legit: -2, inter: 6, treasury: -40 }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You bet on multilateralism: doses shared fairly according to need. It is cheap and principled, but slow, and your citizens watch richer countries vaccinate first while they wait.',
        parallel: 'COVAX, launched in 2020, aimed to share COVID-19 vaccines fairly between countries. It delivered over a billion doses, but supplies were delayed for many months because wealthy states had already bought large amounts directly from manufacturers.',
        think: 'To what extent can multilateral institutions overcome inequality in a global health crisis?' } },
    { label: 'Pay a premium for a private deal with the manufacturer.',
      effects: { power: 2, legit: 7, inter: -3, treasury: -150, rel: { selene: -1 } }, theory: [3, 0, 0],
      debrief: {
        explain: 'You put your own citizens first. It works fast and voters are grateful, but you paid heavily and helped push poorer countries further back in the queue, an example of vaccine nationalism.',
        parallel: 'During COVID-19, several wealthy countries secured early vaccine supplies through bilateral deals. Israel, for example, was reported to have paid above the standard price for early Pfizer doses in exchange for sharing vaccination data.',
        think: 'Evaluate whether "vaccine nationalism" is a justified response to a pandemic.' } },
    { label: 'Campaign for a patent waiver and build local production.', cost: { influence: 1 },
      effects: { power: -3, legit: 5, inter: 3, treasury: -60 }, theory: [0, 1, 3],
      debrief: {
        explain: 'You challenged the rules of the system itself. Patents reward innovation, but in a crisis they can block access. Your campaign builds a reputation and local capacity, though production will take time.',
        parallel: 'In October 2020, India and South Africa proposed a waiver of intellectual property rules on COVID-19 vaccines at the World Trade Organization. After long debate, a narrower agreement was adopted in June 2022.',
        think: 'Discuss whether intellectual property rules contribute to global health inequality.' } }
  ],
  advice: {
    realist: 'Buy the vaccines. Our people first. Nobody will remember who was fair; they will remember who survived.',
    liberal: 'The pool. If every country grabs, the virus mutates in the places left behind, and comes back to all of us.',
    constructivist: 'Patents are rules people wrote. People can rewrite them. We can help make that idea normal.',
    finance: 'The private deal costs 150. I would like it noted that I said that number out loud and nobody fainted.'
  }
}
);

CONTENT.cards.push(
{
  id: 'PC1', area: 'conflict', concept: 'Power', related: 'Conflict',
  actor: { name: 'The Federation of Karst', type: 'state', icon: 'fortress', state: 'karst' },
  title: 'Shots in the Valley', case: 'Galwan Valley clash, 2020',
  text: "At 3 a.m., a Karst infantry company crossed into the Orin Valley, a strip of high pasture both countries have claimed since 1931. They have set up tents and a flag 800 metres inside the line your maps show. Your border post reports shouting, stones thrown, and two of your soldiers injured. No shots yet. Karst's foreign ministry says its troops are 'on Karst soil, as always'. Your generals want orders by noon.",
  options: [
    { label: 'Deploy troops to the valley and hold the line.', cost: { security: 1 },
      effects: { power: 7, sov: 4, legit: 2, inter: -6, rel: { karst: -3 }, mood: 1 }, setFlags: ['valley_fight'], tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You answered force with force. Deterrence can stop a stronger state from taking more, and your citizens rally behind you. But each side now has soldiers face to face in the dark, and small clashes can escalate in ways nobody planned.',
        parallel: 'In June 2020, Indian and Chinese troops clashed in the disputed Galwan Valley in the Himalayas, fighting with clubs and stones because of agreements not to use firearms near the border. Twenty Indian soldiers died; China later acknowledged four deaths.',
        think: 'To what extent does military deterrence prevent conflict between neighbouring states?' } },
    { label: 'Take the dispute to the Concord Security Council.', cost: { influence: 1 },
      effects: { power: -4, legit: 6, inter: 3, rel: { karst: -1 } }, theory: [0, 3, 1],
      debrief: {
        explain: 'You used international institutions instead of force. It shows you respect international law and builds support abroad, but the Council moves slowly, and a great power may block action. Meanwhile the tents stay in the valley.',
        parallel: 'When Argentina invaded the Falkland Islands in 1982, the UK went to the UN Security Council, which passed Resolution 502 demanding Argentina withdraw. Argentina did not, and the dispute was settled by war.',
        think: 'Evaluate the effectiveness of the Security Council in resolving territorial disputes.' } },
    { label: 'Open quiet back-channel talks with Karst\'s generals.',
      effects: { power: -2, sov: -2, legit: -1, inter: 2 }, setFlags: ['backchannel'], theory: [2, 1, 0],
      debrief: {
        explain: 'You chose private talks to let both sides step back without losing face. It avoids escalation, but citizens may see silence as weakness, and Karst may test you again if it thinks you will not resist.',
        parallel: 'During the 1962 Cuban Missile Crisis, US Attorney General Robert Kennedy and Soviet ambassador Anatoly Dobrynin held secret talks that helped reach a deal, including a private promise to remove US missiles from Turkey.',
        think: 'Discuss the role of secret diplomacy in preventing conflict.' } }
  ],
  advice: {
    realist: 'Send the troops. If we let them keep 800 metres today, they will want 8 kilometres tomorrow.',
    liberal: 'The Council. Make this a question of law, not muscle. That is the only fight a smaller state can win.',
    constructivist: 'Both sides think the valley is theirs because their maps say so. Maps are stories too.',
    finance: 'A war in the mountains would bankrupt us by spring. A phone call costs nothing. I am a big believer in phone calls.'
  }
},
{
  id: 'PC2', area: 'conflict', concept: 'Peace', related: 'Violence',
  actor: { name: 'Free Highlands Front', type: 'armed', icon: 'rifle' },
  title: 'The Highlands', case: 'Colombia\'s peace agreement with the FARC, 2016',
  text: "The Free Highlands Front has fought the government from the northern mountains for thirty-one years. It began as a movement of landless farmers; it now also taxes smuggling routes. Last week its fighters ambushed a police convoy, killing six. Its commander has also sent a letter, through a priest, offering talks. The army says one more offensive could finish the Front. It has said that before.",
  options: [
    { label: 'Launch a full military offensive in the mountains.', cost: { security: 1 },
      effects: { power: 7, sov: 4, legit: -5, treasury: -60 }, setFlags: ['offensive'], theory: [3, 0, 0],
      debrief: {
        explain: 'You used direct force to end an armed challenge to the state. It may weaken the Front, but offensives in populated areas often cause civilian deaths and new grievances, which armed groups use to recruit.',
        parallel: 'In 2009, Sri Lanka\'s army defeated the Liberation Tigers of Tamil Eelam after a 26-year civil war. The final offensive ended the war, but a UN panel later reported that tens of thousands of civilians may have been killed in its last months.',
        think: 'To what extent can military force produce lasting peace?' } },
    { label: 'Accept the offer of peace talks.',
      effects: { power: -5, legit: 2, inter: 3, rel: { alvenmark: 1 } }, setFlags: ['peace_talks'], theory: [0, 2, 2],
      debrief: {
        explain: 'You treated an armed group as a negotiating partner. Talks could end decades of violence, but many citizens, especially victims, see it as rewarding killers, and a deal must eventually win public support.',
        parallel: 'After four years of talks, Colombia signed a peace agreement with the FARC rebels in 2016. Voters narrowly rejected it in a referendum, 50.2% to 49.8%. A revised agreement was then approved by Congress.',
        think: 'Evaluate whether governments should negotiate with armed groups.' } },
    { label: 'Offer development and amnesty to fighters who lay down arms.', cost: { aid: 1 },
      effects: { power: -2, legit: 5, inter: 1, treasury: -50 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You addressed the causes of the conflict: poverty and exclusion in the highlands. This is about positive peace, not just stopping the fighting. It is slow and costly, and hard-line fighters may refuse.',
        parallel: 'The 2005 Helsinki peace agreement in Aceh, Indonesia, ended nearly thirty years of conflict. It combined amnesty for rebels, money to help fighters return to civilian life, and wide local self-government.',
        think: 'Discuss the difference between negative peace and positive peace using this case.' } }
  ],
  advice: {
    realist: 'Finish them. A state that negotiates with armed groups invites every grievance to pick up a rifle.',
    liberal: 'Talk. Thirty-one years of fighting has not worked. A deal with guarantees might.',
    constructivist: 'The Front exists because the highlands feel like a different country. Make them feel part of this one.',
    finance: 'The offensive costs 60 and comes back every few years. Development costs 50 once, and then perhaps never again.'
  }
},
{
  id: 'PC3', area: 'conflict', concept: 'Sovereignty', related: 'Responsibility to Protect',
  actor: { name: 'Concord Security Council', type: 'IGO', icon: 'globe', state: 'drevania' },
  title: 'Never Again, Again', case: 'Rwanda 1994, R2P 2005, Libya 2011',
  text: "Lantern Watch has evidence of mass killings in Drevania's western province: militias are going door to door, and radio broadcasts call one ethnic group 'weeds'. The Concord Security Council, where you hold a temporary seat, is voting on a resolution authorising members to 'use all necessary means' to protect civilians. Drevania's government calls it an invasion plan. Karst says it will abstain. Your vote could decide it.",
  options: [
    { label: 'Vote yes and contribute troops to the mission.', cost: { security: 1 },
      effects: { power: -2, sov: -3, legit: 8, inter: 5, rel: { drevania: -2, alvenmark: 2 } }, setFlags: ['intervened'], theory: [0, 3, 2],
      debrief: {
        explain: 'You acted on the Responsibility to Protect. Your soldiers may save lives, and you show that "never again" means something. But your troops are now at risk, and interventions can grow in ways the original resolution never intended.',
        parallel: 'In 2005, world leaders agreed the Responsibility to Protect (R2P), partly in response to the 1994 genocide in Rwanda, when the world failed to stop the killing of around 800,000 people. R2P was cited when the Security Council authorised action in Libya in 2011.',
        think: 'To what extent does the Responsibility to Protect limit state sovereignty?' } },
    { label: 'Vote yes, but send nothing.',
      effects: { legit: 2, inter: 2, rel: { drevania: -1 } }, theory: [2, 2, 0],
      debrief: {
        explain: 'You supported the principle without paying the price. Your vote helps the resolution pass, but others take the risks. It protects your soldiers and leaves you open to the charge of hypocrisy.',
        parallel: 'Security Council Resolution 1973 on Libya in 2011 passed with 10 votes in favour and 5 abstentions. Many states that supported it did not contribute forces, while a smaller coalition led the air campaign.',
        think: 'Evaluate whether states have a duty to act on the principles they vote for.' } },
    { label: 'Vote no. Drevania\'s sovereignty must be respected.',
      effects: { power: 2, sov: 5, legit: -7, inter: -3, rel: { alvenmark: -2, drevania: 2 } }, setFlags: ['blocked_r2p'], theory: [3, 0, 1],
      debrief: {
        explain: 'You defended non-intervention, the rule that states should not interfere inside other states. Many smaller states fear that humanitarian language can hide other motives. But if the killing continues, your vote will be remembered.',
        parallel: 'After the Libya intervention went beyond protecting civilians to regime change, Russia and China repeatedly vetoed Security Council resolutions on Syria from 2011 onward, citing sovereignty and the Libya experience.',
        think: 'Discuss whether the principle of non-intervention protects or endangers civilians.' } }
  ],
  advice: {
    realist: 'This is not our war. Soldiers die for national interests, not for resolutions.',
    liberal: 'Vote yes and send troops. The Council works only if members are willing to back it with action.',
    constructivist: 'The norm of protecting civilians exists only as long as states act on it. Our vote is part of building it, or abandoning it.',
    finance: 'A battalion abroad costs money every month. Doing nothing costs nothing, this year. History sends its bills later.'
  }
},
{
  id: 'PC4', area: 'conflict', concept: 'Power', related: 'Violence',
  actor: { name: 'The Auric Directorate', type: 'state', icon: 'crown', state: 'auric' },
  title: 'Rifles for Sale', case: 'Arms Trade Treaty and UK arms exports ruling, 2019',
  text: "The Directorate wants to buy 40,000 rifles from {country}'s state arms factory in Varnhold, an order worth more than the factory has earned in five years. It would save 1,200 jobs. Lantern Watch has sent you photographs of Auric riot police firing on protesters last spring with rifles of the same model, bought from someone else. The Directorate's minister says the weapons are 'for border security only'.",
  options: [
    { label: 'Sign the contract.',
      effects: { power: 3, legit: -6, inter: 2, treasury: 160, rel: { auric: 2, alvenmark: -1 } }, setFlags: ['arms_sold'], tags: ['cooperative'], theory: [3, 0, 0],
      debrief: {
        explain: 'You chose jobs, revenue and a closer relationship with a powerful state. But arms sales are also political choices: if these rifles are used against civilians, your state shares some responsibility for the violence.',
        parallel: 'In June 2019, the UK Court of Appeal ruled that the government had acted unlawfully by licensing arms exports to Saudi Arabia without properly assessing the risk that they might be used in breaches of humanitarian law in Yemen.',
        think: 'To what extent are arms-exporting states responsible for how their weapons are used?' } },
    { label: 'Sell, but only with strict end-use monitoring.', cost: { security: 1 },
      effects: { power: 1, legit: -1, treasury: 90, rel: { auric: 1 } }, theory: [1, 2, 0],
      debrief: {
        explain: 'You tried to sell responsibly by checking where the weapons go. Monitoring adds some protection and keeps some revenue, but it is hard to enforce inside a closed authoritarian state.',
        parallel: 'The 2014 Arms Trade Treaty requires states to assess whether exported weapons could be used for serious human rights violations. The US "Blue Lantern" programme carries out checks on how some exported weapons are used after delivery.',
        think: 'Evaluate whether end-use monitoring makes arms sales ethically acceptable.' } },
    { label: 'Refuse the order.',
      effects: { power: -2, legit: 6, treasury: -40, rel: { auric: -2, alvenmark: 1 } }, tags: ['hostile'], theory: [0, 1, 3],
      debrief: {
        explain: 'You put human rights above profit. You lose jobs and revenue, and the Directorate will probably buy rifles elsewhere. But you avoid complicity, and you show that some trade is not acceptable.',
        parallel: 'In 2018, after the killing of journalist Jamal Khashoggi, Germany halted new arms export approvals to Saudi Arabia, even though German companies lost contracts and other countries continued selling.',
        think: 'Discuss whether refusing to sell weapons makes a difference if others will sell them anyway.' } }
  ],
  advice: {
    realist: 'If we don\'t sell them, Karst will. Better our factory keeps its workers and we keep a friend.',
    liberal: 'The Arms Trade Treaty exists for exactly this decision. Monitor every rifle or do not sell any.',
    constructivist: 'What we sell says who we are. A country that sells rifles to shoot protesters cannot call itself a friend of protesters.',
    finance: '160 is an enormous number. So are 1,200 jobs. So, I suspect, is the number of protesters.'
  }
},
{
  id: 'PC5', area: 'conflict', concept: 'Power', related: 'Security dilemma',
  actor: { name: 'Alvenmark Defence Ministry', type: 'state', icon: 'handshake', state: 'karst' },
  title: 'Their Missiles, Our Soil', case: 'Cuban Missile Crisis, 1962',
  text: "Alvenmark offers to install a missile-defence system on the Brenn plateau: radar, interceptors, 300 Alvenmark technicians and generous rent. It says the system is 'purely defensive'. Karst's foreign minister says that a radar able to see 2,000 kilometres into Karst is not defensive, and that Karst 'will respond appropriately'. Karst's state television has started showing maps with the Brenn plateau circled in red.",
  options: [
    { label: 'Accept the missile-defence system.',
      effects: { power: 6, sov: -4, inter: 2, treasury: 60, rel: { alvenmark: 3, karst: -4 }, mood: 1 }, setFlags: ['missiles_hosted'], tags: ['hostile'], theory: [3, 1, 0],
      debrief: {
        explain: 'You chose security through alliance. You feel safer, but Karst feels less safe, which is the security dilemma: one state\'s defence looks like another\'s threat, and both may arm further.',
        parallel: 'US missile-defence sites in Romania (operational from 2016) and Poland were described by NATO as defensive against threats from outside Europe. Russia repeatedly objected that they threatened its own security.',
        think: 'To what extent does the security dilemma explain arms races?' } },
    { label: 'Refuse politely. We prefer not to be a target.',
      effects: { power: -2, sov: 4, rel: { alvenmark: -1, karst: 1 } }, theory: [1, 1, 1],
      debrief: {
        explain: 'You chose neutrality to avoid provoking a powerful neighbour. It lowers tension, but you give up a protective ally and the extra power it would bring, and Karst learns that its threats work.',
        parallel: 'In 2009, the United States shelved plans to place a radar station in the Czech Republic and interceptors in Poland, which Russia had opposed, replacing them with a different system. The original plans had divided public opinion in both host countries.',
        think: 'Evaluate whether neutrality is a realistic option for small states between great powers.' } },
    { label: 'Use the offer as a bargaining chip with Karst.', cost: { influence: 1 }, risk: 'High', theory: [3, 0, 1],
      gamble: { chance: 0.5,
        win: { text: 'Karst blinks. In exchange for your refusal, it withdraws two divisions from your border and signs a trade deal.', effects: { power: 3, sov: 4, treasury: 80, rel: { karst: 2 } } },
        lose: { text: 'Both sides feel used. Alvenmark withdraws the offer, and Karst circles the plateau again.', effects: { power: -3, legit: -3, rel: { alvenmark: -2, karst: -1 } } } },
      debrief: {
        explain: 'You tried to turn a great-power rivalry to your advantage. Small states sometimes win concessions by bargaining between big ones, but it is risky: if both sides decide you are unreliable, you can end up with neither.',
        parallel: 'The 1962 Cuban Missile Crisis ended when the Soviet Union removed its missiles from Cuba in exchange for a US promise not to invade Cuba and a secret agreement to remove US missiles from Turkey. Cuba itself was largely left out of the final bargain.',
        think: 'Discuss whether small states can gain from rivalries between great powers.' } }
  ],
  advice: {
    realist: 'Take the missiles. A powerful friend on our soil is the best answer to a powerful enemy next door.',
    liberal: 'Refuse. Every new missile makes the next one more likely. Someone has to stop the spiral.',
    constructivist: 'Karst does not fear radar. It fears what the radar means: that we have chosen a side.',
    finance: 'Rent is nice. Being circled in red on Karst television is less nice. I would like to know the price of bargaining before we do it.'
  }
},
{
  id: 'PC6', area: 'conflict', concept: 'Sovereignty', related: 'Conflict',
  actor: { name: 'Unknown attackers (probably Karst)', type: 'state', icon: 'chip', state: 'karst' },
  title: 'Lights Out', case: 'Cyberattacks on Ukraine\'s grid (2015) and Estonia (2007)',
  text: "At 6:12 p.m., in the middle of the evening rush, the lights went out across {capital}. Traffic signals, hospitals on backup power, the metro stuck between stations. Engineers have found malware in the grid's control systems. Your intelligence service says the code carries the fingerprints of a unit linked to Karst's military, 'with moderate confidence'. Karst has expressed 'sympathy for the inconvenience'.",
  options: [
    { label: 'Hack back. Show them we can do it too.', cost: { security: 1 },
      effects: { power: 6, sov: 2, legit: 1, inter: -3, rel: { karst: -2 }, mood: 1 }, setFlags: ['hacked_back'], theory: [3, 0, 0],
      debrief: {
        explain: 'You chose deterrence in cyberspace: hit back so the attacker thinks twice. It may work, but cyberattacks are hard to attribute and hard to control, and retaliation can start an escalating cycle.',
        parallel: 'The US military reportedly disrupted the internet access of Russia\'s Internet Research Agency on the day of the 2018 US midterm elections, an example of states using offensive cyber operations in response to interference.',
        think: 'To what extent does deterrence work in cyberspace?' } },
    { label: 'Publicly name Karst together with your allies.', cost: { influence: 1 },
      effects: { power: 1, legit: 6, inter: 3, rel: { karst: -2, alvenmark: 1 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You used attribution and diplomacy: naming the attacker in public with others, to raise the political cost of the attack and strengthen the norm that attacking civilian infrastructure is unacceptable.',
        parallel: 'In February 2018, the UK, US and several allies jointly attributed the 2017 NotPetya cyberattack, which caused billions of dollars of damage worldwide, to the Russian military.',
        think: 'Evaluate whether public attribution can deter cyberattacks.' } },
    { label: 'Say nothing. Quietly harden the grid.',
      effects: { power: -2, sov: 4, legit: -2, treasury: -80 }, theory: [1, 1, 0],
      debrief: {
        explain: 'You chose resilience over retaliation. Stronger defences protect sovereignty in the long run without escalating, but they cost money, and staying silent tells the attacker that this kind of attack has no price.',
        parallel: 'After large cyberattacks in 2007, Estonia invested heavily in digital defence and resilience. NATO\'s Cooperative Cyber Defence Centre of Excellence was established in Tallinn in 2008.',
        think: 'Discuss whether defence or deterrence is more important in protecting a state\'s sovereignty online.' } }
  ],
  advice: {
    realist: 'Hit back, quietly and hard. An attack with no consequences is an invitation.',
    liberal: 'Name them, with our allies. Shared norms against attacking hospitals only exist if someone enforces them.',
    constructivist: 'If no one ever says out loud that this is unacceptable, it slowly becomes acceptable.',
    finance: 'Hardening the grid costs 80. A second blackout costs the economy far more. Hacking back costs nothing, until Karst replies.'
  }
},
{
  id: 'PC7', area: 'conflict', concept: 'Legitimacy', related: 'Non-violence', protest: true,
  actor: { name: 'The Saturday Squares', type: 'movement', icon: 'crowd' },
  title: 'The Sit-In', case: 'People Power Revolution, Philippines, 1986',
  text: "Half a million people are sitting in Liberty Square in {capital}. They have been there for nine days. They are protesting rising prices and corruption charges against your transport minister. There has been no violence: they sing, share food, and sweep the square every night. Shops nearby have lost a fortune. The police chief says his officers can clear the square in one night 'with minimal force'.",
  options: [
    { label: 'Open a public dialogue with the movement\'s leaders.',
      effects: { power: -5, legit: 7 }, theory: [0, 2, 3],
      debrief: {
        explain: 'You treated peaceful protesters as citizens with a voice. Talking gives the movement recognition and may lead to reforms you would prefer to avoid, but it protects your legitimacy and avoids turning protesters into martyrs.',
        parallel: 'Research by Erica Chenoweth and Maria Stephan, covering campaigns from 1900 to 2006, found that nonviolent resistance campaigns succeeded roughly twice as often as violent ones, partly because they attract wider participation.',
        think: 'To what extent are nonviolent movements more effective than violent ones?' } },
    { label: 'Order the police to clear the square by force.',
      effects: { power: 6, legit: -14, inter: -2, rel: { alvenmark: -2 } }, setFlags: ['crackdown'], theory: [3, 0, 0],
      debrief: {
        explain: 'You restored order with direct violence. The square is empty by morning. But force against peaceful protest is one of the fastest ways to lose legitimacy at home and abroad, and it often makes movements larger, not smaller.',
        parallel: 'In June 1989, the Chinese government used the army to clear protesters from Tiananmen Square in Beijing, killing many people; the exact number is still disputed. The crackdown ended the protests and led to international sanctions.',
        think: 'Evaluate the relationship between violence and legitimacy in this case.' } },
    { label: 'Impose a night-time curfew and wait for the movement to tire.',
      effects: { power: 3, legit: -3, inter: -1 }, theory: [2, 0, 0],
      debrief: {
        explain: 'You chose a limited restriction. It shows control without a crackdown, and some protesters will go home. But curfews can create new confrontations, and waiting rarely makes the underlying grievances go away.',
        parallel: 'In February 1986, millions of Filipinos gathered peacefully on Manila\'s EDSA avenue. When soldiers refused to act against them, President Ferdinand Marcos fled the country within four days, in what became known as the People Power Revolution.',
        think: 'Discuss why security forces\' loyalty matters so much in moments of mass protest.' } }
  ],
  advice: {
    realist: 'A government that cannot control its own capital square cannot control anything. But do it with care.',
    liberal: 'Talk to them. Peaceful protest is a right, and a channel for anger that would otherwise find a worse one.',
    constructivist: 'They sweep the square every night. They are showing the world they are the responsible ones. Do not prove them right.',
    finance: 'The shops lose a fortune every day. A crackdown loses us Alvenmark\'s trade. Dialogue is the cheapest option and the least satisfying.'
  }
},
{
  id: 'PC8', area: 'conflict', concept: 'Sovereignty', related: 'Non-state actors',
  actor: { name: 'Ironvale Security Group', type: 'company', icon: 'rifle', state: 'karst' },
  title: 'Contractors', case: 'Wagner Group in the Central African Republic',
  text: "A private military company called Ironvale Security Group has made an offer. Its 800 contractors, many of them veterans of Karst's special forces, will defeat the Free Highlands Front within a year. Their price is low: modest fees, plus 25-year concessions on three gold mines in the highlands. Ironvale's director, a polite man in a very expensive suit, says his company 'only works with legitimate governments'.",
  options: [
    { label: 'Hire Ironvale.',
      effects: { power: 7, sov: -8, legit: -5, treasury: -30 }, setFlags: ['pmc_hired'], theory: [3, 0, 0],
      debrief: {
        explain: 'You outsourced the use of force. It is cheap and may work, but the state no longer holds a monopoly on violence in its own territory, and contractors loyal to their payers, not to you, now control valuable land.',
        parallel: 'Since 2018, the Wagner Group, a Russian private military organisation, has been reported in the Central African Republic, supporting the government against rebels. UN experts have linked it to human rights abuses and to concessions over gold and diamond mines.',
        think: 'To what extent do private military companies weaken state sovereignty?' } },
    { label: 'Refuse politely and show him out.',
      effects: { power: -1, sov: 1, legit: 1 }, theory: [1, 1, 1],
      debrief: {
        explain: 'You kept security in the hands of the state. Nothing changes: the insurgency continues, and so does your control over who carries weapons in your country.',
        parallel: 'Max Weber defined the state as the organisation that successfully claims a monopoly on the legitimate use of force within its territory. Many governments refuse private armies for exactly this reason.',
        think: 'Evaluate why the monopoly on the use of force matters to the idea of a state.' } },
    { label: 'Report the offer to the Concord\'s working group on mercenaries.',
      effects: { power: -2, legit: 4, inter: 2, rel: { karst: -1 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You turned an offer into evidence. It strengthens international efforts to regulate private armies and shows you play by the rules, but it irritates Karst, which is probably the company\'s quiet sponsor.',
        parallel: 'The 2008 Montreux Document, supported by dozens of states, sets out how international law applies to private military and security companies. A UN Working Group on the use of mercenaries monitors their activities.',
        think: 'Discuss whether international law can effectively regulate private military companies.' } }
  ],
  advice: {
    realist: 'Hire them, if you must, but never forget who really pays their wages. It is not us.',
    liberal: 'Report them. Private armies are a hole in international law, and the only way to close it is to shine a light.',
    constructivist: 'A state that rents its soldiers will find out that loyalty cannot be rented.',
    finance: 'The fee is low because the real price is in the mines. Gold is not cheap, Excellency. It only looks cheap from here.'
  }
},
{
  id: 'PC9', area: 'conflict', concept: 'Interdependence', related: 'Collective security',
  actor: { name: 'Concord Security Council', type: 'IGO', icon: 'globe', state: 'auric' },
  title: 'The Sanctions Vote', case: 'Security Council sanctions on Iraq, 1990',
  text: "The Auric Directorate has invaded Vellin, a tiny coastal state of 400,000 people, claiming it was 'historically Auric'. The Concord Security Council has imposed sanctions: no trade, no finance, no energy purchases. Sixty percent of {country}'s winter heating comes through the Auric pipeline. Your energy minister says stockpiles last six weeks. Alvenmark asks every partner to 'stand on the right side of history'.",
  options: [
    { label: 'Enforce the sanctions in full.',
      effects: { power: -2, legit: 7, inter: -5, treasury: -100, rel: { auric: -4, alvenmark: 2 } }, tags: ['hostile'], theory: [0, 3, 1],
      debrief: {
        explain: 'You chose collective security over your own economic interest. It costs you heavily this winter, but sanctions only work if members actually apply them, and you showed that aggression has a price.',
        parallel: 'After Iraq invaded Kuwait in August 1990, the UN Security Council passed Resolution 661, imposing broad sanctions on Iraq. Later, a US-led coalition authorised by the Council expelled Iraqi forces in 1991.',
        think: 'To what extent does collective security depend on states accepting costs for the common good?' } },
    { label: 'Comply on paper, but let some trade leak through.',
      effects: { power: 1, legit: -4, inter: 1, treasury: 60 }, setFlags: ['sanctions_leaked'], theory: [3, 0, 0],
      debrief: {
        explain: 'You protected your economy while pretending to support the rules. It works until it is discovered, and sanctions-busting is usually discovered. Then you lose credibility with both sides.',
        parallel: 'After 1965, UN sanctions on the white-minority regime in Rhodesia (now Zimbabwe) were widely evaded, with oil and goods flowing through neighbouring South Africa and Portuguese-ruled Mozambique.',
        think: 'Evaluate why sanctions often fail to change the behaviour of their targets.' } },
    { label: 'Publicly refuse. We cannot freeze for Vellin.',
      effects: { power: 1, sov: 6, legit: -8, inter: 2, treasury: 80, rel: { alvenmark: -3, auric: 2 } }, tags: ['cooperative'], theory: [3, 0, 1],
      debrief: {
        explain: 'You put your citizens\' heating and your energy ties first. Many voters understand. But you have broken with collective security, and every small state, including yours, depends on the idea that invasions are punished.',
        parallel: 'The 1973 oil embargo by Arab oil producers against states supporting Israel showed how energy dependence can be used as power. States that rely on one supplier face hard choices when that supplier breaks international rules.',
        think: 'Discuss how energy interdependence affects a state\'s foreign policy choices.' } }
  ],
  advice: {
    realist: 'We do not have the luxury of principles in February. Keep the gas flowing.',
    liberal: 'Enforce them. If invasions go unpunished, the next one could be ours.',
    constructivist: 'Today, Vellin. We are also small. What norm do we want to exist when it is our turn?',
    finance: 'Full sanctions cost 100 and some very cold flats. Refusing earns 80 and some very cold looks. I will be in my office, wearing a coat.'
  }
},
{
  id: 'PC10', area: 'conflict', concept: 'Peace', related: 'Collective security',
  actor: { name: 'Concord of Nations', type: 'IGO', icon: 'globe', state: 'drevania' },
  title: 'Blue Helmets', case: 'UN peacekeeping and Srebrenica, 1995',
  text: "A fragile ceasefire is holding in Drevania. The Concord is assembling a peacekeeping force to monitor it and asks {country} for a battalion of 600 soldiers. The Concord pays a fixed monthly rate per soldier, more than your army costs at home. The mandate allows force only in self-defence. Your army chief says his officers want the experience. Your opposition says 'we are not the world's police'.",
  options: [
    { label: 'Send a battalion.', cost: { security: 1 },
      effects: { power: 2, sov: -2, legit: 5, inter: 5, treasury: 60, rel: { drevania: 1 } }, setFlags: ['peacekeepers'], theory: [1, 3, 1],
      debrief: {
        explain: 'You contributed to collective security and earned income, experience and prestige. But peacekeepers with a limited mandate can face situations they are not allowed to stop, and your soldiers are now in danger.',
        parallel: 'In July 1995, Bosnian Serb forces killed about 8,000 Bosniak men and boys at Srebrenica, a UN-declared "safe area" guarded by lightly armed Dutch peacekeepers who were unable to stop the massacre.',
        think: 'To what extent can peacekeeping missions protect civilians?' } },
    { label: 'Send a field hospital and medics instead.', cost: { aid: 1 },
      effects: { legit: 4, inter: 3, treasury: -20, rel: { drevania: 1 } }, theory: [0, 2, 2],
      debrief: {
        explain: 'You contributed without putting combat troops at risk. Medical units are vital to missions and build goodwill, but your role is smaller, and so is the influence it brings.',
        parallel: 'Many countries contribute specialised units such as medical teams, engineers and police to UN missions rather than infantry. Countries such as Bangladesh, Nepal and India are among the largest troop contributors, partly for experience, prestige and reimbursement.',
        think: 'Evaluate the motives states have for contributing to peacekeeping.' } },
    { label: 'Decline. Our soldiers stay home.',
      effects: { power: 1, sov: 2, legit: -2, inter: -3 }, theory: [3, 0, 0],
      debrief: {
        explain: 'You kept your forces under national control and out of danger. But a ceasefire next door matters to you, and if it collapses, the refugees and spillover will arrive whether or not you helped.',
        parallel: 'States often decline peacekeeping requests because of risks to their soldiers. Research on UN missions has found that well-staffed peacekeeping operations are associated with fewer civilian deaths.',
        think: 'Discuss whether neighbouring states have a special responsibility to support peace in a nearby conflict.' } }
  ],
  advice: {
    realist: 'Send the battalion. The Concord pays, our officers learn, and we have eyes on Drevania. Just do not expect gratitude.',
    liberal: 'Send them. Peacekeeping is the most practical thing the Concord does.',
    constructivist: 'A blue helmet is a symbol of a different idea of what soldiers are for. That idea is worth spreading.',
    finance: 'The battalion earns us 60. The hospital costs us 20. Staying home costs nothing, until the ceasefire ends.'
  }
},
{
  id: 'PC11', area: 'conflict', concept: 'Interdependence', related: 'Conflict',
  actor: { name: 'The Federation of Karst', type: 'state', icon: 'fortress', state: 'karst' },
  title: 'The Dam Upstream', case: 'Grand Ethiopian Renaissance Dam dispute',
  text: "Karst is building the Hollow Gate Dam on the upper Sava, the river that supplies 80% of {country}'s fresh water. When finished, it will produce electricity for nine million Karst homes. Karst says it will release 'adequate' water. Your farmers in the Sava delta want to know what 'adequate' means. Your hydrologists estimate that filling the reservoir quickly could cut your water supply by a third for up to five years.",
  options: [
    { label: 'Negotiate a binding water-sharing treaty.', cost: { influence: 1 },
      effects: { power: -1, sov: -2, legit: 3, inter: 7, rel: { karst: 1 } }, tags: ['cooperative'], theory: [0, 3, 1],
      debrief: {
        explain: 'You turned a dispute over a shared resource into a cooperative agreement. A treaty limits both sides, but it gives you predictable water and creates a structure for managing future droughts.',
        parallel: 'The 1960 Indus Waters Treaty between India and Pakistan, brokered by the World Bank, divided the rivers of the Indus basin and remained in place through several wars, often cited as an example of water cooperation between rivals.',
        think: 'To what extent can shared resources encourage cooperation rather than conflict?' } },
    { label: 'Warn Karst that any threat to the river is a threat to our survival.',
      effects: { power: 5, sov: 3, legit: 2, inter: -5, rel: { karst: -3 }, mood: 1 }, tags: ['hostile'], theory: [3, 0, 0],
      debrief: {
        explain: 'You signalled that you would defend your water by any means. It shows resolve and may make Karst more careful, but threats against a stronger state are risky, and they make a deal harder.',
        parallel: 'The Grand Ethiopian Renaissance Dam on the Blue Nile, under construction since 2011, has caused a long dispute with Egypt and Sudan. Egyptian leaders have repeatedly described Nile water as an existential issue, while Ethiopia argues it has the right to develop its own resources.',
        think: 'Evaluate the risk of conflict over shared water resources in the future.' } },
    { label: 'Refer the dispute to an international court.',
      effects: { power: -2, legit: 4, inter: 2, treasury: -40 }, theory: [0, 2, 2],
      debrief: {
        explain: 'You chose legal process over power. A court can give a fair hearing, but cases take years, rulings can be ignored, and the dam keeps rising while the lawyers talk.',
        parallel: 'In the Gabčíkovo-Nagymaros case (1997), the International Court of Justice ruled on a dispute between Hungary and Slovakia over a dam project on the Danube, telling both sides to negotiate in good faith. They are still discussing how to implement the ruling.',
        think: 'Discuss whether international courts can resolve conflicts over natural resources.' } }
  ],
  advice: {
    realist: 'Water is survival. Make Karst understand that we know it, and that we will act.',
    liberal: 'A treaty. Rivers cross borders; rules for sharing them must too.',
    constructivist: 'If we treat the river as a shared system, Karst might too. If we treat it as a weapon, it will become one.',

CONTENT.callbacks = [
{

  actor: { name: 'Southern Basin Union', type: 'IGO', icon: 'globe' },
  title: 'Integration', case: 'Integration debates in Europe after 2015',
  text: "Remember when you opened the border at Hollin Ford? The Drevanian families who arrived now make up 5% of the population. Their children are top of the class in two provinces; their parents mostly work below their qualifications. A new party, the Homeland League, has jumped to 14% in the polls with posters showing a closed gate. The SBU offers integration funds for language classes and job training, if you match them.",

        parallel: 'Germany expanded its integration courses (language and civic orientation) after 2015. In the years that followed, anti-immigration parties gained ground in elections in several European countries, making integration a central political issue.',

        parallel: 'Canada adopted multiculturalism as official policy in 1971 and wrote it into law in 1988, presenting diversity as part of national identity. Supporters credit it with high public support for immigration; critics say it can divide communities.',

    { label: 'Tighten residency rules to take the wind out of the Homeland League.',

        parallel: 'Political scientists have studied whether mainstream parties that adopt tougher immigration positions reduce support for anti-immigration parties. Results are mixed, and some studies suggest it can make those parties\' ideas more acceptable.',

  advice: {

{

  title: 'Doors Closed Both Ways', case: 'Reciprocity in international relations',
  text: "Remember when you closed the border at Hollin Ford? This year a drought has ruined the harvest in your southern provinces. Thousands of young people want seasonal work in Port Selene's harbours and greenhouses. Selene has just suspended its work visa scheme for {country}. Its trade minister, asked why, read out your own interior ministry's statement from the border crisis, word for word, on live television.",
  options: [
    { label: 'Apologise publicly and offer to resettle 5,000 refugees in exchange.', cost: { influence: 1 },

      debrief: {
        explain: 'You admitted a past choice had costs and offered a trade. It reopens doors for your workers, but it reverses a decision many voters supported, and you look less consistent.',
        parallel: 'Reciprocity, treating others as they treat you, is one of the oldest principles in diplomacy and international law, shaping visa rules, trade tariffs and even the treatment of diplomats.',

    { label: 'Retaliate: suspend visas for Selene\'s citizens too.',

      debrief: {
        explain: 'You answered reciprocity with reciprocity. It shows you cannot be pushed around, but your jobless young people still cannot work abroad, and tit-for-tat can spiral into a wider breakdown.',
        parallel: 'In 2004, Brazil began fingerprinting and photographing US citizens arriving at its airports, in direct response to a new US programme that fingerprinted Brazilian visitors.',
        think: 'Evaluate whether tit-for-tat responses help or harm a state\'s interests.' } },
    { label: 'Create emergency public works jobs at home.',
      effects: { power: 1, sov: 2, legit: 4, treasury: -110 }, theory: [1, 1, 1],
      debrief: {
        explain: 'You solved the problem yourself, protecting sovereignty and helping the drought regions. It is expensive, and it leaves the deeper lesson unaddressed: your choices toward others shape how they treat you.',
        parallel: 'Public works programmes have long been used in crises, from the US New Deal in the 1930s to India\'s national rural employment guarantee, created in 2005, which promises rural households up to 100 days of paid work a year.',

  ],
  advice: {

},
{

        parallel: 'Human rights NGOs often work through "boomerang" pressure: when blocked at home, they persuade foreign governments and institutions to put pressure on the state from outside. Political scientists Margaret Keck and Kathryn Sikkink described this pattern in 1998.',

  advice: {

},
{
  id: 'CB4', area: 'conflict', concept: 'Legitimacy', related: 'Alignment', requires: ['warrant_ignored', 'left_tribunal'],

  text: "Remember the Director's visit and the Tribunal's warrant? Your choice that day was noticed. Alvenmark's envoys have become polite and distant. Meanwhile the Director has written personally, inviting {country} to join the Steppe Security Compact, a pact of states that 'respect each other's sovereignty and do not lecture'. Members get cheap gas, military training and a promise of mutual defence. The signing is in three weeks.",
  options: [
    { label: 'Join the Steppe Security Compact.',
      effects: { power: 6, sov: -3, legit: -5, inter: -3, treasury: 80, rel: { auric: 3, alvenmark: -3 } }, setFlags: ['joined_compact'], tags: ['cooperative'], theory: [3, 0, 1],

},

  text: "Remember the free cameras? A security researcher has found 6.1 million records from {capital}'s smart-city system for sale on a criminal forum: faces, names, addresses, daily routes to work. Helix says its servers abroad were 'not breached' and that the problem lies with 'a third-party analytics partner'. It will not say which one, citing foreign law. Your citizens want to know who has their faces.",

{
  id: 'CB6', area: 'development', concept: 'Legitimacy', related: 'Conditionality', protest: true, requires: ['gmr_loan'],

  text: "Remember the Reserve's loan? The conditions have arrived. Pension cuts took effect on the first of the month. Transport workers, teachers and nurses are on strike, and {capital}'s metro has not run for six days. The Reserve's review team lands next week. If you have not cut another 4% from public spending, the next tranche of the loan will be withheld.",

    { label: 'Renegotiate the timetable with the Reserve.', cost: { influence: 1 },

{
  id: 'CB7', area: 'conflict', concept: 'Sovereignty', related: 'Power', requires: ['karst_port'],
  actor: { name: 'The Federation of Karst', type: 'state', icon: 'fortress', state: 'karst' },
  title: 'A Grey Hull in Our Harbour', case: 'Foreign navies in host ports',
  text: "Remember the port Karst built at Kessel Bay? It is busy now, and profitable. This morning Karst's navy asked permission for three warships and a submarine to dock there for 'resupply and crew rest'. Alvenmark's ambassador called twenty minutes later to ask whether {country} is 'still a neutral partner'. Port workers say the ships are already waiting just outside your territorial waters.",
  options: [
    { label: 'Allow the visit. A port is a port.',

        explain: 'You let economic ties turn into a military relationship. Karst is pleased and the port earns fees, but other states now see your country as part of Karst\'s security network, which changes your position in every crisis.',

  advice: {

{

  title: 'Our Rifles on Their Screens', case: 'Arms licences revoked during the Arab Spring, 2011',
  text: "Remember the rifles from Varnhold? SNN has broadcast footage from the Directorate's eastern provinces: police firing on a crowd of striking miners. Eleven are dead. Freeze-frames show the rifles clearly, with your factory's stamp on the stock. Opposition MPs are holding up the screenshots in parliament. The Directorate has placed a second order, larger than the first.",

{

  title: 'Escalation', case: 'NotPetya, 2017',
  text: "Remember when you hacked back after the blackout? Karst has answered. This morning, the three largest banks in {country} froze: ATMs dark, salaries unpaid, card machines showing a skull. Engineers say the attack is more sophisticated than anything seen before. Karst's defence ministry denies everything, then adds that 'those who start cyber games should be ready to lose them'.",

      debrief: {

        parallel: 'The 2017 NotPetya attack began in Ukraine but spread worldwide, disrupting shipping, hospitals and factories and causing an estimated 10 billion dollars in damage, far beyond its apparent target.',

{
